<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso Cardio y Renal</title>
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --surface2:#f0ede8; --ink:#1d1b19; --muted:#6b655e; --line:#e2ddd5;
  --cardio:#b3261e; --cardio-soft:#fbe9e7; --renal:#0f6e74; --renal-soft:#e0f2f1;
  --accent:#3b4cca; --accent-soft:#e8eaff; --ok:#1e7d3a; --ok-soft:#e3f4e7; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#a86500; --warn-soft:#fff3dc;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151413; --surface:#1f1d1b; --surface2:#2a2724; --ink:#efebe6; --muted:#a59e95; --line:#38342f;
    --cardio:#ff8a80; --cardio-soft:#3a1f1d; --renal:#64d2d8; --renal-soft:#173133;
    --accent:#9aa6ff; --accent-soft:#272b4a; --ok:#7fd68f; --ok-soft:#1d3323; --bad:#ff8a80; --bad-soft:#3d1f1d; --warn:#f3c26b; --warn-soft:#3a2e17;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#151413; --surface:#1f1d1b; --surface2:#2a2724; --ink:#efebe6; --muted:#a59e95; --line:#38342f;
  --cardio:#ff8a80; --cardio-soft:#3a1f1d; --renal:#64d2d8; --renal-soft:#173133;
  --accent:#9aa6ff; --accent-soft:#272b4a; --ok:#7fd68f; --ok-soft:#1d3323; --bad:#ff8a80; --bad-soft:#3d1f1d; --warn:#f3c26b; --warn-soft:#3a2e17;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px}
.brand{min-width:0}
.brand{font-weight:750;letter-spacing:-.01em;font-size:1.05rem}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem}
nav.tabs{max-width:1100px;margin:0 auto;padding:10px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 12px 10px;border-bottom:2.5px solid transparent;white-space:nowrap;color:var(--muted);font-weight:550;font-size:.93rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;letter-spacing:-.02em;margin:.2em 0 .4em;line-height:1.2}
h2{font-size:1.25rem;letter-spacing:-.01em;margin:1.2em 0 .5em}
h3{font-size:1.05rem;margin:1.1em 0 .4em}
p{margin:.5em 0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pill{display:inline-block;white-space:nowrap;font-size:.72rem;font-weight:650;padding:2px 8px;border-radius:999px;letter-spacing:.02em;text-transform:uppercase}
.pill.cardio{background:var(--cardio-soft);color:var(--cardio)}
.pill.renal{background:var(--renal-soft);color:var(--renal)}
.pill.l1{background:var(--ok-soft);color:var(--ok)}
.pill.l2{background:var(--warn-soft);color:var(--warn)}
.pill.l3{background:var(--bad-soft);color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
select,input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:110px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#111}}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:8px 0;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:.95rem}
.q{font-size:1.08rem;font-weight:600;line-height:1.45}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress>i{display:block;height:100%;background:var(--accent);width:0}
.stat{font-variant-numeric:tabular-nums}
.bignum{font-size:2rem;font-weight:750;letter-spacing:-.02em}
details.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;box-shadow:var(--shadow)}
details.sum>summary{cursor:pointer;padding:14px 18px;font-weight:650;list-style:none;display:flex;gap:10px;align-items:center}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:1.2rem}
details.sum[open]>summary::after{content:"–"}
.sumbody{padding:0 18px 18px;overflow-x:auto}
.sumbody ul{padding-left:1.2em;margin:.4em 0}
.sumbody li{margin:.2em 0}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:.6em 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:650}
.tip{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:.6em 0;font-size:.94rem}
.alert{border-left:3px solid var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:.6em 0;font-size:.94rem}
/* flashcards */
.flip{perspective:1200px;cursor:pointer;user-select:none}
.flipin{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .flipin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.15rem;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--surface2);font-size:1.02rem}
.face .lbl{position:absolute;top:10px;left:14px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* seq */
.seqitem{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:6px 0;width:100%;text-align:left}
.seqitem .n{min-width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.seqitem.picked{opacity:.4}
.seqitem.ok{border-color:var(--ok);background:var(--ok-soft)}
.seqitem.bad{border-color:var(--bad);background:var(--bad-soft)}
.vf{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.vf:last-child{border-bottom:0}
.vf .s{flex:1}
.vf .b{display:flex;gap:6px}
.vf .b button{min-width:44px}
.hidev{filter:blur(6px);cursor:pointer;transition:filter .2s}
.hidev.show{filter:none}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.toc a{color:inherit}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.8em;background:var(--surface)}
svg text{fill:var(--ink)}
.hero{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:14px 0}
.hero .card{cursor:pointer}
.hero .card:hover{border-color:var(--accent)}
.hero h3{margin:.2em 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:600px){
  h1{font-size:1.35rem}
  .brand small{display:none}
  .card{padding:14px}
  .flipin{min-height:300px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">Repaso final · Cardiovascular y Renal<small>ARTI III · UNMdP · anatomía, histología, fisiología y clínica</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" title="Cambiar tema">◐ Tema</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>

<script>
const TOPICS=[], MCQ=[], DEV=[], FC=[], VF=[], SEQ=[], CASES=[];
const T=(id,n,title,sum)=>TOPICS.push({id,n,title,sum});
const M=(t,l,q,o,e)=>MCQ.push({t,l,q,o,e});      // o[0] = respuesta correcta (se mezcla al mostrar)
const D=(t,l,q,a)=>DEV.push({t,l,q,a});
const F=(t,f,b)=>FC.push({t,f,b});
const V=(t,s,v,e)=>VF.push({t,s,v,e});
const S=(t,title,items,e)=>SEQ.push({t,title,items,e});
const C=(t,title,story,steps)=>CASES.push({t,title,story,steps});

const VALORES=[
 {g:'Cardiovascular',rows:[
  ['Frecuencia cardíaca en reposo','60-100 lpm'],
  ['Presión arterial óptima / normal','&lt;120/80 · 120-129/80-84 mmHg'],
  ['Hipertensión arterial','≥140 y/o ≥90 mmHg (consultorio)'],
  ['Presión arterial media','≈ 93 mmHg (PAD + 1/3 PP)'],
  ['Gasto cardíaco (volumen minuto)','≈ 5 L/min (4-8)'],
  ['Índice cardíaco','2,5-4 L/min/m²'],
  ['Volumen de fin de diástole (VI)','110-120 mL'],
  ['Volumen de fin de sístole (VI)','40-50 mL'],
  ['Volumen sistólico','≈ 70 mL'],
  ['Fracción de eyección','55-70 % (≈ 60 %)'],
  ['Presión aurícula derecha','0-5 mmHg (≈ 0)'],
  ['Presión ventrículo derecho','25 / 0-5 mmHg'],
  ['Presión arteria pulmonar','25 / 8-10 mmHg (media ≈ 15)'],
  ['Presión capilar pulmonar (enclavamiento)','6-12 mmHg'],
  ['Presión ventrículo izquierdo','120 / 0-10 mmHg'],
  ['Presión aórtica','120 / 80 mmHg'],
  ['Presión capilar sistémica (media funcional)','≈ 17 mmHg'],
  ['Flujo coronario en reposo','≈ 225 mL/min (4-5 % del GC)'],
  ['Extracción de O₂ miocárdica en reposo','≈ 70-75 %'],
  ['Presión venosa yugular','&lt; 3-4 cm sobre el ángulo de Louis (≈ &lt;8 cmH₂O)'],
  ['Choque de punta','5.º EIC, línea medioclavicular izq., ≤ 2-2,5 cm']
 ]},
 {g:'Electrocardiograma',rows:[
  ['Velocidad del papel / calibración','25 mm/s · 10 mm = 1 mV'],
  ['1 cuadradito / 1 cuadrado grande','0,04 s / 0,20 s'],
  ['Onda P','&lt; 0,12 s y &lt; 2,5 mm'],
  ['Intervalo PR','0,12-0,20 s'],
  ['Complejo QRS','0,06-0,10 s (patológico ≥ 0,12)'],
  ['Intervalo QT corregido','&lt; 0,44 s (H) / &lt; 0,46 s (M) aprox.'],
  ['Eje eléctrico normal','−30° a +90° (promedio ≈ +60°)'],
  ['Q patológica','≥ 0,04 s y/o ≥ 25 % de la R'],
  ['Potencial de reposo ventricular','≈ −90 mV'],
  ['Potencial diastólico máximo nodo SA','≈ −55 a −60 mV (umbral ≈ −40)'],
  ['Frecuencia intrínseca SA / AV / Purkinje','70-80 / 40-60 / 15-40 lpm'],
  ['Velocidad de conducción Purkinje / nodo AV','1,5-4 m/s / 0,02-0,05 m/s']
 ]},
 {g:'Líquidos corporales y riñón',rows:[
  ['Agua corporal total','≈ 60 % del peso (≈ 42 L en 70 kg)'],
  ['Líquido intracelular','≈ 40 % del peso (28 L)'],
  ['Líquido extracelular','≈ 20 % del peso (14 L)'],
  ['Intersticial / plasma','≈ 11 L / ≈ 3 L'],
  ['Volumen sanguíneo','≈ 5 L (≈ 7 % del peso)'],
  ['Osmolaridad plasmática','280-295 mOsm/L'],

  ['Diuresis normal','≈ 1-1,5 L/día (0,5-1 mL/kg/h)'],
  ['Oliguria / anuria / poliuria','&lt; 400-500 mL/día · &lt; 100 mL/día · &gt; 3 L/día'],

  ['Proteinuria normal','&lt; 150 mg/24 h (albuminuria &lt; 30 mg/24 h)'],

 {g:'Electrolitos y ácido-base',rows:[

  ['Potasio','3,5-5 mEq/L'],
  ['Cloro','98-106 mEq/L'],
  ['Calcio total / iónico','8,5-10,5 mg/dL / 4,5-5,3 mg/dL'],
  ['Fósforo','2,5-4,5 mg/dL'],
  ['Magnesio','1,7-2,4 mg/dL'],
  ['pH arterial','7,35-7,45'],
  ['PaCO₂','35-45 mmHg'],
  ['HCO₃⁻','22-26 mEq/L'],
  ['PaO₂','80-100 mmHg'],

];

T('c1','cardio','Anatomía del corazón y pericardio',`
<h3>Ubicación y orientación</h3>
<ul>
<li>Está en el <b>mediastino medio</b>, dentro del pericardio, apoyado sobre el diafragma. ~2/3 a la izquierda de la línea media.</li>
<li>Forma de pirámide inclinada: <b>base</b> (posterior) = sobre todo <b>aurícula izquierda</b> (y parte de la AD); <b>vértice o ápex</b> (anteroinferior izquierdo) = <b>ventrículo izquierdo</b>, a nivel del <b>5.º espacio intercostal izquierdo, línea medioclavicular</b>.</li>
<li><b>Cara esternocostal (anterior)</b>: principalmente <b>ventrículo derecho</b>. <b>Cara diafragmática (inferior)</b>: VI y parte del VD. <b>Cara pulmonar izquierda</b>: VI.</li>
<li><b>Bordes</b>: derecho = <b>AD</b>; inferior = VD (y algo de VI); izquierdo = VI (y orejuela izquierda); superior = aurículas y orejuelas.</li>
<li>Surcos: <b>coronario</b> (auriculoventricular), <b>interventricular anterior</b> y <b>posterior</b>; llevan los vasos coronarios.</li>
</ul>
<h3>Cavidades</h3>
<table><tr><th>Cavidad</th><th>Características clave</th></tr>
<tr><td>Aurícula derecha</td><td>Recibe VCS, VCI (con válvula de Eustaquio) y <b>seno coronario</b> (válvula de Tebesio). Parte lisa (seno de las venas cavas) y parte rugosa con <b>músculos pectíneos</b>, separadas por la <b>cresta terminal</b> (surco terminal por fuera). <b>Orejuela derecha</b>. En el tabique: <b>fosa oval</b> (resto del foramen oval) con su limbo.</td></tr>
<tr><td>Ventrículo derecho</td><td>Paredes delgadas (3-5 mm). <b>Trabéculas carnosas</b>, <b>cresta supraventricular</b> (separa entrada de salida), <b>trabécula septomarginal (banda moderadora)</b> que lleva la <b>rama derecha del haz de His</b> al músculo papilar anterior. <b>Cono arterioso (infundíbulo)</b> liso hacia la pulmonar. Válvula <b>tricúspide</b>: valvas anterior, posterior y septal; 3 músculos papilares.</td></tr>
<tr><td>Aurícula izquierda</td><td>Recibe las <b>4 venas pulmonares</b>. Mayormente lisa; <b>orejuela izquierda</b> con pectíneos. Forma la mayor parte de la base. Relación posterior con el <b>esófago</b>.</td></tr>
<tr><td>Ventrículo izquierdo</td><td>Pared 2-3 veces más gruesa (10-15 mm) porque trabaja contra la presión sistémica. Válvula <b>mitral (bicúspide)</b>: valvas anterior y posterior; <b>2 músculos papilares</b> (anterior y posterior). <b>Vestíbulo aórtico</b> liso hacia la aorta.</td></tr></table>
<h3>Válvulas</h3>
<ul>
<li><b>Auriculoventriculares</b> (tricúspide y mitral): valvas unidas por <b>cuerdas tendinosas</b> a los <b>músculos papilares</b>, que se contraen en sístole y evitan el prolapso (eversión) de las valvas hacia la aurícula.</li>
<li><b>Semilunares (sigmoideas)</b>: <b>pulmonar</b> (valvas anterior, derecha, izquierda) y <b>aórtica</b> (derecha, izquierda y posterior/no coronaria). Sin cuerdas. Detrás de las valvas aórticas están los <b>senos aórticos (de Valsalva)</b>: del derecho nace la <b>coronaria derecha</b> y del izquierdo la <b>coronaria izquierda</b>.</li>
<li><b>Esqueleto fibroso</b>: 4 anillos fibrosos + trígonos fibrosos. Funciones: sostén e inserción de válvulas y miocardio, y <b>aislamiento eléctrico entre aurículas y ventrículos</b> (el impulso solo pasa por el haz de His).</li>
</ul>
<h3>Pericardio</h3>
<ul>
<li><b>Pericardio fibroso</b>: saco externo resistente, fijo al centro tendinoso del diafragma (ligamento pericardiofrénico) y al esternón (ligamentos esternopericárdicos). Se continúa con la adventicia de los grandes vasos. Evita la dilatación aguda excesiva.</li>
<li><b>Pericardio seroso</b>: hoja <b>parietal</b> (tapiza por dentro al fibroso) y hoja <b>visceral = epicardio</b>. Entre ambas, la <b>cavidad pericárdica</b> con una película de líquido (≈ 15-50 mL) que reduce la fricción.</li>
<li><b>Seno transverso</b>: detrás de aorta y tronco pulmonar, delante de la VCS (útil en cirugía para pinzar). <b>Seno oblicuo</b>: detrás de la AI, entre las venas pulmonares.</li>
<li>Irrigación: <b>arterias pericardiofrénicas</b> (de la torácica interna). Inervación: <b>nervios frénicos</b> (C3-C5) → el dolor pericárdico se refiere al hombro/cuello. El epicardio es insensible al dolor.</li>
<li><b>Taponamiento cardíaco</b>: líquido o sangre que comprime el corazón e impide el llenado → <b>tríada de Beck</b>: hipotensión, ingurgitación yugular, ruidos cardíacos apagados. Pulso paradójico.</li>
</ul>
<h3>Inervación del corazón</h3>
<ul><li><b>Plexo cardíaco</b>. <b>Simpático</b> (T1-T4/T5, ganglios cervicales y torácicos): ↑ FC, ↑ contractilidad. <b>Parasimpático</b> (nervio <b>vago</b>): ↓ FC (actúa sobre todo en nodos SA y AV). Las aferencias de dolor viajan con el simpático → <b>dolor referido</b> al lado izquierdo del tórax y cara medial del brazo izquierdo (T1-T4).</li></ul>
`);

T('c2','cardio','Irrigación coronaria y drenaje venoso',`
<h3>Arterias coronarias (nacen de los senos aórticos)</h3>
<table><tr><th>Arteria</th><th>Ramas</th><th>Territorio</th></tr>
<tr><td><b>Coronaria derecha (CD)</b><br>por el surco coronario derecho</td><td>Rama del <b>nodo SA</b> (~60 %) · rama marginal derecha · <b>interventricular posterior (descendente posterior)</b> en dominancia derecha · rama del <b>nodo AV</b> (~80 %)</td><td>AD, mayor parte del VD, cara diafragmática del VI, 1/3 posterior del tabique, nodos SA y AV</td></tr>
<tr><td><b>Coronaria izquierda (tronco)</b><br>corto, entre tronco pulmonar y orejuela izq.</td><td><b>Interventricular anterior (descendente anterior, DA)</b>: ramas diagonales y septales · <b>Circunfleja (Cx)</b>: marginal izquierda (obtusa marginal)</td><td>AI, mayor parte del VI, cara anterior del VD, <b>2/3 anteriores del tabique</b> (incluye ramas del haz de His)</td></tr></table>
<ul>
<li><b>Dominancia</b>: la define qué arteria da la <b>interventricular posterior</b>. Dominancia derecha ≈ 67-70 %; izquierda (Cx) ≈ 15 %; codominancia el resto.</li>
<li>La <b>DA</b> es la arteria más frecuentemente obstruida ("la arteria de la muerte súbita"): irriga la pared anterior y el tabique.</li>
<li>Las coronarias son <b>funcionalmente terminales</b>: las anastomosis entre ellas son escasas, por eso la oclusión súbita produce infarto. En la oclusión lenta puede desarrollarse circulación colateral.</li>
</ul>
<h3>Drenaje venoso</h3>
<ul>
<li><b>Seno coronario</b>: en la parte posterior del surco coronario; desemboca en la <b>AD</b>. Recibe:
<ul><li><b>Vena cardíaca magna</b> (acompaña a la DA y luego a la Cx).</li><li><b>Vena cardíaca media</b> (acompaña a la interventricular posterior).</li><li><b>Vena cardíaca menor</b> (acompaña a la marginal derecha).</li><li>Vena oblicua de la AI y vena posterior del VI.</li></ul></li>
<li><b>Venas cardíacas anteriores</b>: drenan directo en la AD.</li>
<li><b>Venas cardíacas mínimas (de Tebesio)</b>: drenan directo en las cavidades.</li>
</ul>
<div class="tip">Correlación ECG: <b>anterior/septal</b> (V1-V4) → DA · <b>lateral</b> (DI, aVL, V5-V6) → Cx o diagonales · <b>inferior</b> (DII, DIII, aVF) → CD (en dominancia derecha).</div>
`);

T('c3','cardio','Histología cardiovascular',`
<h3>Pared del corazón (de adentro hacia afuera)</h3>
<ul>
<li><b>Endocardio</b>: endotelio + capa subendotelial de tejido conectivo + capa subendocárdica (conectivo laxo con vasos, nervios y <b>fibras de Purkinje</b>). Recubre también las válvulas.</li>
<li><b>Miocardio</b>: músculo cardíaco; la capa más gruesa (más en el VI).</li>
<li><b>Epicardio</b> = hoja visceral del pericardio seroso: <b>mesotelio</b> + tejido conectivo y adiposo, donde corren las <b>arterias coronarias</b> y venas.</li>
</ul>
<h3>Cardiomiocito</h3>
<ul>
<li>Músculo <b>estriado involuntario</b>; células <b>ramificadas</b>, con <b>1 (a veces 2) núcleo central</b>.</li>
<li>Unidas por <b>discos intercalares</b> (aspecto en escalera): <b>porción transversal</b> con <b>uniones adherentes</b> (fascia adherens, anclan actina) y <b>desmosomas</b> (resistencia mecánica); <b>porción lateral</b> con <b>uniones de hendidura (nexos, gap junctions, conexina 43)</b> que permiten el paso iónico → el miocardio funciona como un <b>sincitio funcional</b>.</li>
<li><b>Túbulos T</b> grandes ubicados a nivel de la <b>línea Z</b>; el retículo sarcoplásmico es menos desarrollado que en el esquelético → forman <b>díadas</b> (un túbulo T + una cisterna), no tríadas.</li>
<li>Muchísimas <b>mitocondrias</b> (≈ 40 % del volumen), glucógeno y mioglobina: metabolismo aeróbico continuo.</li>
<li>Las fibras <b>auriculares</b> tienen <b>gránulos de péptido natriurético auricular (PNA)</b>: el corazón es también una glándula endocrina.</li>
<li>Capacidad de regeneración prácticamente nula: tras un infarto el tejido se reemplaza por <b>cicatriz fibrosa</b>.</li>
</ul>
<h3>Células de conducción</h3>
<ul><li><b>Fibras de Purkinje</b>: más grandes y pálidas que las contráctiles, <b>pocas miofibrillas</b> (periféricas), mucho <b>glucógeno</b>, abundantes nexos → conducción muy rápida. Se ubican en el subendocardio.</li>
<li>Nodos SA y AV: células pequeñas, pocas miofibrillas, rodeadas de tejido conectivo denso.</li></ul>
<h3>Vasos sanguíneos: tres túnicas</h3>
<ul><li><b>Íntima</b>: endotelio + capa subendotelial + <b>lámina elástica interna</b>.</li>
<li><b>Media</b>: músculo liso y elastina (la más gruesa en arterias).</li>
<li><b>Adventicia</b>: conectivo con <b>vasa vasorum</b> y <b>nervi vasorum</b> (la más gruesa en venas).</li></ul>
<table><tr><th>Vaso</th><th>Rasgo histológico característico</th><th>Función</th></tr>
<tr><td><b>Arteria elástica</b> (aorta, pulmonar, carótida común, subclavia)</td><td>Media con <b>láminas elásticas fenestradas</b> concéntricas</td><td>Conducción; "efecto Windkessel": amortigua la pulsatilidad y mantiene el flujo en diástole</td></tr>
<tr><td><b>Arteria muscular</b> (de distribución)</td><td>Media de músculo liso; <b>lámina elástica interna muy marcada</b> (y externa)</td><td>Distribuye y regula el flujo a órganos</td></tr>
<tr><td><b>Arteriola</b></td><td>1-2 capas de músculo liso</td><td><b>Vasos de resistencia</b>: mayor caída de presión; regulan el flujo capilar</td></tr>
<tr><td><b>Capilar continuo</b></td><td>Endotelio sin poros, lámina basal continua</td><td>Músculo, pulmón, piel, SNC (barrera hematoencefálica)</td></tr>
<tr><td><b>Capilar fenestrado</b></td><td>Endotelio con poros (fenestraciones)</td><td><b>Glomérulo renal</b>, glándulas endocrinas, intestino</td></tr>
<tr><td><b>Capilar sinusoide (discontinuo)</b></td><td>Luz amplia, endotelio y lámina basal discontinuos</td><td>Hígado, bazo, médula ósea</td></tr>
<tr><td><b>Vénulas y venas</b></td><td>Pared delgada, luz amplia, adventicia gruesa; <b>válvulas</b> en miembros</td><td><b>Vasos de capacitancia</b>: contienen ~64 % de la volemia</td></tr></table>
<p>Los <b>pericitos</b> rodean capilares y vénulas (células contráctiles con capacidad de diferenciación).</p>
`);

T('c4','cardio','Electrofisiología: potencial de acción y sistema de conducción',`
<h3>Potencial de acción de la fibra ventricular (rápida)</h3>
<table><tr><th>Fase</th><th>Qué pasa</th><th>Corriente</th></tr>
<tr><td>4 · Reposo</td><td>≈ −90 mV, estable</td><td>Salida de K⁺ por canales rectificadores de entrada (I<sub>K1</sub>); Na⁺/K⁺-ATPasa</td></tr>
<tr><td>0 · Despolarización rápida</td><td>Sube a ≈ +20 mV</td><td><b>Entrada de Na⁺</b> por canales rápidos de Na⁺</td></tr>
<tr><td>1 · Repolarización inicial</td><td>Pequeña caída ("muesca")</td><td>Cierre de Na⁺ + salida transitoria de K⁺ (I<sub>to</sub>)</td></tr>
<tr><td>2 · <b>Meseta</b></td><td>≈ 0 mV durante 0,2-0,3 s</td><td><b>Entrada de Ca²⁺ por canales lentos tipo L</b> equilibrada con salida de K⁺ (↓ permeabilidad al K⁺)</td></tr>
<tr><td>3 · Repolarización rápida</td><td>Vuelve a −90 mV</td><td>Cierre de Ca²⁺ y <b>salida de K⁺</b> (I<sub>Kr</sub>, I<sub>Ks</sub>)</td></tr></table>
<ul>
<li>La <b>meseta</b> prolonga el PA (≈ 0,25-0,30 s; el del músculo esquelético dura 1-5 ms) y con él el <b>período refractario</b>.</li>
<li><b>Período refractario absoluto</b> ventricular ≈ 0,25-0,30 s (cubre casi toda la contracción) → <b>el corazón no puede tetanizarse</b>. Período refractario relativo ≈ 0,05 s. En aurículas el refractario es más corto (≈ 0,15 s).</li>
</ul>
<h3>Potencial de acción del nodo sinusal (lento, automático)</h3>
<ul>
<li>No tiene potencial de reposo estable: <b>potencial diastólico máximo ≈ −55 a −60 mV</b>. Es menos negativo porque las membranas son más permeables al Na⁺.</li>
<li><b>Fase 4 = despolarización diastólica espontánea (prepotencial)</b>: corriente <b>I<sub>f</sub> ("funny")</b> de Na⁺ que se activa con la hiperpolarización + canales de Ca²⁺ tipo T, hasta el umbral ≈ −40 mV.</li>
<li><b>Fase 0</b> lenta: <b>entrada de Ca²⁺ por canales tipo L</b> (los canales rápidos de Na⁺ están inactivados a ese voltaje).</li>
<li><b>Fase 3</b>: salida de K⁺. No hay fases 1 y 2 netas.</li>
<li><b>Simpático</b> (noradrenalina, β1 → AMPc): ↑ I<sub>f</sub> y Ca²⁺ → ↑ pendiente de fase 4 → <b>↑ FC</b> (cronotropismo +). <b>Vago</b> (acetilcolina, M2): abre canales de K⁺ (hiperpolariza) y ↓ I<sub>f</sub> → ↓ pendiente → <b>↓ FC</b>.</li>
</ul>
<h3>Sistema de conducción</h3>
<ol>
<li><b>Nodo sinoauricular (SA)</b>: en la pared superolateral de la AD, en la unión con la VCS (extremo superior de la cresta terminal), subepicárdico. <b>Marcapasos normal</b> porque tiene la mayor frecuencia de descarga (70-80/min).</li>
<li><b>Vías internodales</b> anterior (con el haz de Bachmann hacia la AI), media y posterior.</li>
<li><b>Nodo auriculoventricular (AV)</b>: en el tabique interauricular, cerca del orificio del seno coronario (triángulo de Koch). Produce el <b>retraso AV</b> (≈ 0,09 s en el nodo; ≈ 0,13-0,16 s desde el SA hasta el tabique ventricular): permite que las aurículas terminen de vaciarse antes de la sístole ventricular. Causas del retraso: fibras pequeñas, pocas uniones de hendidura, potencial de reposo menos negativo.</li>
<li><b>Haz de His</b>: atraviesa el esqueleto fibroso (único camino AV) → conducción unidireccional.</li>
<li><b>Ramas derecha e izquierda</b> (la izquierda se divide en fascículo anterior y posterior). La derecha viaja por la trabécula septomarginal.</li>
<li><b>Red de Purkinje</b> subendocárdica → conducción muy rápida (1,5-4 m/s) → contracción casi simultánea de ambos ventrículos. Los ventrículos se despolarizan del <b>endocardio al epicardio</b> y del tabique (izq → der) al ápex y a la base.</li>
</ol>
<table><tr><th>Estructura</th><th>Frecuencia intrínseca</th><th>Velocidad de conducción</th></tr>
<tr><td>Nodo SA</td><td>70-80 /min</td><td>—</td></tr><tr><td>Músculo auricular</td><td>—</td><td>≈ 0,3 m/s</td></tr><tr><td>Nodo AV</td><td>40-60 /min</td><td><b>0,02-0,05 m/s (la más lenta)</b></td></tr><tr><td>Purkinje</td><td>15-40 /min</td><td><b>1,5-4 m/s (la más rápida)</b></td></tr><tr><td>Músculo ventricular</td><td>—</td><td>0,3-0,5 m/s</td></tr></table>
<p><b>Marcapasos ectópico</b>: si otro sitio descarga más rápido que el SA, o si el impulso se bloquea. En el <b>bloqueo AV completo</b> los ventrículos laten a 15-40/min (ritmo idioventricular); en los primeros segundos puede haber asistolia (síndrome de <b>Stokes-Adams</b>).</p>
<h3>Acoplamiento excitación-contracción</h3>
<ol><li>El PA viaja por los túbulos T → abre <b>canales de Ca²⁺ tipo L (receptores de dihidropiridina)</b>.</li><li>Ese Ca²⁺ dispara la <b>liberación de Ca²⁺ desde el retículo sarcoplásmico</b> por los <b>receptores de rianodina (RyR2)</b>: "liberación de Ca²⁺ inducida por Ca²⁺".</li><li>Ca²⁺ se une a la <b>troponina C</b> → la tropomiosina deja libre el sitio de la actina → puentes cruzados.</li><li>Relajación: recaptación por <b>SERCA</b> (regulada por fosfolambano) y salida por el <b>intercambiador Na⁺/Ca²⁺</b> y Ca²⁺-ATPasa del sarcolema.</li></ol>
<p>La fuerza depende mucho del Ca²⁺ extracelular (a diferencia del esquelético). <b>Digitálicos</b>: inhiben la Na⁺/K⁺-ATPasa → ↑ Na⁺ intracelular → menos salida de Ca²⁺ por el intercambiador → ↑ contractilidad.</p>
<div class="tip">Iones: <b>hiperpotasemia</b> → corazón dilatado y flácido, conducción lenta, bloqueos (despolariza el reposo e inactiva canales de Na⁺). <b>Hipercalcemia</b> marcada → contracción espástica. <b>Fiebre</b> ↑ FC; hipotermia ↓ FC.</div>
`);

T('c5','cardio','Electrocardiograma normal: análisis vectorial y eje',`
<svg viewBox="0 0 520 200" width="100%" style="max-width:560px" role="img" aria-label="Complejo ECG con ondas e intervalos">
<g stroke="currentColor" fill="none" stroke-width="2.2" style="color:var(--cardio)"><path d="M10 120 H60 q15 -22 30 0 H130 l6 10 l12 -95 l12 110 l8 -25 H230 q30 -45 60 0 H340 q10 -10 20 0 H510"/></g>
<g font-size="13" font-weight="700"><text x="68" y="90">P</text><text x="128" y="148">Q</text><text x="150" y="28">R</text><text x="163" y="160">S</text><text x="252" y="70">T</text><text x="343" y="104">U</text></g>
<g stroke="var(--muted)" stroke-width="1.2"><line x1="60" y1="160" x2="136" y2="160"/><line x1="136" y1="184" x2="172" y2="184"/><line x1="136" y1="10" x2="290" y2="10"/><line x1="172" y1="100" x2="230" y2="100" stroke-dasharray="3 3"/></g>
<g font-size="11" fill="var(--muted)"><text x="62" y="175" style="fill:var(--muted)">PR 0,12-0,20 s</text><text x="178" y="188" style="fill:var(--muted)">QRS &lt;0,12 s</text><text x="300" y="14" style="fill:var(--muted)">QT</text><text x="176" y="96" style="fill:var(--muted)">ST</text></g>
</svg>
<h3>Qué representa cada componente</h3>
<table><tr><th>Componente</th><th>Significado</th><th>Normal</th></tr>
<tr><td>Onda P</td><td>Despolarización auricular</td><td>&lt; 0,12 s y &lt; 2,5 mm; positiva en DI, DII, aVF; negativa en aVR</td></tr>
<tr><td>Intervalo PR</td><td>Desde el inicio de P hasta el inicio de QRS: conducción auricular + <b>retraso AV</b> + His-Purkinje</td><td>0,12-0,20 s (&gt;0,20 = bloqueo AV de 1.er grado)</td></tr>
<tr><td>Complejo QRS</td><td>Despolarización ventricular (tapa la repolarización auricular)</td><td>0,06-0,10 s</td></tr>
<tr><td>Segmento ST</td><td>Ventrículos totalmente despolarizados (meseta)</td><td>Isoeléctrico</td></tr>
<tr><td>Onda T</td><td>Repolarización ventricular</td><td>Mismo sentido que el QRS (porque la repolarización va del epicardio al endocardio, al revés que la despolarización)</td></tr>
<tr><td>Intervalo QT</td><td>Sístole eléctrica ventricular (despolarización + repolarización)</td><td>≈ 0,35-0,44 s; varía con la FC → se corrige (QTc, Bazett: QT/√RR)</td></tr>
<tr><td>Onda U</td><td>Repolarización tardía (Purkinje/músculos papilares)</td><td>Pequeña; prominente en hipopotasemia</td></tr></table>
<h3>El papel</h3>
<ul><li>25 mm/s → <b>1 mm (cuadradito) = 0,04 s</b>; <b>5 mm (cuadrado grande) = 0,20 s</b>; 5 cuadrados grandes = 1 s.</li><li>Calibración: <b>10 mm = 1 mV</b>.</li><li><b>FC</b> (ritmo regular) = <b>1500 / cuadraditos entre R-R</b> o <b>300 / cuadrados grandes</b>. Regla rápida: 300-150-100-75-60-50. Ritmo irregular: contar QRS en 6 s × 10.</li></ul>
<h3>Derivaciones</h3>
<table><tr><th>Plano frontal</th><th>Ángulo</th><th></th><th>Plano horizontal (precordiales)</th><th>Ubicación</th></tr>
<tr><td>DI (BI − BD)</td><td>0°</td><td></td><td>V1</td><td>4.º EIC paraesternal derecho</td></tr>
<tr><td>DII (PI − BD)</td><td>+60°</td><td></td><td>V2</td><td>4.º EIC paraesternal izquierdo</td></tr>
<tr><td>DIII (PI − BI)</td><td>+120°</td><td></td><td>V3</td><td>Entre V2 y V4</td></tr>
<tr><td>aVR</td><td>−150°</td><td></td><td>V4</td><td>5.º EIC, línea medioclavicular izq.</td></tr>
<tr><td>aVL</td><td>−30°</td><td></td><td>V5</td><td>5.º EIC, línea axilar anterior</td></tr>
<tr><td>aVF</td><td>+90°</td><td></td><td>V6</td><td>5.º EIC, línea axilar media</td></tr></table>
<ul><li>Bipolares (DI, DII, DIII) forman el <b>triángulo de Einthoven</b>. <b>Ley de Einthoven: DII = DI + DIII</b>.</li>
<li>Monopolares aumentadas (aVR, aVL, aVF) — Goldberger. Precordiales — Wilson (terminal central).</li>
<li>Juntas forman el <b>sistema hexaxial</b>. En precordiales, la R crece de V1 (rS) a V5-V6 (qR): <b>progresión de la onda R</b>; la <b>zona de transición</b> (R = S) suele estar en V3-V4.</li></ul>
<h3>Análisis vectorial</h3>
<ul><li>Un <b>vector</b> indica dirección y magnitud de la corriente de despolarización. Si se acerca al electrodo positivo → deflexión <b>positiva</b>; si se aleja → <b>negativa</b>; si es perpendicular → <b>isodifásica</b>.</li>
<li>Secuencia de la despolarización ventricular: <b>vector 1 septal</b> (izq → der: q pequeña en DI y V6, r en V1) → <b>vector 2 de pared libre/ápex</b> (el mayor, hacia abajo e izquierda por la mayor masa del VI) → <b>vector 3 basal</b> (hacia arriba y atrás).</li>
<li>El último en despolarizarse es la base del VI posterior.</li></ul>
<h3>Eje eléctrico medio del QRS</h3>
<ul><li>Normal: <b>−30° a +90°</b> (Guyton: promedio ≈ +59°). Desviación <b>izquierda</b>: más negativo que −30° (HVI, hemibloqueo anterior izq., obesidad, embarazo). Desviación <b>derecha</b>: más de +90° (HVD, EPOC, TEP, hemibloqueo posterior, personas delgadas/altas).</li>
<li><b>Método de cuadrantes</b> con DI y aVF: (+,+) normal · (+,−) mirar DII: si DII + es normal (0 a −30), si DII − desviación izquierda · (−,+) desviación derecha · (−,−) eje extremo.</li>
<li><b>Método de la derivación isodifásica</b>: el eje es perpendicular a la derivación donde el QRS es isodifásico, y se elige el sentido según otra derivación.</li>
<li>Método vectorial: graficar la amplitud neta (R − S) de dos derivaciones en el hexaxial y trazar la resultante.</li></ul>
<h3>Lectura sistemática</h3>
<ol><li>Ritmo (¿sinusal? P antes de cada QRS, P positiva en DII, PR constante).</li><li>Frecuencia.</li><li>Eje.</li><li>Onda P, PR, QRS, ST, T, QT.</li><li>Hipertrofias, isquemia/lesión/necrosis.</li></ol>
`);

T('c6','cardio','Ciclo cardíaco y su semiología',`
<p>Ciclo cardíaco = todo lo que ocurre entre el comienzo de un latido y el siguiente. A 75 lpm dura ≈ 0,8 s (sístole ≈ 0,3 s, diástole ≈ 0,5 s). Al aumentar la FC <b>se acorta sobre todo la diástole</b>.</p>
<h3>Fases (VI)</h3>
<table><tr><th>Fase</th><th>Válvulas</th><th>Qué pasa</th><th>ECG / ruidos</th></tr>
<tr><td>1. Contracción isovolumétrica</td><td>AV <b>cerradas</b>, semilunares <b>cerradas</b></td><td>La presión ventricular sube sin cambiar el volumen hasta superar la aórtica (80 mmHg)</td><td>Tras el QRS · <b>R1</b> al inicio (cierre mitral y tricuspídeo)</td></tr>
<tr><td>2. Eyección rápida</td><td>Semilunares <b>abiertas</b></td><td>≈ 70 % del volumen sistólico</td><td>Segmento ST</td></tr>
<tr><td>3. Eyección lenta</td><td>Semilunares abiertas</td><td>≈ 30 % restante; la presión cae</td><td>Onda T</td></tr>
<tr><td>4. Relajación isovolumétrica</td><td>Todas <b>cerradas</b></td><td>La presión ventricular cae sin cambio de volumen</td><td><b>R2</b> al inicio (cierre aórtico y pulmonar); incisura dicrota en la curva aórtica</td></tr>
<tr><td>5. Llenado rápido</td><td>AV <b>abiertas</b></td><td>Se vacía la sangre acumulada en las aurículas; la mayor parte del llenado</td><td><b>R3</b> (si se oye)</td></tr>
<tr><td>6. Diástasis (llenado lento)</td><td>AV abiertas</td><td>Poco flujo</td><td>—</td></tr>
<tr><td>7. Sístole auricular</td><td>AV abiertas</td><td>Aporta ≈ 20 % (Guyton: el 80 % entra antes de que la aurícula se contraiga). Importa más con FC alta o ventrículo rígido</td><td>Después de la onda P · <b>R4</b> (si se oye)</td></tr></table>
<h3>Volúmenes</h3>
<ul><li><b>VFD (fin de diástole)</b> ≈ 110-120 mL · <b>VFS (fin de sístole)</b> ≈ 40-50 mL · <b>Volumen sistólico</b> = VFD − VFS ≈ 70 mL · <b>Fracción de eyección</b> = VS / VFD ≈ 60 %.</li></ul>
<h3>Curvas de presión</h3>
<ul><li><b>Aórtica</b>: 120/80; la <b>incisura (onda dicrota)</b> se produce al cerrarse la válvula aórtica (breve flujo retrógrado). La aorta se distiende en sístole y libera esa energía en diástole.</li>
<li><b>Auricular (y pulso venoso yugular)</b>: <b>onda a</b> = contracción auricular · <b>onda c</b> = abombamiento de la tricúspide al inicio de la contracción ventricular · <b>onda v</b> = llenado auricular con la AV cerrada. Descenso <b>x</b> = relajación auricular/descenso del plano valvular; descenso <b>y</b> = apertura de la tricúspide.</li>
<li><b>Lazo presión-volumen</b> del VI: su área = <b>trabajo sistólico externo</b>. Lado derecho = VFD, izquierdo = VFS, ancho = VS.</li></ul>
<h3>Ruidos cardíacos</h3>
<ul>
<li><b>R1</b>: cierre de válvulas <b>AV</b> (mitral + tricúspide); marca el inicio de la sístole; coincide con el pulso carotídeo. Más grave y largo. Se oye mejor en el foco mitral.</li>
<li><b>R2</b>: cierre de las <b>semilunares</b> (aórtica + pulmonar); fin de la sístole. Más agudo y breve. Mejor en la base. <b>Desdoblamiento fisiológico del R2 en inspiración</b>: aumenta el retorno al corazón derecho y se retrasa el cierre pulmonar.</li>
<li><b>R3</b>: protodiastólico, por llenado ventricular rápido; normal en niños y jóvenes; patológico en adultos (IC, sobrecarga de volumen) → "galope".</li>
<li><b>R4</b>: presistólico, por la contracción auricular contra un ventrículo rígido (HTA, hipertrofia, isquemia). Siempre patológico; no existe en fibrilación auricular.</li>
<li><b>Silencio sistólico</b> (entre R1 y R2) más corto que el <b>diastólico</b>.</li></ul>
<h3>Focos de auscultación</h3>
<table><tr><th>Foco</th><th>Ubicación</th></tr>
<tr><td>Aórtico</td><td>2.º EIC derecho, paraesternal</td></tr><tr><td>Pulmonar</td><td>2.º EIC izquierdo, paraesternal</td></tr><tr><td>Aórtico accesorio (Erb)</td><td>3.er EIC izquierdo, paraesternal</td></tr><tr><td>Tricuspídeo</td><td>4.º-5.º EIC izquierdo paraesternal / base del apéndice xifoides</td></tr><tr><td>Mitral</td><td>5.º EIC izquierdo, línea medioclavicular (ápex)</td></tr></table>
<p><b>Soplos</b>: por flujo turbulento. Sistólicos (estenosis aórtica/pulmonar, insuficiencia mitral/tricuspídea) o diastólicos (estenosis mitral/tricuspídea, insuficiencia aórtica/pulmonar). Intensidad de Levine 1/6 a 6/6 (≥4/6 con frémito).</p>
`);

T('c7','cardio','Volumen minuto (gasto cardíaco) y su regulación',`
<h3>Definiciones</h3>
<ul><li><b>Gasto cardíaco (GC) = volumen minuto = FC × VS</b> ≈ 70 × 70 mL ≈ 5 L/min en reposo. Puede aumentar 4-7 veces con el ejercicio.</li>
<li><b>Índice cardíaco</b> = GC / superficie corporal ≈ 3 L/min/m².</li>
<li>Según Guyton, en condiciones normales el GC está determinado por el <b>retorno venoso</b> (lo que llega, sale): GC = RV.</li></ul>
<h3>Determinantes del volumen sistólico</h3>
<table><tr><th>Determinante</th><th>Definición</th><th>Efecto</th></tr>
<tr><td><b>Precarga</b></td><td>Grado de estiramiento de la fibra al final de la diástole; se estima con el VFD o la presión de fin de diástole</td><td>↑ precarga → ↑ VS (Frank-Starling)</td></tr>
<tr><td><b>Poscarga</b></td><td>Resistencia/tensión contra la que eyecta el ventrículo (presión aórtica, resistencia periférica)</td><td>↑ poscarga → ↓ VS (↑ VFS)</td></tr>
<tr><td><b>Contractilidad (inotropismo)</b></td><td>Fuerza de contracción independiente de la precarga y poscarga</td><td>↑ inotropismo → ↑ VS, ↓ VFS. Positivos: simpático, Ca²⁺, digital. Negativos: hipoxia, acidosis, hiperpotasemia, isquemia</td></tr>
<tr><td><b>FC</b></td><td>Cronotropismo</td><td>↑ FC ↑ GC, pero con FC muy alta (&gt;150-180) cae el llenado diastólico y el VS</td></tr></table>
<h3>Regulación intrínseca: ley de Frank-Starling</h3>
<ul><li>"Dentro de límites fisiológicos, el corazón bombea toda la sangre que le llega". Cuanto más se estira la fibra en diástole, mayor la fuerza de la contracción siguiente.</li>
<li>Mecanismo: el estiramiento lleva los filamentos de actina y miosina a una <b>superposición más óptima</b> y aumenta la sensibilidad de la troponina al Ca²⁺.</li>
<li>Además, el estiramiento de la pared de la AD aumenta la FC un 10-20 % (efecto directo sobre el nodo SA y <b>reflejo de Bainbridge</b>).</li>
<li>Permite igualar el gasto de ambos ventrículos latido a latido.</li></ul>
<h3>Regulación extrínseca (nerviosa)</h3>
<ul><li><b>Simpático</b> (noradrenalina sobre receptores β1): ↑ FC (hasta 180-200), ↑ contractilidad (hasta el doble), ↑ velocidad de conducción y de relajación. Puede subir el GC ≥ 100 %.</li>
<li><b>Parasimpático (vago)</b>: ↓ FC (puede detenerlo unos segundos y luego aparece el "escape ventricular") y ↓ algo la contractilidad (inerva más aurículas que ventrículos).</li>
<li>Hormonas: catecolaminas suprarrenales, hormona tiroidea (↑ GC).</li></ul>
<h3>Retorno venoso (Guyton)</h3>
<ul><li>Depende de: <b>presión media de llenado sistémico</b> (≈ 7 mmHg), <b>presión en la AD</b> (≈ 0 mmHg) y la <b>resistencia al retorno venoso</b>. RV = (Pmls − PAD) / RRV.</li>
<li>Si la presión en la AD sube a ≈ 7 mmHg, el retorno se detiene. Si cae por debajo de 0, las venas se colapsan y el RV no aumenta más (meseta).</li>
<li>Aumentan el RV: ↑ volemia, venoconstricción simpática, <b>bomba muscular</b> (con válvulas venosas), <b>bomba respiratoria</b> (presión intratorácica negativa en inspiración).</li>
<li>Las <b>curvas de gasto cardíaco y de retorno venoso</b> se cruzan en el punto de equilibrio.</li></ul>
<h3>Factores que modifican el GC</h3>
<ul><li>Aumentan: ejercicio, hipertiroidismo, anemia, fístulas AV, beriberi, embarazo, fiebre (todos bajan la resistencia periférica y aumentan el retorno).</li><li>Disminuyen: hemorragia/hipovolemia, IC, infarto, taponamiento, valvulopatías severas.</li></ul>
<p><b>Ley de Laplace</b>: tensión de la pared = (presión × radio) / (2 × espesor). Un ventrículo dilatado necesita más tensión (y más O₂) para generar la misma presión; la hipertrofia es una adaptación que reduce la tensión por unidad de pared.</p>
`);

T('c8','cardio','Hemodinámica de los fluidos y microcirculación',`
<h3>Leyes básicas</h3>
<ul>
<li><b>Ley de Ohm aplicada</b>: <b>Q = ΔP / R</b>. Flujo = diferencia de presión / resistencia. Para toda la circulación: GC = (PAM − PAD) / RPT ≈ PAM / RPT.</li>
<li><b>Ley de Poiseuille</b>: R = 8ηl / πr⁴ → la resistencia depende de la <b>cuarta potencia del radio</b>. Duplicar el radio aumenta el flujo 16 veces. Por eso las <b>arteriolas</b> (que pueden variar su radio) son los <b>vasos de resistencia</b> y donde ocurre la <b>mayor caída de presión</b>.</li>
<li><b>Viscosidad</b>: depende sobre todo del <b>hematocrito</b> (policitemia ↑ viscosidad y resistencia; anemia ↓).</li>
<li><b>Resistencias en serie</b> se suman (R<sub>t</sub> = R1 + R2...). <b>En paralelo</b> se suman las inversas (1/R<sub>t</sub> = 1/R1 + 1/R2...) → la resistencia total es menor que la de cualquier vaso individual; así está organizada la circulación sistémica (cada órgano en paralelo, lo que permite regular cada flujo independientemente).</li>
<li><b>Velocidad</b> = Q / área de sección transversal. Los capilares tienen el área total mayor → la <b>velocidad más baja</b> (≈ 0,3 mm/s), ideal para el intercambio. La aorta, la mayor velocidad (≈ 33 cm/s).</li>
<li><b>Flujo laminar</b> (capas concéntricas, perfil parabólico, silencioso) vs <b>turbulento</b> (remolinos, más resistencia, produce <b>soplos</b>). <b>Número de Reynolds</b> = (v · d · ρ) / η; turbulencia probable si &gt; 2000 (en la aorta proximal puede aparecer con valores menores). Favorecen la turbulencia: alta velocidad, gran diámetro, baja viscosidad (anemia), obstrucciones/estenosis.</li>
</ul>
<h3>Distensibilidad y compliance</h3>
<ul><li><b>Distensibilidad</b> = ΔV / (ΔP × V inicial). <b>Compliance (capacitancia)</b> = ΔV / ΔP.</li>
<li>Las venas son ≈ 8 veces más distensibles que las arterias y tienen ≈ 3 veces su volumen → <b>compliance venosa ≈ 24 veces la arterial</b>. Son el <b>reservorio</b> de sangre.</li>
<li>Distribución de la volemia: ≈ 64 % venas sistémicas, 13 % arterias, 7 % arteriolas y capilares, 9 % circulación pulmonar, 7 % corazón.</li>
<li><b>Presión de pulso</b> (PAS − PAD ≈ 40) depende de: <b>volumen sistólico</b> y <b>compliance arterial</b>. En el anciano (aterosclerosis, arterias rígidas) ↑ la presión de pulso: HTA sistólica aislada.</li>
<li><b>PAM</b> ≈ PAD + 1/3 (PAS − PAD) ≈ 93 mmHg (el ventrículo pasa más tiempo en diástole).</li>
<li><b>Estrés-relajación (complacencia diferida)</b>: si se agrega volumen a un vaso, la presión sube y luego baja lentamente por reacomodación del músculo liso.</li></ul>
<h3>Microcirculación: fuerzas de Starling</h3>
<p>Filtración neta = Kf × [(Pc − Pif) − (πp − πif)]</p>
<table><tr><th>Fuerza</th><th>Valor (Guyton)</th><th>Efecto</th></tr>
<tr><td>Presión hidrostática capilar (Pc)</td><td>≈ 30 arterial → 10 venoso; media funcional ≈ 17 mmHg</td><td>Saca líquido</td></tr>
<tr><td>Presión hidrostática intersticial (Pif)</td><td>≈ −3 mmHg</td><td>Al ser negativa, saca líquido</td></tr>
<tr><td>Presión oncótica plasmática (πp)</td><td>≈ 28 mmHg (≈ 80 % por albúmina)</td><td>Retiene/reabsorbe líquido</td></tr>
<tr><td>Presión oncótica intersticial (πif)</td><td>≈ 8 mmHg</td><td>Saca líquido</td></tr></table>
<p>Resultado: leve <b>filtración neta</b> (≈ 0,3 mmHg; ≈ 2 mL/min) que vuelve a la sangre por los <b>linfáticos</b> (≈ 2-3 L/día).</p>
<h3>Edema</h3>
<ul><li>↑ <b>presión hidrostática capilar</b>: IC, retención renal de sal y agua, obstrucción venosa, trombosis.</li>
<li>↓ <b>presión oncótica plasmática</b>: <b>síndrome nefrótico</b>, cirrosis, desnutrición, quemaduras.</li>
<li>↑ <b>permeabilidad capilar</b>: inflamación, sepsis, alergia, quemaduras.</li>
<li><b>Obstrucción linfática</b>: cáncer, cirugía (vaciamiento ganglionar), filariasis.</li></ul>
<h3>Control local del flujo</h3>
<ul><li><b>Autorregulación</b> (flujo constante pese a cambios de PA): <b>teoría miogénica</b> (el estiramiento contrae el músculo liso) y <b>teoría metabólica</b> (adenosina, CO₂, H⁺, K⁺, lactato y ↓O₂ vasodilatan).</li>
<li><b>Endotelio</b>: <b>óxido nítrico</b> (vasodilatador, liberado por el estrés de cizallamiento) y <b>endotelina</b> (vasoconstrictor potente). Prostaciclina (vasodilata, antiagrega).</li>
<li>Hiperemia activa (por ↑ metabolismo) y reactiva (después de una oclusión).</li></ul>
`);

T('c9','cardio','Regulación de la presión arterial',`
<p><b>PA = GC × RPT</b> (resistencia periférica total). Todo lo que regula la PA actúa sobre el GC (FC, VS, volemia) y/o la RPT (tono arteriolar).</p>
<h3>Control nervioso: centro vasomotor</h3>
<ul><li>En el <b>bulbo y protuberancia inferior</b>: <b>área vasoconstrictora (C-1)</b>, <b>área vasodilatadora (A-1)</b> que inhibe a la anterior, y <b>área sensitiva (núcleo del tracto solitario)</b> que recibe aferencias vagales y glosofaríngeas.</li>
<li>Envía señales simpáticas continuas → <b>tono vasomotor simpático</b> (constricción parcial de base). Las porciones laterales también controlan la FC y la contractilidad; la medial, vía vago, disminuye la FC.</li>
<li>El simpático también provoca <b>venoconstricción</b> (↑ retorno venoso) y liberación de catecolaminas suprarrenales.</li></ul>
<h3>Corto plazo (segundos-minutos)</h3>
<table><tr><th>Mecanismo</th><th>Detalles</th></tr>
<tr><td><b>Barorreceptores</b> (reflejo barorreceptor)</td><td>Receptores de estiramiento en el <b>seno carotídeo</b> (vía nervio de Hering → <b>glosofaríngeo IX</b>) y el <b>cayado aórtico</b> (vía <b>vago X</b>). Responden entre 60 y 180 mmHg; máxima sensibilidad cerca de la PA normal (~100). ↑ PA → más descargas → inhibición del centro vasoconstrictor y excitación vagal → vasodilatación, ↓ FC y ↓ contractilidad → baja la PA. Funcionan como <b>"amortiguadores"</b> de cambios bruscos (p. ej., al pararse). <b>Se adaptan (reajustan) en 1-2 días</b>, por eso no controlan la PA a largo plazo.</td></tr>
<tr><td><b>Quimiorreceptores</b></td><td>Cuerpos carotídeos y aórticos; detectan ↓O₂, ↑CO₂, ↑H⁺. Se activan sobre todo con PA &lt; 80 mmHg (menor flujo) → estimulan el centro vasomotor.</td></tr>
<tr><td><b>Receptores de baja presión</b> (aurículas y arterias pulmonares)</td><td>Detectan el volumen. Su estiramiento → ↓ ADH, ↑ PNA, vasodilatación de la arteriola aferente renal (↑ diuresis) y reflejo de Bainbridge.</td></tr>
<tr><td><b>Respuesta isquémica del SNC</b></td><td>Con PA &lt; 60 mmHg (máxima a 15-20): la isquemia del centro vasomotor produce una vasoconstricción simpática enorme. "Última línea de defensa". <b>Reacción de Cushing</b>: con ↑ presión intracraneal → HTA + bradicardia.</td></tr></table>
<h3>Mediano plazo (minutos-horas)</h3>
<ul><li><b>Sistema renina-angiotensina-aldosterona (SRAA)</b>: ↓ PA/↓ perfusión renal, ↓ NaCl en la mácula densa o estímulo simpático (β1) → las <b>células yuxtaglomerulares</b> liberan <b>renina</b> → angiotensinógeno (hepático) → <b>angiotensina I</b> → (<b>ECA</b>, sobre todo pulmonar) → <b>angiotensina II</b>.</li>
<li>Acciones de la <b>angiotensina II</b>: vasoconstricción arteriolar potente (↑ RPT) y venosa; ↑ <b>aldosterona</b>; ↑ reabsorción de Na⁺ en el túbulo proximal; constricción de la <b>arteriola eferente</b>; ↑ <b>ADH</b> y <b>sed</b>; ↑ actividad simpática.</li>
<li><b>ADH (vasopresina)</b>: vasoconstrictor potente en dosis altas (hemorragia) y ↑ reabsorción de agua.</li>
<li><b>Desplazamiento de líquido capilar</b> e <b>estrés-relajación</b> vascular.</li>
<li><b>Péptido natriurético auricular/cerebral</b>: liberado por el estiramiento auricular/ventricular → natriuresis, vasodilatación, inhibe renina y aldosterona.</li></ul>
<h3>Largo plazo: sistema riñón-líquidos corporales</h3>
<ul><li><b>Diuresis y natriuresis por presión</b>: si sube la PA, el riñón excreta más sal y agua → baja el volumen del LEC → baja la PA, hasta que ingreso = egreso.</li>
<li>Tiene <b>"ganancia infinita"</b>: siempre devuelve la PA al punto de equilibrio. La PA a largo plazo la determinan: (1) el nivel de la <b>curva de eliminación renal</b> de sal y agua y (2) el <b>ingreso de sal y agua</b>.</li>
<li>Un aumento de la RPT solo eleva la PA a largo plazo si también altera la función renal.</li>
<li>Cadena: ↑ volumen LEC → ↑ volemia → ↑ presión media de llenado → ↑ RV → ↑ GC → ↑ PA (y luego autorregulación tisular ↑ RPT).</li></ul>
<h3>Otros vasoactivos</h3>
<ul><li>Vasoconstrictores: noradrenalina/adrenalina (α1), angiotensina II, ADH, endotelina.</li><li>Vasodilatadores: bradicinina, histamina, NO, prostaglandinas, PNA, adenosina.</li></ul>
`);

T('c10','cardio','Hipertensión arterial y toma de la presión',`
<h3>Técnica de toma de la PA (método auscultatorio)</h3>
<ol><li>Paciente sentado, espalda apoyada, piernas sin cruzar, <b>5 minutos de reposo</b>; sin cafeína, tabaco ni ejercicio en los 30 min previos; vejiga vacía.</li>
<li>Brazo apoyado y a la <b>altura del corazón</b>, descubierto.</li>
<li>Manguito adecuado: cámara que cubra ≈ <b>80 % de la circunferencia</b> del brazo (manguito chico sobreestima la PA), borde inferior 2-3 cm sobre el pliegue del codo.</li>
<li><b>Método palpatorio</b> primero: inflar hasta que desaparece el pulso radial y sumar 20-30 mmHg (evita el error del <b>agujero auscultatorio</b>).</li>
<li>Estetoscopio (campana o membrana) sobre la arteria humeral, desinflar a <b>2-3 mmHg por segundo</b>.</li>
<li><b>Ruidos de Korotkoff</b>: fase I (aparición) = <b>PAS</b>; fase V (desaparición) = <b>PAD</b>. Los ruidos se deben al flujo turbulento en la arteria parcialmente comprimida.</li>
<li>Tomar ≥ 2 mediciones separadas 1-2 min; la primera vez en ambos brazos (se usa el valor más alto). Medir ortostatismo en ancianos/diabéticos.</li></ol>
<h3>Clasificación (consultorio, adultos)</h3>
<table><tr><th>Categoría</th><th>PAS</th><th></th><th>PAD</th></tr>
<tr><td>Óptima</td><td>&lt;120</td><td>y</td><td>&lt;80</td></tr><tr><td>Normal</td><td>120-129</td><td>y/o</td><td>80-84</td></tr><tr><td>Limítrofe (normal alta)</td><td>130-139</td><td>y/o</td><td>85-89</td></tr><tr><td>HTA grado 1</td><td>140-159</td><td>y/o</td><td>90-99</td></tr><tr><td>HTA grado 2</td><td>160-179</td><td>y/o</td><td>100-109</td></tr><tr><td>HTA grado 3</td><td>≥180</td><td>y/o</td><td>≥110</td></tr><tr><td>HTA sistólica aislada</td><td>≥140</td><td>y</td><td>&lt;90</td></tr></table>
<p class="muted">Consenso Argentino de HTA / guías europeas. La guía americana (ACC/AHA 2017) usa ≥130/80.</p>
<ul><li>Diagnóstico con varias mediciones en distintas consultas, o MAPA (monitoreo ambulatorio) / MDPA (domiciliario). <b>HTA de guardapolvo blanco</b>: alta en consultorio, normal fuera. <b>HTA enmascarada</b>: al revés.</li></ul>
<h3>Etiología</h3>
<ul><li><b>Primaria/esencial</b> (≈ 90-95 %): multifactorial (genética, sal, obesidad, sedentarismo, alcohol, estrés, edad). En el fondo hay una alteración de la curva de natriuresis por presión.</li>
<li><b>Secundaria</b> (≈ 5-10 %): <b>enfermedad renal parenquimatosa</b>, <b>renovascular</b> (estenosis de arteria renal → ↑ renina: "Goldblatt"), <b>hiperaldosteronismo primario</b> (HTA + hipopotasemia), feocromocitoma (crisis con cefalea, sudoración, palpitaciones), Cushing, hipertiroidismo, <b>coartación de aorta</b> (PA alta en brazos y baja en piernas, pulsos femorales débiles), apnea del sueño, fármacos (AINE, anticonceptivos, corticoides).</li></ul>
<h3>Lesión de órgano blanco</h3>
<ul><li><b>Corazón</b>: hipertrofia ventricular izquierda (concéntrica), disfunción diastólica (R4), IC, cardiopatía isquémica, fibrilación auricular.</li>
<li><b>Cerebro</b>: ACV isquémico y hemorrágico, demencia vascular, encefalopatía hipertensiva.</li>
<li><b>Riñón</b>: nefroangiosclerosis, albuminuria, ERC (2.ª causa).</li>
<li><b>Vasos y retina</b>: aterosclerosis, aneurismas, retinopatía hipertensiva (estrechamiento arteriolar, cruces AV, hemorragias, exudados, edema de papila).</li></ul>
<h3>Fisiopatología</h3>
<ul><li>↑ PA → ↑ poscarga → hipertrofia concéntrica del VI (Laplace) → más rigidez, más demanda de O₂.</li><li>Factores: ↑ actividad simpática, ↑ SRAA, retención renal de sodio, disfunción endotelial (↓ NO), rigidez arterial.</li>
<li>Pilares del tratamiento: dieta hiposódica (&lt; 5 g de sal/día), descenso de peso, actividad física, menos alcohol; fármacos (IECA/ARA II, bloqueantes cálcicos, tiazidas, β-bloqueantes).</li></ul>
<div class="alert"><b>Emergencia hipertensiva</b>: PA muy elevada (habitualmente ≥180/120) <b>con daño agudo de órgano blanco</b> (encefalopatía, edema agudo de pulmón, disección aórtica, SCA). Sin daño agudo = urgencia/HTA severa no controlada.</div>
`);

T('c11','cardio','Circulación coronaria, consumo de O₂, angina e infarto',`
<h3>Fisiología coronaria</h3>
<ul><li>Flujo coronario en reposo ≈ <b>225 mL/min</b> (4-5 % del GC); puede aumentar 3-4 veces.</li>
<li>El miocardio <b>extrae ≈ 70-75 % del O₂</b> ya en reposo (muy alto) → ante más demanda <b>no puede extraer mucho más: debe aumentar el flujo</b>.</li>
<li><b>Flujo fásico</b>: en el <b>VI</b> el flujo cae (incluso se invierte en el subendocardio) durante la sístole porque la contracción comprime los vasos intramurales → <b>el VI se perfunde sobre todo en diástole</b>. En el VD la diferencia es menor. Por eso la <b>taquicardia</b> (acorta la diástole) es perjudicial en la isquemia, y el <b>subendocardio</b> es la zona más vulnerable.</li>
<li>Presión de perfusión coronaria ≈ presión diastólica aórtica − presión de fin de diástole del VI.</li>
<li><b>Regulación metabólica</b> (principal): la <b>adenosina</b> (de la degradación del ATP en hipoxia) es el vasodilatador más importante; también NO, K⁺, CO₂, H⁺, ↓O₂. La regulación nerviosa es menor (el simpático tiene efecto directo α constrictor pero el efecto indirecto metabólico domina).</li></ul>
<h3>Consumo miocárdico de O₂ (MVO₂): determinantes</h3>
<ol><li><b>Frecuencia cardíaca</b> (el más importante en la práctica).</li><li><b>Contractilidad</b>.</li><li><b>Tensión parietal</b> (Laplace: presión × radio / espesor) → depende de la <b>poscarga</b> (PA) y de la <b>precarga</b> (volumen/radio).</li></ol>
<p>Índice clínico: <b>doble producto = FC × PAS</b>. El trabajo de presión consume mucho más O₂ que el trabajo de volumen.</p>
<h3>Cardiopatía isquémica</h3>
<p>Desequilibrio entre <b>oferta</b> (flujo coronario, contenido de O₂, tiempo diastólico) y <b>demanda</b> de O₂. Causa principal: <b>aterosclerosis coronaria</b>. Factores de riesgo: tabaquismo, HTA, dislipemia (LDL alto), diabetes, obesidad, sedentarismo, edad, sexo masculino, antecedentes familiares.</p>
<table><tr><th></th><th>Angina estable</th><th>Angina inestable / IAM sin ST</th><th>IAM con elevación del ST</th></tr>
<tr><td>Mecanismo</td><td>Placa estable que obstruye ≥ 70 %; isquemia cuando ↑ demanda</td><td>Rotura de placa + trombo <b>no oclusivo</b></td><td>Rotura de placa + trombo <b>oclusivo</b> → necrosis transmural</td></tr>
<tr><td>Dolor</td><td>Con esfuerzo/emoción/frío, &lt; 10-20 min, cede con reposo o nitritos</td><td>De reposo, de reciente comienzo o in crescendo</td><td>&gt; 20-30 min, no cede con reposo ni nitritos</td></tr>
<tr><td>Troponina</td><td>Normal</td><td>Normal (angina inestable) / elevada (IAMSEST)</td><td>Elevada</td></tr></table>
<p>Angina inestable, IAM sin ST e IAM con ST = <b>síndromes coronarios agudos (SCA)</b>.</p>
<h3>Semiología del dolor anginoso</h3>
<ul><li><b>Retroesternal, opresivo</b> ("peso", "garra"), difuso (el paciente lo señala con el puño: signo de Levine).</li><li><b>Irradiación</b>: brazo izquierdo (borde cubital), cuello, mandíbula, hombros, epigastrio, interescapular (dolor referido por los segmentos T1-T4).</li><li>Acompañantes en el IAM: <b>sudoración fría, náuseas, vómitos, disnea, angustia</b>, síncope. En diabéticos, ancianos y mujeres puede ser atípico o silente.</li></ul>
<h3>ECG en la isquemia</h3>
<table><tr><th>Fenómeno</th><th>ECG</th></tr>
<tr><td>Isquemia</td><td>Alteraciones de la <b>onda T</b> (subendocárdica: T alta y picuda; subepicárdica: T invertida simétrica)</td></tr>
<tr><td>Lesión</td><td>Alteración del <b>ST</b>: subendocárdica → <b>infradesnivel</b>; subepicárdica/transmural → <b>supradesnivel</b> (corriente de lesión)</td></tr>
<tr><td>Necrosis</td><td><b>Onda Q patológica</b> (≥ 0,04 s y/o ≥ 25 % de la R): "ventana eléctrica", el tejido muerto no se despolariza</td></tr></table>
<p>Localización: <b>anterior/septal V1-V4 → DA</b> · <b>lateral DI, aVL, V5-V6 → Cx</b> · <b>inferior DII, DIII, aVF → CD</b> (o Cx en dominancia izquierda). Imagen especular en derivaciones opuestas.</p>
<h3>Biomarcadores</h3>
<table><tr><th>Marcador</th><th>Se eleva</th><th>Pico</th><th>Se normaliza</th></tr>
<tr><td><b>Troponina I / T</b> (la más específica y sensible)</td><td>3-4 h</td><td>24-48 h</td><td>7-14 días</td></tr>
<tr><td>CK-MB</td><td>4-6 h</td><td>≈ 24 h</td><td>48-72 h (útil para reinfarto)</td></tr>
<tr><td>Mioglobina</td><td>1-2 h (la más precoz)</td><td>6-12 h</td><td>24 h — poco específica</td></tr></table>
<h3>Consecuencias del infarto</h3>
<ul><li>Del tejido isquémico: tras ≈ 20-30 min de oclusión comienza la <b>necrosis</b> (subendocardio → epicardio: "frente de onda"). <b>"Tiempo es músculo"</b>: reperfusión precoz (angioplastia o fibrinolíticos).</li>
<li>Complicaciones: <b>arritmias</b> (fibrilación ventricular = principal causa de muerte prehospitalaria), <b>IC / shock cardiogénico</b> (si se pierde &gt; 40 % del VI), rotura de pared libre, tabique o músculo papilar (insuficiencia mitral aguda), aneurisma ventricular, trombo mural/embolia, pericarditis (temprana o síndrome de Dressler).</li>
<li>Por qué FV: el tejido isquémico pierde K⁺ (corriente de lesión), hay irritabilidad simpática y vías de reentrada.</li></ul>
`);

T('c12','cardio','Insuficiencia cardíaca',`
<h3>Definición</h3>
<p>Síndrome clínico en el que el corazón <b>no puede bombear la sangre suficiente para cubrir las necesidades metabólicas</b> de los tejidos, o solo lo logra a costa de <b>presiones de llenado elevadas</b>.</p>
<h3>Clasificaciones</h3>
<ul><li>Por <b>fracción de eyección</b>: IC con FE <b>reducida</b> (≤ 40 %, falla sistólica), <b>levemente reducida</b> (41-49 %), <b>preservada</b> (≥ 50 %, falla diastólica: ventrículo rígido que no se llena bien, típica de HTA y ancianos).</li>
<li><b>Izquierda / derecha / global</b>. La causa más frecuente de IC derecha es la IC izquierda.</li>
<li><b>Aguda / crónica</b>. De <b>bajo gasto</b> (la mayoría) / de <b>alto gasto</b> (anemia, hipertiroidismo, fístulas AV, beriberi).</li>
<li><b>NYHA</b> (funcional): I sin síntomas con actividad habitual · II síntomas con actividad habitual · III síntomas con actividad menor que la habitual · IV síntomas en reposo.</li>
<li>ACC/AHA estadios A (riesgo), B (cardiopatía estructural sin síntomas), C (síntomas), D (refractaria).</li></ul>
<h3>Causas</h3>
<p><b>Cardiopatía isquémica</b> (la más frecuente), <b>HTA</b>, valvulopatías, miocardiopatías (dilatada, hipertrófica, restrictiva, chagásica — importante en Argentina), arritmias, miocarditis, tóxicos (alcohol).</p>
<h3>Fisiopatología: mecanismos compensadores</h3>
<p>Al caer el GC, el organismo "interpreta" hipovolemia y activa:</p>
<ol><li><b>Sistema simpático</b>: ↑ FC y contractilidad, vasoconstricción → mantiene la PA. A largo plazo es tóxico (↑ demanda de O₂, arritmias, apoptosis).</li>
<li><b>SRAA</b> (↓ perfusión renal): vasoconstricción (↑ poscarga), <b>retención de Na⁺ y agua</b> (↑ volemia, ↑ precarga), fibrosis miocárdica por aldosterona.</li>
<li><b>ADH</b>: retención de agua (hiponatremia dilucional).</li>
<li><b>Mecanismo de Frank-Starling</b>: ↑ volumen → ↑ VS, pero el corazón insuficiente tiene una curva aplanada, y con mucha volemia sube la presión de llenado → congestión.</li>
<li><b>Remodelado ventricular</b>: hipertrofia (concéntrica por sobrecarga de presión, excéntrica por sobrecarga de volumen) y dilatación.</li>
<li>Contrarregulación: <b>péptidos natriuréticos (BNP, NT-proBNP)</b> — se liberan por el estiramiento ventricular; útiles para diagnóstico.</li></ol>
<p>Guyton: <b>IC compensada</b> = la retención de líquido y el simpático normalizan el GC a costa de ↑ presión auricular. <b>IC descompensada</b> = el corazón no logra normalizar el GC y la retención de líquido continúa (círculo vicioso) → edema.</p>
<h3>Clínica</h3>
<table><tr><th>IC izquierda (congestión pulmonar / bajo gasto)</th><th>IC derecha (congestión sistémica)</th></tr>
<tr><td><b>Disnea</b> de esfuerzo progresiva, <b>ortopnea</b>, <b>disnea paroxística nocturna</b>, tos nocturna, <b>edema agudo de pulmón</b> (cuando la presión capilar pulmonar supera ≈ 25-28 mmHg, la oncótica)<br>Crepitantes bibasales, R3 (galope), taquicardia, choque de punta desplazado, sibilancias ("asma cardíaca"), derrame pleural<br>Bajo gasto: astenia, oliguria, frialdad, confusión</td><td><b>Ingurgitación yugular</b>, <b>reflujo hepatoyugular</b>, <b>hepatomegalia</b> congestiva dolorosa, <b>edemas</b> de miembros inferiores (vespertinos, simétricos, con fóvea; en postrados, sacros), ascitis, derrame pleural, nicturia, saciedad precoz</td></tr></table>
<p><b>Criterios de Framingham</b> (diagnóstico: 2 mayores o 1 mayor + 2 menores). Mayores: DPN u ortopnea, ingurgitación yugular, crepitantes, cardiomegalia, edema agudo de pulmón, R3, reflujo hepatoyugular, PVC &gt; 16 cmH₂O, pérdida de peso &gt; 4,5 kg con tratamiento. Menores: edema maleolar, tos nocturna, disnea de esfuerzo, hepatomegalia, derrame pleural, taquicardia &gt; 120, ↓ capacidad vital 1/3.</p>
<h3>Estudios y tratamiento (generalidades)</h3>
<ul><li>Rx de tórax: cardiomegalia (índice cardiotorácico &gt; 0,5), redistribución de flujo, líneas B de Kerley, derrame. <b>Ecocardiograma</b>: FE. ECG. BNP.</li>
<li>Tratamiento: diuréticos (congestión), IECA/ARA II/ARNI, β-bloqueantes, antialdosterónicos, iSGLT2 (bloquear los mecanismos compensadores que a largo plazo dañan); restricción de sodio.</li></ul>
`);

T('c13','cardio','Semiología cardiovascular y RCP básica',`
<h3>Anamnesis: síntomas cardinales</h3>
<ul><li><b>Dolor torácico</b> (ver angina; diferenciar de pericarditis — punzante, mejora inclinado hacia adelante; disección — desgarrante, irradia a la espalda; pleurítico — con la respiración).</li>
<li><b>Disnea</b> (de esfuerzo, ortopnea, DPN), <b>palpitaciones</b>, <b>síncope</b> (pérdida transitoria de conciencia por hipoperfusión cerebral), <b>edemas</b>, cianosis, fatiga.</li>
<li>Factores de riesgo cardiovascular y antecedentes familiares.</li></ul>
<h3>Examen físico</h3>
<ul>
<li><b>Inspección</b>: estado general, cianosis (central/periférica), latidos visibles, deformidades torácicas, ingurgitación yugular, edemas.</li>
<li><b>Pulso arterial</b>: evaluar <b>frecuencia, ritmo, amplitud, forma (contorno), simetría</b> y estado de la pared. Pulsos: carotídeo (el que mejor refleja la aorta), radial, humeral, femoral, poplíteo, tibial posterior, pedio. Pulso <b>paradójico</b> (caída &gt; 10 mmHg de la PAS en inspiración: taponamiento). Pulso <b>céler</b> (insuficiencia aórtica), <b>parvus et tardus</b> (estenosis aórtica), <b>alternante</b> (IC grave), <b>bisferiens</b>.</li>
<li><b>Pulso venoso yugular</b>: paciente a <b>45°</b>, yugular interna derecha. Altura normal &lt; 3-4 cm sobre el <b>ángulo de Louis</b> (≈ &lt;8-9 cmH₂O de PVC, porque la AD está ≈ 5 cm por debajo del ángulo). Ondas a, c, v y descensos x, y. <b>Reflujo hepatoyugular</b> positivo: la yugular sube y se mantiene al comprimir el hígado → IC derecha.</li>
<li><b>Palpación precordial</b>: <b>choque de punta</b> en 5.º EIC línea medioclavicular izquierda, ≤ 2-2,5 cm, breve. Desplazado hacia abajo y afuera en dilatación del VI; sostenido y amplio en hipertrofia. <b>Frémitos</b> (soplos intensos palpables).</li>
<li><b>Auscultación</b>: con membrana (sonidos agudos: R1, R2, soplos de insuficiencia aórtica) y campana (graves: R3, R4, estenosis mitral). Recorrer los focos, describir ritmo, R1, R2, ruidos agregados, soplos (momento, foco de máxima intensidad, irradiación, intensidad, tono) y frotes.</li>
<li><b>Edemas</b>: buscar la <b>fóvea (signo de Godet)</b>; graduar en cruces; el cardíaco es vespertino, declive, blando-duro, simétrico.</li></ul>
<h3>RCP básica (adultos)</h3>
<ol><li><b>Seguridad de la escena</b>.</li><li>Evaluar respuesta (estimular, hablarle) y respiración (≤ 10 s; la respiración agónica/"gasping" = paro).</li><li><b>Pedir ayuda / llamar al servicio de emergencias y pedir un DEA</b>.</li><li>Comenzar <b>compresiones torácicas</b> en el centro del pecho (mitad inferior del esternón): <b>100-120 por minuto</b>, <b>profundidad 5-6 cm</b>, permitir la <b>reexpansión completa</b>, minimizar interrupciones, brazos extendidos.</li><li>Si está entrenado: <b>30 compresiones : 2 ventilaciones</b> (secuencia C-A-B). Si no, "solo manos".</li><li><b>DEA</b> apenas llegue: encenderlo y seguir sus instrucciones; nadie toca al paciente al analizar y al descargar; reanudar compresiones inmediatamente.</li><li>Rotar el compresor cada 2 min.</li></ol>
<p><b>Cadena de supervivencia</b>: reconocimiento y llamado precoz → RCP precoz → desfibrilación rápida → soporte vital avanzado → cuidados posparo → recuperación. La desfibrilación sirve en <b>fibrilación ventricular y TV sin pulso</b> (ritmos desfibrilables); no en asistolia.</p>
`);
