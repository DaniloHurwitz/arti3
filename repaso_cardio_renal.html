M('c3',2,'Los cardiomiocitos auriculares contienen gránulos de:',['Péptido natriurético auricular','Renina','Eritropoyetina','Aldosterona'],'El PNA se libera por estiramiento auricular y produce natriuresis y vasodilatación.');
M('c3',1,'La aorta es una arteria de tipo:',['Elástica, con láminas elásticas fenestradas en la media','Muscular, con lámina elástica interna prominente','Arteriola','De capacitancia'],'Las elásticas amortiguan la pulsatilidad (efecto Windkessel).');
M('c3',2,'El capilar del glomérulo renal es:',['Fenestrado','Continuo','Sinusoide','Linfático'],'Las fenestraciones del endotelio glomerular (70-100 nm) son parte de la barrera de filtración.');
M('c3',2,'Los capilares sinusoides se encuentran en:',['Hígado, bazo y médula ósea','Encéfalo y músculo','Glomérulo e intestino','Pulmón y piel'],'Sinusoides: luz amplia y pared discontinua para el paso de células y macromoléculas.');
M('c3',2,'¿Qué túnica es más gruesa en las venas de gran calibre?',['Adventicia','Íntima','Media','Lámina elástica interna'],'En las arterias predomina la media; en las venas la adventicia.');
M('c3',3,'Tras un infarto de miocardio extenso, el área necrótica es reemplazada principalmente por:',['Tejido cicatrizal fibroso, porque el cardiomiocito casi no se regenera','Nuevos cardiomiocitos derivados de células satélite','Músculo liso','Tejido adiposo exclusivamente'],'El corazón adulto no tiene células satélite como el esquelético; la reparación es por fibrosis.');
// c4 electrofisiología
M('c4',1,'La fase 0 del potencial de acción del músculo ventricular se debe a:',['Entrada rápida de Na⁺','Entrada de Ca²⁺ por canales tipo L','Salida de K⁺','Entrada de Cl⁻'],'Canales rápidos de Na⁺ → despolarización rápida. En el nodo SA, la fase 0 es por Ca²⁺.');
M('c4',1,'La meseta (fase 2) del potencial de acción ventricular se mantiene principalmente por:',['Entrada de Ca²⁺ por canales lentos tipo L y menor salida de K⁺','Entrada de Na⁺ por canales rápidos','Salida masiva de K⁺','Bomba Na⁺/K⁺'],'La entrada lenta de Ca²⁺ equilibra la salida de K⁺; además ese Ca²⁺ dispara la contracción.');
M('c4',2,'¿Por qué el músculo cardíaco no puede tetanizarse?',['Porque su período refractario absoluto dura casi tanto como la contracción','Porque no tiene túbulos T','Porque no posee troponina','Porque su potencial de reposo es −90 mV'],'El refractario absoluto ventricular (≈ 0,25-0,30 s) impide sumar contracciones.');
M('c4',1,'El marcapasos normal del corazón es el nodo sinusal porque:',['Tiene la frecuencia de despolarización espontánea más alta','Es el que conduce más rápido','Es el más grande','Tiene el potencial de reposo más negativo'],'El tejido que descarga más rápido "manda": SA 70-80 /min > AV 40-60 > Purkinje 15-40.');
M('c4',2,'La despolarización diastólica espontánea (fase 4) del nodo SA se debe sobre todo a:',['La corriente I<sub>f</sub> de Na⁺ y canales de Ca²⁺ tipo T','Canales rápidos de Na⁺','Salida de K⁺ por I<sub>K1</sub>','La bomba Na⁺/K⁺-ATPasa'],'I<sub>f</sub> ("funny") se activa con la hiperpolarización; la fase 0 del nodo es por Ca²⁺ tipo L.');
M('c4',2,'La acetilcolina vagal disminuye la frecuencia cardíaca porque:',['Aumenta la permeabilidad al K⁺ (hiperpolariza) y reduce la pendiente de la fase 4','Bloquea los canales rápidos de Na⁺ ventriculares','Aumenta la entrada de Ca²⁺ en el nodo','Estimula receptores β1'],'Receptores M2 → canales de K⁺ activados por ACh; el potencial arranca más negativo y tarda más en llegar al umbral.');
M('c4',1,'¿Dónde se encuentra el nodo sinusal?',['En la pared de la aurícula derecha, en la unión con la vena cava superior','En el tabique interauricular cerca del seno coronario','En el tabique interventricular','En la aurícula izquierda, cerca de las venas pulmonares'],'Subepicárdico, en el extremo superior de la cresta terminal.');
M('c4',1,'La estructura con menor velocidad de conducción es:',['El nodo AV','Las fibras de Purkinje','El músculo auricular','El haz de His'],'El nodo AV conduce a 0,02-0,05 m/s y genera el retraso AV.');
M('c4',2,'¿Cuál es la función principal del retraso en el nodo AV?',['Permitir que las aurículas se vacíen antes de la contracción ventricular','Aumentar la frecuencia cardíaca','Prolongar el período refractario auricular','Sincronizar ambas aurículas'],'Así la sístole auricular completa el llenado ventricular antes de la sístole ventricular.');
M('c4',2,'Ante un bloqueo AV completo, los ventrículos laten típicamente a:',['15-40 lpm (marcapasos de Purkinje)','70-80 lpm','100-120 lpm','Exactamente igual que las aurículas'],'Aparece un ritmo de escape idioventricular. La pausa inicial puede causar síncope (Stokes-Adams).');
M('c4',2,'En el acoplamiento excitación-contracción cardíaco, el Ca²⁺ que entra por canales L:',['Dispara la liberación de Ca²⁺ del retículo sarcoplásmico por los receptores de rianodina','Se une directamente a la miosina','Inhibe la troponina C','Activa la SERCA para relajar'],'"Liberación de Ca²⁺ inducida por Ca²⁺". Luego el Ca²⁺ se une a la troponina C.');
M('c4',3,'Los digitálicos aumentan la contractilidad porque:',['Inhiben la Na⁺/K⁺-ATPasa, aumentan el Na⁺ intracelular y reducen la salida de Ca²⁺ por el intercambiador Na⁺/Ca²⁺','Abren canales de Ca²⁺ tipo L','Estimulan receptores β1','Aumentan la recaptación de Ca²⁺ por SERCA'],'Más Ca²⁺ intracelular disponible → más fuerza (inotropismo positivo).');
M('c4',3,'Una hiperpotasemia severa produce en el corazón:',['Dilatación, flacidez, conducción lenta y bloqueos','Contracción espástica','Aumento de la velocidad de conducción','Acortamiento del QRS'],'El K⁺ alto despolariza el reposo e inactiva canales de Na⁺ → PA más pequeños, conducción lenta.');
M('c4',3,'La estimulación simpática del nodo SA produce:',['Aumento de la pendiente de la fase 4 por ↑ I<sub>f</sub> y ↑ corriente de Ca²⁺','Hiperpolarización del potencial diastólico máximo','Disminución de la velocidad de conducción AV','Prolongación del período refractario'],'Vía β1-AMPc: ↑ FC (cronotropismo +) y ↑ conducción AV (dromotropismo +).');
// c5 ECG
M('c5',1,'La onda P representa:',['La despolarización auricular','La repolarización auricular','La despolarización ventricular','El retraso en el nodo AV'],'La repolarización auricular queda oculta en el QRS.');
M('c5',1,'El intervalo PR normal mide:',['0,12-0,20 s','0,06-0,10 s','0,35-0,44 s','0,20-0,30 s'],'PR > 0,20 s = bloqueo AV de primer grado.');
M('c5',1,'A una velocidad de 25 mm/s, un cuadradito (1 mm) equivale a:',['0,04 s','0,20 s','0,10 s','0,02 s'],'Un cuadrado grande (5 mm) = 0,20 s.');
M('c5',1,'El complejo QRS normal dura:',['0,06-0,10 s','0,12-0,20 s','&gt; 0,12 s','0,20-0,40 s'],'≥ 0,12 s es QRS ancho (bloqueos de rama, ritmos ventriculares).');
M('c5',2,'Con ritmo regular y 4 cuadrados grandes entre dos R, la FC es:',['75 lpm','60 lpm','100 lpm','150 lpm'],'300 / 4 = 75 lpm (o 1500 / 20 cuadraditos).');
M('c5',2,'Según la ley de Einthoven:',['DII = DI + DIII','DI = DII + DIII','DIII = DI + DII','aVF = DI + DII'],'Las tres bipolares forman el triángulo: el voltaje de DII es la suma de DI y DIII.');
M('c5',2,'¿Qué ángulo corresponde a aVF en el sistema hexaxial?',['+90°','0°','−30°','+120°'],'DI 0°, DII +60°, DIII +120°, aVF +90°, aVL −30°, aVR −150°.');
M('c5',2,'V1 se ubica en:',['4.º espacio intercostal, borde paraesternal derecho','4.º espacio intercostal, borde paraesternal izquierdo','5.º espacio intercostal, línea medioclavicular izquierda','5.º espacio intercostal, línea axilar media'],'V2 es el 4.º EIC paraesternal izquierdo; V4 el 5.º EIC LMC; V6 el 5.º EIC línea axilar media.');
M('c5',2,'¿Por qué la onda T normal tiene la misma polaridad que el QRS?',['Porque la repolarización avanza del epicardio al endocardio, en sentido contrario a la despolarización','Porque la repolarización sigue el mismo camino que la despolarización','Porque refleja la repolarización auricular','Porque el ventrículo derecho se repolariza primero'],'Una carga positiva que se aleja (repolarización) en sentido opuesto genera la misma deflexión que una negativa que avanza.');
M('c5',2,'El primer vector de la despolarización ventricular (septal) se dirige:',['De izquierda a derecha, generando q en DI/V6 y r en V1','De derecha a izquierda, generando R en V6','Hacia arriba y atrás','Del ápex a la base'],'El tabique se despolariza desde la rama izquierda hacia la derecha.');
M('c5',2,'El eje eléctrico normal del QRS en el plano frontal está entre:',['−30° y +90°','+90° y +180°','−90° y −180°','0° y −90°'],'Menos de −30° = desviación izquierda; más de +90° = desviación derecha.');
M('c5',3,'QRS positivo en DI y negativo en aVF, con DII negativo. El eje está:',['Desviado a la izquierda (más allá de −30°)','Normal','Desviado a la derecha','Indeterminado'],'DI+ / aVF− ubica el eje entre 0 y −90; DII negativo indica que supera −30°.');
M('c5',3,'Si el QRS es isodifásico en DI, el eje eléctrico es aproximadamente:',['+90° o −90°','0°','+60°','−30°'],'El eje es perpendicular a la derivación isodifásica; se define el sentido mirando aVF (positivo → +90°).');
M('c5',3,'Una desviación del eje a la derecha puede observarse en:',['Hipertrofia del ventrículo derecho','Hipertrofia del ventrículo izquierdo','Hemibloqueo anterior izquierdo','Obesidad y embarazo'],'Otras causas: EPOC, TEP, sujetos delgados. Las demás opciones desvían a la izquierda.');
M('c5',2,'La "progresión de la onda R" en precordiales normales significa que:',['La R crece de V1 a V5-V6 y la S disminuye','La R es máxima en V1','Todas las precordiales tienen R igual','La R disminuye de V1 a V6'],'V1 muestra rS (VD delante) y V6 qR (VI); transición en V3-V4.');
M('c5',3,'Un QT corregido prolongado predispone a:',['Arritmias ventriculares (torsión de puntas)','Bloqueo AV de primer grado','Fibrilación auricular exclusivamente','Hipertrofia ventricular'],'QT largo (congénito, fármacos, hipopotasemia, hipocalcemia) → torsades de pointes.');
// c6 ciclo
M('c6',1,'El primer ruido cardíaco (R1) se debe al:',['Cierre de las válvulas auriculoventriculares','Cierre de las válvulas semilunares','Llenado ventricular rápido','Contracción auricular'],'R1 = cierre mitral y tricuspídeo, inicio de la sístole.');
M('c6',1,'El segundo ruido (R2) se produce por:',['El cierre de las válvulas aórtica y pulmonar','La apertura de la válvula mitral','El cierre de la tricúspide','La contracción auricular'],'R2 marca el fin de la sístole.');
M('c6',1,'Durante la contracción isovolumétrica:',['Todas las válvulas están cerradas y la presión ventricular aumenta','La válvula aórtica está abierta','Las válvulas AV están abiertas','El volumen ventricular disminuye rápidamente'],'Sube la presión sin cambio de volumen hasta superar la presión aórtica.');
M('c6',2,'La fracción de eyección se calcula como:',['Volumen sistólico / volumen de fin de diástole','Volumen de fin de sístole / volumen de fin de diástole','Gasto cardíaco / frecuencia cardíaca','Volumen de fin de diástole − volumen de fin de sístole'],'VS/VFD ≈ 70/120 ≈ 60 %. La resta da el volumen sistólico.');
M('c6',2,'Si aumenta la frecuencia cardíaca, la fase del ciclo que más se acorta es:',['La diástole','La sístole','La contracción isovolumétrica','La eyección rápida'],'Por eso las taquicardias reducen el llenado y la perfusión coronaria del VI.');
M('c6',2,'La incisura dicrota de la curva de presión aórtica coincide con:',['El cierre de la válvula aórtica','La apertura de la válvula aórtica','El cierre de la mitral','La onda P'],'Breve reflujo que cierra la válvula; coincide con R2.');
M('c6',2,'La onda "a" del pulso venoso yugular corresponde a:',['La contracción auricular','El llenado auricular con la tricúspide cerrada','La apertura de la tricúspide','El abombamiento de la tricúspide'],'a = sístole auricular; c = abombamiento tricuspídeo; v = llenado auricular. No hay onda a en fibrilación auricular.');
M('c6',2,'El desdoblamiento fisiológico del R2 aparece en:',['La inspiración, por retraso del cierre pulmonar','La espiración, por adelanto del cierre aórtico','La sístole auricular','El ejercicio exclusivamente'],'En inspiración aumenta el retorno al VD, que eyecta más tiempo.');
M('c6',1,'El foco mitral se ausculta en:',['5.º EIC izquierdo, línea medioclavicular','2.º EIC derecho, paraesternal','2.º EIC izquierdo, paraesternal','3.er EIC izquierdo, paraesternal'],'Aórtico 2.º EIC derecho; pulmonar 2.º EIC izquierdo; Erb 3.º EIC izquierdo; tricuspídeo 4.º-5.º EIC paraesternal izquierdo.');
M('c6',3,'Un cuarto ruido (R4) indica:',['Contracción auricular contra un ventrículo rígido (p. ej., HVI hipertensiva)','Llenado rápido en un corazón joven normal','Cierre de la válvula pulmonar','Fibrilación auricular'],'R4 es presistólico, siempre patológico, y desaparece en la FA (no hay contracción auricular).');
M('c6',3,'El área encerrada por el lazo presión-volumen del ventrículo izquierdo representa:',['El trabajo sistólico externo','La fracción de eyección','La precarga','La compliance ventricular'],'Su ancho es el volumen sistólico; el área es el trabajo realizado.');
M('c6',2,'¿Qué porcentaje del llenado ventricular aporta habitualmente la contracción auricular en reposo?',['≈ 20 %','≈ 80 %','≈ 50 %','≈ 5 %'],'El 80 % entra pasivamente; la sístole auricular "remata" un 20 %. Gana importancia con FC alta o ventrículo rígido.');
M('c6',3,'Un tercer ruido en un adulto de 65 años con disnea sugiere:',['Insuficiencia cardíaca con sobrecarga de volumen','Hipertrofia ventricular concéntrica sin dilatación','Estenosis aórtica leve','Normalidad'],'R3 = llenado rápido en un ventrículo dilatado/sobrecargado ("galope"). En niños y jóvenes puede ser normal.');
// c7 GC
M('c7',1,'El gasto cardíaco es igual a:',['Frecuencia cardíaca × volumen sistólico','Presión arterial × resistencia','Volumen de fin de diástole × FC','Volumen sistólico / fracción de eyección'],'≈ 70 lpm × 70 mL ≈ 5 L/min.');
M('c7',1,'La precarga se relaciona principalmente con:',['El volumen/estiramiento ventricular al final de la diástole','La presión aórtica','La contractilidad miocárdica','La frecuencia cardíaca'],'La poscarga es la resistencia a la eyección (presión aórtica).');
M('c7',2,'La ley de Frank-Starling establece que:',['Al aumentar el estiramiento diastólico de la fibra, aumenta la fuerza de contracción','Al aumentar la FC, aumenta el volumen sistólico indefinidamente','La poscarga determina el gasto cardíaco','El simpático es el principal regulador del volumen sistólico'],'Mecanismo intrínseco: el corazón bombea lo que le llega.');
M('c7',2,'La base molecular de Frank-Starling es:',['Mejor superposición de actina y miosina y mayor sensibilidad al Ca²⁺ con el estiramiento','Mayor entrada de Na⁺','Aumento del número de sarcómeras','Activación vagal'],'El estiramiento optimiza el solapamiento de filamentos.');
M('c7',2,'Un aumento aislado de la poscarga produce, en el latido inmediato:',['Disminución del volumen sistólico y aumento del volumen de fin de sístole','Aumento del volumen sistólico','Disminución del volumen de fin de diástole','Aumento de la contractilidad'],'Le cuesta más eyectar; queda más sangre residual.');
M('c7',2,'¿Cuál es un agente inotrópico negativo?',['La acidosis','La noradrenalina','El aumento de Ca²⁺ extracelular','La digoxina'],'También hipoxia, isquemia, hiperpotasemia y algunos fármacos (bloqueantes cálcicos, β-bloqueantes).');
M('c7',2,'Según Guyton, en condiciones normales el gasto cardíaco está determinado por:',['El retorno venoso','La frecuencia cardíaca exclusivamente','La contractilidad','La presión arterial'],'El corazón bombea lo que retorna; el retorno depende de la presión media de llenado, la presión en AD y la resistencia al retorno.');
M('c7',3,'El retorno venoso aumenta cuando:',['Aumenta la presión media de llenado sistémico','Aumenta la presión en la aurícula derecha','Aumenta la resistencia al retorno venoso','Se produce venodilatación generalizada'],'RV = (Pmls − PAD) / RRV. Más volemia o venoconstricción ↑ Pmls.');
M('c7',2,'El reflejo de Bainbridge consiste en:',['Aumento de la FC al distenderse las aurículas','Disminución de la FC al aumentar la PA','Vasoconstricción ante hipoxia','Bradicardia por aumento de la presión intracraneal'],'El estiramiento auricular ↑ FC (vía aferentes vagales y efecto directo sobre el nodo SA).');
M('c7',3,'Con frecuencias cardíacas muy altas (> 170-180 lpm) el gasto cardíaco cae porque:',['El tiempo de llenado diastólico es insuficiente y cae el volumen sistólico','La contractilidad disminuye por el simpático','Aumenta demasiado la precarga','Se cierra la válvula mitral'],'GC = FC × VS: el VS cae más de lo que sube la FC.');
M('c7',3,'Según la ley de Laplace, un ventrículo dilatado:',['Necesita más tensión parietal (y más O₂) para generar la misma presión','Requiere menos tensión','No modifica su consumo de O₂','Tiene más reserva contráctil'],'T = P × r / 2h: ↑ radio → ↑ tensión.');
// c8 hemodinámica
M('c8',1,'Según Poiseuille, si el radio de un vaso se duplica, el flujo:',['Aumenta 16 veces','Se duplica','Aumenta 4 veces','Se reduce a la mitad'],'El flujo es proporcional a r⁴.');
M('c8',1,'Los vasos donde ocurre la mayor caída de presión son:',['Las arteriolas','Las grandes arterias','Los capilares','Las venas'],'Son los vasos de resistencia.');
M('c8',1,'¿Dónde está la mayor parte del volumen sanguíneo?',['En las venas sistémicas (≈ 64 %)','En las arterias sistémicas','En los capilares','En el corazón'],'Las venas son vasos de capacitancia.');
M('c8',2,'¿En qué segmento la velocidad de la sangre es menor?',['Capilares','Aorta','Venas cavas','Arterias medianas'],'Tienen la mayor sección transversal total; v = Q/A.');
M('c8',2,'La resistencia total de varios lechos en paralelo:',['Es menor que la de cualquiera de ellos','Es la suma de todas','Es igual a la mayor','Es igual al promedio'],'1/Rt = Σ 1/Ri. Por eso amputar un miembro o cerrar un lecho ↑ la RPT.');
M('c8',2,'Favorece el flujo turbulento:',['Alta velocidad y baja viscosidad (anemia)','Baja velocidad','Alta viscosidad','Vasos de pequeño diámetro'],'Número de Reynolds = v·d·ρ/η. La anemia produce soplos funcionales.');
M('c8',2,'La presión de pulso depende principalmente de:',['El volumen sistólico y la compliance arterial','La frecuencia cardíaca exclusivamente','La resistencia de las venas','La presión oncótica'],'En el anciano, arterias rígidas → presión de pulso alta (HTA sistólica aislada).');
M('c8',2,'Un paciente con PA 130/70 tiene una PAM aproximada de:',['≈ 90 mmHg','100 mmHg','≈ 60 mmHg','110 mmHg'],'70 + (60/3) = 90 mmHg.');
M('c8',1,'La presión oncótica del plasma se debe sobre todo a:',['La albúmina','Las globulinas','El fibrinógeno','El sodio'],'≈ 80 % de la presión oncótica plasmática.');
M('c8',2,'Según Starling, ¿qué fuerza favorece la reabsorción de líquido hacia el capilar?',['La presión oncótica plasmática','La presión hidrostática capilar','La presión oncótica intersticial','La presión intersticial negativa'],'Las otras tres favorecen la salida (filtración).');
M('c8',2,'En el síndrome nefrótico el edema se produce principalmente por:',['Disminución de la presión oncótica plasmática','Aumento de la permeabilidad capilar','Obstrucción linfática','Aumento de la presión intersticial'],'Pérdida urinaria de albúmina → hipoalbuminemia (más retención renal de Na⁺).');
M('c8',3,'La compliance venosa es aproximadamente cuántas veces la arterial:',['24 veces','2 veces','8 veces','100 veces'],'8 veces más distensibles × 3 veces más volumen = 24.');
M('c8',2,'El principal vasodilatador liberado por el endotelio ante el estrés de cizallamiento es:',['El óxido nítrico','La endotelina','La angiotensina II','El tromboxano A₂'],'La endotelina es un vasoconstrictor potente.');
M('c8',3,'La teoría miogénica de la autorregulación explica que:',['El estiramiento de la pared arteriolar provoca su contracción, manteniendo el flujo constante','Los metabolitos vasodilatan cuando aumenta el metabolismo','El simpático regula el flujo local','El NO contrae los vasos'],'↑ PA → estiramiento → entrada de Ca²⁺ → vasoconstricción.');
M('c8',3,'¿Cuál de estas NO es causa de edema por aumento de la presión hidrostática capilar?',['Hipoalbuminemia','Insuficiencia cardíaca','Trombosis venosa profunda','Retención renal de sal y agua'],'La hipoalbuminemia reduce la presión oncótica.');
// c9 regulación PA
M('c9',1,'La presión arterial es el producto de:',['Gasto cardíaco × resistencia periférica total','FC × volumen sistólico','Volemia × viscosidad','Precarga × poscarga'],'PA = GC × RPT.');
M('c9',1,'Los barorreceptores del seno carotídeo envían su información por el nervio:',['Glosofaríngeo (IX), vía nervio de Hering','Vago (X)','Hipogloso','Frénico'],'Los del cayado aórtico usan el vago.');
M('c9',2,'Ante una caída brusca de la PA al ponerse de pie, el reflejo barorreceptor produce:',['Aumento del simpático: taquicardia y vasoconstricción','Aumento vagal y bradicardia','Vasodilatación generalizada','Liberación de PNA'],'Menos estiramiento → menos descargas → se desinhibe el centro vasoconstrictor.');
M('c9',2,'¿Por qué los barorreceptores no controlan la PA a largo plazo?',['Porque se reajustan al nuevo nivel de presión en 1-2 días','Porque responden solo a la hipoxia','Porque no tienen conexión con el SNC','Porque solo funcionan con PA menor a 60 mmHg'],'Son "amortiguadores" de cambios rápidos.');
M('c9',2,'Los quimiorreceptores periféricos participan en el control de la PA sobre todo cuando:',['La PA cae por debajo de ≈ 80 mmHg','La PA supera 160 mmHg','Aumenta la presión intracraneal','Hay hiperoxia'],'Con menor flujo detectan ↓O₂/↑CO₂ y excitan el centro vasomotor.');
M('c9',2,'La renina es secretada por:',['Las células yuxtaglomerulares de la arteriola aferente','La mácula densa','El hígado','El endotelio pulmonar'],'La mácula densa detecta el NaCl; el hígado produce angiotensinógeno; la ECA está en el endotelio (sobre todo pulmonar).');
M('c9',2,'¿Cuál NO es una acción de la angiotensina II?',['Vasodilatación de la arteriola eferente','Estimular la secreción de aldosterona','Estimular la sed y la ADH','Aumentar la reabsorción proximal de Na⁺'],'La angiotensina II CONTRAE la eferente (mantiene el FG).');

['c2','En la dominancia derecha la interventricular posterior nace de la coronaria derecha.',true,'Es la situación más frecuente (≈ 2/3).'],

['c5','aVL se ubica a −30° en el sistema hexaxial.',true,'aVR −150°, aVF +90°.'],

['c6','El R3 es siempre patológico.',false,'Puede ser normal en niños, jóvenes y embarazadas. El R4 sí es siempre patológico.'],

['c7','Si la presión de AD sube a ≈ 7 mmHg el retorno venoso se detiene.',true,'Se iguala con la presión media de llenado sistémico.'],

['c8','La velocidad de la sangre es menor en los capilares.',true,'Tienen la mayor sección transversal total.'],
['c8','La resistencia de lechos en paralelo es mayor que la de cada lecho.',false,'Es menor que la de cualquiera de ellos.'],

/* ===================== CARDIO · DESARROLLO ===================== */
D('c1',1,'Describí la configuración interna del ventrículo derecho y del izquierdo, señalando sus diferencias.',`<b>VD</b>: pared delgada (3-5 mm), forma de media luna que abraza al VI. Porción de entrada rugosa con <b>trabéculas carnosas</b>, <b>cresta supraventricular</b> que la separa del <b>cono arterioso (infundíbulo)</b> liso que lleva al tronco pulmonar. <b>Trabécula septomarginal</b> (banda moderadora) que lleva la rama derecha al papilar anterior. Válvula <b>tricúspide</b> (anterior, posterior, septal) con 3 papilares. Válvula pulmonar (3 semilunares).<br><b>VI</b>: pared 2-3 veces más gruesa (10-15 mm) porque trabaja a presión sistémica; cavidad cónica; trabéculas más finas; <b>mitral</b> (anterior y posterior) con <b>2 papilares</b> (anterior y posterior); <b>vestíbulo aórtico</b> liso hacia la válvula aórtica (derecha, izquierda, posterior) con los senos aórticos de donde nacen las coronarias. El VI forma el ápex.`);
D('c1',2,'Describí el pericardio: capas, senos, irrigación, inervación y su importancia clínica.',`<b>Pericardio fibroso</b>: saco externo, inextensible, fijo al centro tendinoso del diafragma y al esternón; se continúa con la adventicia de los grandes vasos. <b>Pericardio seroso</b>: hoja parietal (tapiza el fibroso) y visceral (<b>epicardio</b>); entre ambas la <b>cavidad pericárdica</b> con poco líquido lubricante. <b>Seno transverso</b> (detrás de aorta y pulmonar, delante de la VCS) y <b>seno oblicuo</b> (detrás de la AI). Irrigación: arterias pericardiofrénicas (de la torácica interna). Inervación: <b>nervios frénicos</b> (dolor referido al hombro), vago y simpático. Clínica: en la pericarditis hay dolor que mejora inclinado hacia adelante y frote; en el <b>taponamiento</b> la acumulación de líquido en un saco inextensible impide el llenado diastólico → <b>tríada de Beck</b> (hipotensión, ingurgitación yugular, ruidos apagados) y pulso paradójico.`);
D('c2',2,'Describí la irrigación arterial y el drenaje venoso del corazón, y su correlación con las derivaciones del ECG en el infarto.',`<b>Coronaria derecha</b> (seno aórtico derecho, surco coronario derecho): rama del nodo SA (60 %), marginal derecha, interventricular posterior (si es dominante) y rama del nodo AV (80 %). Irriga AD, VD, cara inferior del VI y 1/3 posterior del tabique.<br><b>Coronaria izquierda</b> (seno izquierdo): tronco corto → <b>descendente anterior</b> (diagonales y septales: pared anterior del VI, 2/3 anteriores del tabique, ápex) y <b>circunfleja</b> (marginal izquierda: pared lateral y AI).<br><b>Drenaje</b>: seno coronario (venas cardíacas magna, media y menor, oblicua de la AI) a la AD; venas cardíacas anteriores directo a la AD; venas mínimas a las cavidades.<br><b>ECG</b>: V1-V4 → DA; DI, aVL, V5-V6 → Cx; DII, DIII, aVF → CD. El IAM inferior puede causar bradicardia y bloqueo AV por compromiso de la rama del nodo AV.`);
D('c3',1,'Compará histológicamente el músculo cardíaco con el músculo esquelético.',`Ambos son <b>estriados</b> (sarcómeras). <b>Cardíaco</b>: células ramificadas, 1-2 <b>núcleos centrales</b>, <b>discos intercalares</b> (uniones adherentes, desmosomas, <b>nexos</b> → sincitio funcional), túbulos T grandes en la <b>línea Z</b> formando <b>díadas</b>, RS menos desarrollado (depende del Ca²⁺ extracelular), muchísimas mitocondrias, involuntario, automatismo, sin capacidad de regeneración (cicatriz). Las auriculares tienen gránulos de PNA. <b>Esquelético</b>: fibras largas cilíndricas multinucleadas con <b>núcleos periféricos</b>, sin discos intercalares, <b>tríadas</b> en la unión A-I, voluntario, se regenera parcialmente por células satélite.`);
D('c3',2,'Describí las túnicas de la pared vascular y compará una arteria elástica, una arteria muscular, un capilar y una vena.',`<b>Íntima</b> (endotelio, subendotelio, lámina elástica interna), <b>media</b> (músculo liso, elastina), <b>adventicia</b> (conectivo, vasa vasorum, nervi vasorum).<br><b>Arteria elástica</b> (aorta): media con láminas elásticas fenestradas → amortigua la pulsatilidad y mantiene la presión en diástole. <b>Arteria muscular</b>: media de músculo liso, lámina elástica interna prominente → regula la distribución. <b>Arteriola</b>: 1-2 capas de músculo liso → resistencia. <b>Capilar</b>: endotelio + lámina basal (+ pericitos): continuo, fenestrado o sinusoide → intercambio. <b>Vena</b>: pared delgada, luz amplia irregular, adventicia predominante, válvulas → capacitancia (reservorio de ~64 % de la volemia).`);
D('c4',1,'Explicá el potencial de acción de la fibra ventricular, indicando las corrientes iónicas de cada fase y su importancia funcional.',`Reposo (fase 4) ≈ −90 mV, por la alta permeabilidad al K⁺ (I<sub>K1</sub>) y la Na⁺/K⁺-ATPasa. <b>Fase 0</b>: apertura de <b>canales rápidos de Na⁺</b> → despolarización rápida hasta ≈ +20 mV. <b>Fase 1</b>: inactivación del Na⁺ y salida transitoria de K⁺ (I<sub>to</sub>). <b>Fase 2 (meseta)</b>: entrada de <b>Ca²⁺ por canales lentos tipo L</b> y disminución de la permeabilidad al K⁺; dura 0,2-0,3 s. <b>Fase 3</b>: cierre de los canales de Ca²⁺ y salida de K⁺ (I<sub>Kr</sub>, I<sub>Ks</sub>). Importancia: el Ca²⁺ de la meseta dispara la liberación de Ca²⁺ del RS (contracción), y la meseta prolonga el <b>período refractario</b> (≈ 0,25-0,30 s), lo que impide la tetanización y da tiempo al llenado.`);
D('c4',2,'Describí el sistema de conducción del corazón: ubicación de cada componente, velocidades, frecuencias intrínsecas y por qué el nodo SA es el marcapasos.',`<b>Nodo SA</b>: pared de la AD en la unión con la VCS (extremo superior de la cresta terminal); <b>vías internodales</b> (anterior con haz de Bachmann a la AI, media y posterior); <b>nodo AV</b>: tabique interauricular cerca del seno coronario (triángulo de Koch); <b>haz de His</b>: atraviesa el esqueleto fibroso; <b>ramas derecha</b> (por la trabécula septomarginal) e <b>izquierda</b> (fascículos anterior y posterior); <b>red de Purkinje</b> subendocárdica. Velocidades: aurícula 0,3 m/s, <b>nodo AV 0,02-0,05 m/s</b> (retraso ≈ 0,09 s para que las aurículas se vacíen antes), <b>Purkinje 1,5-4 m/s</b> (contracción simultánea), ventrículo 0,3-0,5. Frecuencias: SA 70-80, AV 40-60, Purkinje 15-40. El SA es el marcapasos porque su <b>despolarización diastólica espontánea (I<sub>f</sub>)</b> es la más rápida: llega antes al umbral y despolariza a los demás antes de que se autoexciten. Si falla o hay bloqueo, toma el mando el siguiente (marcapasos ectópico).`);
D('c4',3,'Explicá el acoplamiento excitación-contracción del miocardio y cómo lo modifican el simpático y los digitálicos.',`El PA recorre el sarcolema y los <b>túbulos T</b> → abre <b>canales de Ca²⁺ tipo L (dihidropiridina)</b> → el Ca²⁺ que entra activa los <b>receptores de rianodina (RyR2)</b> del RS → <b>liberación de Ca²⁺ inducida por Ca²⁺</b> → el Ca²⁺ se une a la <b>troponina C</b> → la tropomiosina descubre los sitios de la actina → ciclo de puentes cruzados. Relajación: recaptación por <b>SERCA</b> (regulada por fosfolambano) y extrusión por el <b>intercambiador Na⁺/Ca²⁺</b> y la Ca²⁺-ATPasa del sarcolema. <b>Simpático</b> (β1 → AMPc → PKA): fosforila canales L (más Ca²⁺ → inotropismo +) y fosfolambano (más recaptación → relajación más rápida, lusitropismo +). <b>Digitálicos</b>: inhiben la Na⁺/K⁺-ATPasa → ↑ Na⁺ intracelular → el intercambiador saca menos Ca²⁺ → más Ca²⁺ en el RS → más fuerza.`);
D('c5',1,'Describí los componentes del ECG normal, qué representa cada uno y sus valores normales.',`<b>Onda P</b>: despolarización auricular (&lt; 0,12 s, &lt; 2,5 mm). <b>Intervalo PR</b>: conducción auricular + retraso AV + His-Purkinje (0,12-0,20 s). <b>QRS</b>: despolarización ventricular (0,06-0,10 s); oculta la repolarización auricular. <b>Segmento ST</b>: ventrículos totalmente despolarizados (isoeléctrico). <b>Onda T</b>: repolarización ventricular, misma polaridad que el QRS. <b>QT</b>: sístole eléctrica (corrige por FC; QTc &lt; 0,44 s). <b>Onda U</b>: inconstante. Papel a 25 mm/s: 1 mm = 0,04 s; 10 mm = 1 mV. FC = 1500/cuadraditos.`);
D('c5',2,'Explicá cómo se determina el eje eléctrico medio del QRS y qué significan sus desviaciones.',`El eje es la dirección promedio del vector de despolarización ventricular en el plano frontal. Normal entre <b>−30° y +90°</b> (≈ +60°), porque predomina la masa del VI hacia abajo e izquierda. <b>Métodos</b>: (1) cuadrantes con DI (0°) y aVF (+90°): DI+/aVF+ normal; DI+/aVF− mirar DII (+ normal hasta −30°, − desviación izquierda); DI−/aVF+ desviación derecha; DI−/aVF− eje extremo. (2) Derivación isodifásica: el eje es perpendicular a ella. (3) Vectorial: graficar la amplitud neta (R−S) de dos derivaciones en el hexaxial y trazar la resultante. <b>Desviación izquierda</b> (&lt; −30°): HVI, hemibloqueo anterior izquierdo, obesidad, embarazo. <b>Desviación derecha</b> (&gt; +90°): HVD, EPOC, TEP, hemibloqueo posterior, sujetos delgados.`);
D('c5',3,'Explicá la secuencia vectorial de la despolarización ventricular y cómo se refleja en V1 y V6.',`<b>Vector 1 (septal)</b>: el tabique se despolariza de izquierda a derecha (la rama izquierda llega antes) y hacia adelante → se acerca a V1 (<b>r</b> pequeña) y se aleja de V6 y DI (<b>q</b> pequeña). <b>Vector 2 (pared libre y ápex)</b>: el mayor; dominado por la masa del VI, se dirige hacia abajo, a la izquierda y atrás → se aleja de V1 (<b>S</b> profunda) y se acerca a V6 (<b>R</b> alta). <b>Vector 3 (basal)</b>: porciones basales, hacia arriba y atrás → pequeña s en V6. Resultado: V1 = <b>rS</b>, V6 = <b>qR</b>; la R crece progresivamente de V1 a V5-V6 con transición en V3-V4. La despolarización va de endocardio a epicardio.`);
D('c6',1,'Describí las fases del ciclo cardíaco relacionando presiones, volúmenes, válvulas, ruidos y ECG.',`<b>Sístole</b>: (1) <b>contracción isovolumétrica</b> — tras el QRS, se cierran las AV (<b>R1</b>), todas las válvulas cerradas, la presión sube sin cambio de volumen hasta superar 80 mmHg; (2) <b>eyección rápida</b> — se abren las semilunares, sale ≈ 70 % del VS; (3) <b>eyección lenta</b> — 30 % restante (onda T). <b>Diástole</b>: (4) <b>relajación isovolumétrica</b> — cierre de las semilunares (<b>R2</b>, incisura dicrota), todas cerradas, cae la presión; (5) <b>llenado rápido</b> — se abren las AV, entra la mayor parte (R3 si existe); (6) <b>diástasis</b>; (7) <b>sístole auricular</b> — tras la onda P, aporta ≈ 20 % (R4 si el ventrículo es rígido). Volúmenes: VFD 120, VFS 50, VS 70 mL, FE 60 %. Presiones: VI 120/0-10, aorta 120/80.`);
D('c6',2,'Describí los ruidos cardíacos normales y agregados y los focos de auscultación.',`<b>R1</b>: cierre de mitral y tricúspide; inicio de la sístole; coincide con el pulso carotídeo; mejor en el ápex. <b>R2</b>: cierre aórtico y pulmonar; fin de la sístole; mejor en la base; <b>desdoblamiento fisiológico en inspiración</b> (↑ retorno al VD retrasa el cierre pulmonar). <b>R3</b>: protodiastólico, llenado rápido; normal en jóvenes, patológico en IC. <b>R4</b>: presistólico, contracción auricular contra ventrículo rígido (HTA, HVI, isquemia); siempre patológico. <b>Focos</b>: aórtico 2.º EIC derecho paraesternal; pulmonar 2.º EIC izquierdo; Erb 3.er EIC izquierdo; tricuspídeo 4.º-5.º EIC izquierdo paraesternal/xifoides; mitral 5.º EIC LMC izquierda. Soplos: turbulencia (sistólicos: estenosis de semilunares o insuficiencia de AV; diastólicos: lo inverso).`);
D('c7',1,'Definí gasto cardíaco y explicá sus determinantes.',`<b>GC = FC × VS</b> ≈ 5 L/min. Determinantes del VS: <b>precarga</b> (estiramiento al final de la diástole; ↑ precarga ↑ VS por Frank-Starling), <b>poscarga</b> (resistencia a la eyección; ↑ poscarga ↓ VS), <b>contractilidad</b> (fuerza intrínseca: ↑ con simpático, Ca²⁺, digital; ↓ con hipoxia, acidosis, isquemia). <b>FC</b>: ↑ GC hasta ≈ 170-180 lpm; por encima, cae el llenado diastólico y el VS. Según Guyton, normalmente el GC lo fija el <b>retorno venoso</b> (Pmls − PAD)/RRV.`);
D('c7',2,'Explicá la regulación intrínseca y extrínseca del volumen minuto.',`<b>Intrínseca – Frank-Starling</b>: a mayor llenado, mayor estiramiento de la fibra → mejor superposición actina-miosina y mayor sensibilidad al Ca²⁺ → mayor fuerza: el corazón expulsa lo que recibe; iguala los gastos de ambos ventrículos. El estiramiento de la AD también ↑ la FC 10-20 % (efecto directo y reflejo de Bainbridge). <b>Extrínseca – SNA</b>: el <b>simpático</b> (β1) ↑ FC (hasta 180-200), ↑ contractilidad (hasta 2 veces), ↑ conducción y relajación; además venoconstricción → ↑ retorno. Puede subir el GC más de 100 %. El <b>parasimpático</b> (vago) ↓ FC y en menor medida la contractilidad (inerva sobre todo aurículas). Hormonas: catecolaminas, tiroideas. Factores del retorno venoso: volemia, tono venoso, bomba muscular y respiratoria.`);
D('c8',2,'Explicá las fuerzas de Starling a nivel capilar y los mecanismos de formación de edema.',`Filtración = Kf × [(Pc − Pif) − (πp − πif)]. Salida: <b>Pc</b> (≈ 17 mmHg media; 30 arterial → 10 venoso), <b>Pif negativa</b> (≈ −3) y <b>πif</b> (≈ 8). Entrada: <b>πp</b> (≈ 28, por la albúmina). Balance: filtración neta ≈ 0,3 mmHg; el exceso vuelve por los <b>linfáticos</b>. <b>Edema</b>: (1) ↑ Pc: IC, retención renal de sal/agua, obstrucción venosa; (2) ↓ πp: síndrome nefrótico, cirrosis, desnutrición; (3) ↑ permeabilidad (Kf): inflamación, sepsis, quemaduras; (4) obstrucción linfática: cáncer, cirugía, filariasis. Factores de seguridad: presión intersticial negativa, ↑ flujo linfático, "lavado" de proteínas intersticiales.`);
D('c8',3,'Explicá la ley de Poiseuille y las resistencias en serie y en paralelo, y aplicalas a la circulación sistémica.',`<b>Q = ΔP/R</b>; <b>R = 8ηl/πr⁴</b>: la resistencia depende de la viscosidad (hematocrito), la longitud y sobre todo de la <b>cuarta potencia del radio</b>. Pequeños cambios del radio arteriolar producen grandes cambios de flujo → las <b>arteriolas</b> regulan el flujo a cada tejido y concentran la mayor caída de presión. <b>En serie</b> (arteria → arteriola → capilar → vénula → vena) las resistencias se suman. <b>En paralelo</b> (los órganos) se suman las conductancias (1/Rt = Σ 1/Ri): la resistencia total es menor que la de cada lecho, y cada órgano puede regular su flujo independientemente. Quitar un lecho (p. ej., amputación) aumenta la RPT.`);
D('c9',1,'Describí el reflejo barorreceptor: receptores, vías, centros y efectores.',`<b>Receptores</b>: terminaciones de estiramiento en el <b>seno carotídeo</b> y el <b>cayado aórtico</b>. <b>Vías aferentes</b>: nervio de Hering → <b>glosofaríngeo</b> (seno carotídeo) y <b>vago</b> (aorta) → <b>núcleo del tracto solitario</b> en el bulbo. <b>Centro</b>: centro vasomotor bulbar. <b>Respuesta a ↑ PA</b>: más descargas → inhibición del área vasoconstrictora (↓ simpático) y excitación vagal → <b>vasodilatación arteriolar y venosa, ↓ FC, ↓ contractilidad</b> → la PA baja. Ante ↓ PA (p. ej., ortostatismo) ocurre lo inverso. Rango 60-180 mmHg, máxima sensibilidad cerca de la PA normal. Amortiguan cambios rápidos pero se <b>reajustan en 1-2 días</b>: no controlan la PA a largo plazo.`);
D('c9',2,'Explicá el sistema renina-angiotensina-aldosterona y su papel en la regulación de la PA.',`<b>Estímulos de renina</b> (células yuxtaglomerulares): ↓ presión en la arteriola aferente (barorreceptor renal), ↓ NaCl en la mácula densa, simpático (β1). <b>Cascada</b>: renina convierte el angiotensinógeno hepático en <b>angiotensina I</b> → la <b>ECA</b> (endotelio pulmonar) la convierte en <b>angiotensina II</b>. <b>Acciones de la AII</b>: vasoconstricción arteriolar (↑ RPT) y venosa, contracción de la <b>arteriola eferente</b> (mantiene FG), ↑ reabsorción de Na⁺ proximal, ↑ <b>aldosterona</b> (reabsorción de Na⁺ y secreción de K⁺ en el túbulo colector), ↑ <b>ADH</b> y <b>sed</b>, ↑ simpático. Resultado: ↑ RPT y ↑ volumen → ↑ PA. Actúa en minutos-horas y desplaza la curva de natriuresis por presión; es clave en la hemorragia, la dieta hiposódica, la HTA renovascular y la IC.`);
D('c9',3,'Explicá por qué, según Guyton, el riñón es el determinante de la PA a largo plazo.',`Por la <b>diuresis y natriuresis por presión</b>: si la PA sube, el riñón excreta más sal y agua; el volumen del LEC y la volemia caen, baja la presión media de llenado, el retorno venoso, el GC y la PA, hasta que la excreción iguala al ingreso. El mecanismo tiene <b>ganancia infinita</b>: no deja error residual. Por eso la PA a largo plazo depende solo de (1) el <b>nivel de la curva de excreción renal</b> de sal y agua y (2) el <b>ingreso</b> de sal y agua. Un ↑ aislado de la RPT eleva la PA transitoriamente, pero el riñón excreta el exceso y la PA vuelve, salvo que la resistencia aumentada sea renal. La HTA crónica implica siempre un desplazamiento de la curva de natriuresis hacia presiones más altas (p. ej., por AII, aldosterona, menor masa renal).`);
D('c10',1,'Describí la técnica correcta de medición de la presión arterial y los errores frecuentes.',`Paciente sentado, 5 min de reposo, sin café/tabaco/ejercicio 30 min antes, vejiga vacía, piernas sin cruzar, brazo descubierto apoyado a la altura del corazón. Manguito con cámara de ≈ 80 % de la circunferencia, 2-3 cm sobre el pliegue del codo. Palpar la humeral; <b>método palpatorio</b> (inflar hasta que desaparece el radial + 20-30 mmHg). Estetoscopio sobre la humeral, desinflar 2-3 mmHg/s. <b>Korotkoff I = PAS; V = PAD</b>. Dos tomas separadas 1-2 min; la primera vez en ambos brazos. Errores: manguito chico (sobreestima), brazo bajo el corazón (sobreestima), desinflado rápido, no hacer palpatorio (agujero auscultatorio), hablar durante la toma, redondear a 0/5.`);
D('c10',2,'Clasificá la HTA, mencioná causas de HTA secundaria y describí las lesiones de órgano blanco.',`Clasificación (mmHg): óptima &lt;120/80; normal 120-129/80-84; limítrofe 130-139/85-89; <b>HTA 1</b> 140-159/90-99; <b>HTA 2</b> 160-179/100-109; <b>HTA 3</b> ≥180/≥110; sistólica aislada ≥140/&lt;90. <b>Primaria</b> 90-95 %. <b>Secundaria</b>: renal parenquimatosa, renovascular (↑ renina), hiperaldosteronismo primario (hipopotasemia), feocromocitoma, Cushing, coartación de aorta, hipertiroidismo, apnea del sueño, fármacos. <b>Órganos blanco</b>: corazón (HVI concéntrica, disfunción diastólica, IC, cardiopatía isquémica, FA), cerebro (ACV isquémico/hemorrágico, demencia), riñón (nefroangiosclerosis, albuminuria, ERC), retina (retinopatía), vasos (aterosclerosis, aneurisma, disección).`);
D('c11',2,'Explicá los determinantes de la oferta y la demanda de O₂ miocárdico y su relación con la angina de pecho.',`<b>Oferta</b>: flujo coronario (depende de la presión de perfusión = PAD aórtica − presión diastólica del VI, del <b>tiempo diastólico</b> y del calibre coronario regulado por la adenosina y otros metabolitos) y contenido arterial de O₂ (Hb, saturación). La extracción ya es máxima (≈ 70-75 %), por eso solo puede aumentar el flujo. <b>Demanda</b> (MVO₂): <b>FC</b>, <b>contractilidad</b> y <b>tensión parietal</b> (Laplace: presión × radio/espesor → poscarga y precarga); índice: doble producto. <b>Angina estable</b>: una estenosis fija ≥ 70 % no permite aumentar el flujo cuando sube la demanda (esfuerzo, emoción, frío) → isquemia transitoria (sobre todo subendocárdica) → dolor que cede al reposo o con nitritos (venodilatación → ↓ precarga → ↓ tensión parietal).`);
D('c11',3,'Describí la fisiopatología, clínica, ECG y biomarcadores del infarto agudo de miocardio con elevación del ST.',`<b>Fisiopatología</b>: rotura/erosión de una placa aterosclerótica → agregación plaquetaria y trombo <b>oclusivo</b> → isquemia transmural; tras 20-30 min comienza la necrosis, del subendocardio al epicardio. <b>Clínica</b>: dolor retroesternal opresivo &gt; 20-30 min, irradiado a brazo izquierdo, cuello, mandíbula; no cede con reposo ni nitritos; sudoración, náuseas, disnea, angustia. <b>ECG</b>: T hiperaguda → <b>supradesnivel del ST</b> en derivaciones contiguas con imagen especular → <b>onda Q</b> de necrosis y T negativa. Localización: anterior V1-V4 (DA), lateral DI-aVL-V5-V6 (Cx), inferior DII-DIII-aVF (CD). <b>Biomarcadores</b>: troponina (3-4 h, pico 24-48 h, 7-14 días), CK-MB (4-6 h, normaliza 48-72 h), mioglobina (precoz, inespecífica). <b>Complicaciones</b>: FV, IC/shock, rotura, aneurisma, trombo, pericarditis. "Tiempo es músculo": reperfusión urgente.`);
D('c12',2,'Definí insuficiencia cardíaca y explicá sus mecanismos compensadores, indicando por qué a largo plazo resultan perjudiciales.',`IC: el corazón no puede mantener un GC adecuado a las necesidades o lo logra solo con presiones de llenado elevadas. Al caer el GC: (1) <b>simpático</b>: ↑ FC, contractilidad y vasoconstricción → mantiene la PA, pero ↑ MVO₂, arritmias, apoptosis; (2) <b>SRAA</b>: vasoconstricción (↑ poscarga), retención de Na⁺/agua (↑ precarga → congestión), fibrosis por aldosterona; (3) <b>ADH</b>: retención de agua, hiponatremia; (4) <b>Frank-Starling</b>: ↑ volumen ↑ VS, pero en un corazón insuficiente la curva es plana y solo sube la presión de llenado → edema; (5) <b>remodelado</b>: hipertrofia y dilatación (↑ tensión parietal por Laplace). Contrarregulación: péptidos natriuréticos. Estos mecanismos están pensados para la hipovolemia aguda; sostenidos crean un <b>círculo vicioso</b>. Por eso el tratamiento los bloquea (IECA/ARA II, β-bloqueantes, antialdosterónicos).`);
D('c12',3,'Compará la insuficiencia cardíaca izquierda y derecha: fisiopatología y semiología.',`<b>Izquierda</b>: el VI no eyecta → ↑ presión de fin de diástole → ↑ presión en AI, venas y capilares pulmonares → <b>congestión pulmonar</b>: disnea de esfuerzo progresiva, <b>ortopnea</b> (↑ retorno en decúbito), <b>disnea paroxística nocturna</b>, tos, <b>edema agudo de pulmón</b> (Pcap &gt; 25-28 mmHg), crepitantes, sibilancias, R3, derrame pleural; bajo gasto: astenia, oliguria, frialdad, confusión. <b>Derecha</b>: el VD no eyecta → ↑ presión en AD y venas sistémicas → <b>congestión sistémica</b>: ingurgitación yugular, reflujo hepatoyugular, hepatomegalia dolorosa, edemas declives con fóvea, ascitis, derrame pleural, nicturia, dispepsia. Causa más frecuente de IC derecha: la IC izquierda (↑ poscarga del VD). Otras: EPOC (cor pulmonale), TEP, hipertensión pulmonar.`);
D('c13',1,'Describí los pasos de la RCP básica en el adulto.',`(1) Seguridad de la escena. (2) Verificar respuesta y respiración (≤ 10 s; gasping = paro). (3) Pedir ayuda, llamar al servicio de emergencias, pedir un DEA. (4) <b>Compresiones</b> en la mitad inferior del esternón, brazos extendidos, <b>100-120/min</b>, <b>5-6 cm</b>, reexpansión completa, mínimas interrupciones. (5) Si está entrenado, <b>30:2</b> con apertura de vía aérea (frente-mentón); si no, solo manos. (6) <b>DEA</b>: encender, colocar parches, nadie toca al paciente durante el análisis y la descarga, reanudar compresiones de inmediato. (7) Rotar cada 2 min, continuar hasta que llegue ayuda avanzada o el paciente se recupere. Cadena de supervivencia: reconocimiento/llamado, RCP, desfibrilación, soporte avanzado, cuidados posparo, recuperación.`);
D('c13',2,'¿Qué evaluás en el examen físico cardiovascular? Describí pulsos, pulso venoso, palpación precordial y auscultación.',`<b>Inspección</b>: estado general, coloración (cianosis), disnea, edemas, latidos visibles, ingurgitación yugular. <b>Pulsos arteriales</b>: frecuencia, ritmo, amplitud, forma, simetría y pared; carotídeo, radial, humeral, femoral, poplíteo, tibial posterior, pedio; variantes: céler, parvus et tardus, alternante, paradójico. <b>Pulso venoso yugular</b>: a 45°, altura sobre el ángulo de Louis (&lt; 3-4 cm), ondas a, c, v, reflujo hepatoyugular. <b>Palpación</b>: choque de punta (5.º EIC LMC, ≤ 2 cm, breve), frémitos, latidos anormales. <b>Auscultación</b>: focos aórtico, pulmonar, Erb, tricuspídeo, mitral; ritmo, R1 y R2, desdoblamientos, R3/R4, soplos (tiempo, foco, irradiación, intensidad 1-6, tono), frotes. <b>Edemas</b> con fóvea. Toma de PA en ambos brazos.`);
