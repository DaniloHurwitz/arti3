M('r3',2,'En un corte de corteza renal, el túbulo contorneado distal se distingue del proximal porque:',['No tiene ribete en cepillo, su luz es más amplia y se ven más núcleos por corte','Tiene ribete en cepillo más alto','Es plano simple','Tiene citoplasma más acidófilo'],'');
// r4 compartimientos
M('r4',1,'El agua corporal total en un adulto representa aproximadamente:',['60 % del peso','40 % del peso','20 % del peso','80 % del peso'],'Menor en mujeres, ancianos y obesos; mayor en recién nacidos.');
M('r4',1,'El líquido intracelular representa:',['≈ 40 % del peso corporal (2/3 del agua)','≈ 20 % del peso','≈ 5 % del peso','≈ 60 % del peso'],'LEC ≈ 20 % (1/3 del agua).');
M('r4',1,'El catión predominante del líquido intracelular es:',['K⁺','Na⁺','Ca²⁺','H⁺'],'En el LEC predomina el Na⁺.');
M('r4',2,'Para medir el volumen plasmático se utiliza:',['Azul de Evans o albúmina marcada con ¹²⁵I','Inulina','Agua tritiada','Antipirina'],'Inulina → LEC; agua tritiada/antipirina → agua total.');
M('r4',2,'El volumen de líquido intracelular se obtiene:',['Restando el LEC del agua corporal total','Con inulina','Con azul de Evans','Con ⁵¹Cr'],'No hay un indicador que quede solo dentro de las células.');
M('r4',2,'El volumen intersticial se calcula como:',['LEC − volumen plasmático','Agua total − LEC','Agua total − plasma','Volemia − plasma'],'');
M('r4',2,'Si se infunde 1 L de solución fisiológica (NaCl 0,9 %):',['Aumenta el LEC sin cambiar el LIC ni la osmolaridad','Aumentan el LEC y el LIC','Aumenta el LIC solamente','Disminuye el LIC'],'Es isotónica y el NaCl queda en el LEC.');
M('r4',2,'Si se infunde solución salina hipertónica (NaCl 3 %):',['Sale agua de las células: ↑ LEC, ↓ LIC, ↑ osmolaridad','↑ LIC y ↓ LEC','No cambia nada','↑ LEC y ↑ LIC con ↓ osmolaridad'],'');
M('r4',2,'La osmolaridad plasmática normal es aproximadamente:',['280-295 mOsm/L','150 mOsm/L','600 mOsm/L','1200 mOsm/L'],'Estimada: 2 × Na⁺ + glucosa/18 + BUN/2,8.');
M('r4',3,'Un paciente con hiperglucemia severa tiene Na⁺ 130 mEq/L, glucosa 540 mg/dL y BUN 28 mg/dL. Su osmolaridad estimada es:',['≈ 300 mOsm/L','≈ 260 mOsm/L','≈ 330 mOsm/L','≈ 280 mOsm/L'],'2 × 130 + 540/18 + 28/2,8 = 260 + 30 + 10 = 300.');
M('r4',3,'La infusión de dextrosa al 5 % se comporta, una vez metabolizada la glucosa, como:',['Agua libre que se distribuye en LIC y LEC y baja la osmolaridad','Una solución isotónica que queda en el LEC','Una solución hipertónica','Un expansor plasmático exclusivo'],'Por eso no sirve para expandir el plasma y puede producir hiponatremia.');
M('r4',3,'Un paciente con deshidratación por sudoración profusa (sudor hipotónico) presenta:',['↓ LEC, ↓ LIC y ↑ osmolaridad','↓ LEC con LIC normal','↑ LIC','↓ osmolaridad'],'Pierde más agua que sal.');
M('r4',3,'La causa del edema cerebral en la hiponatremia es:',['El agua entra a las neuronas porque el LEC está hipotónico','La pérdida de agua intracelular','El aumento de la presión oncótica','La hipertensión arterial'],'Clínica: cefalea, náuseas, confusión, convulsiones.');
M('r4',2,'En la composición del LEC, el anión principal es:',['Cl⁻','Fosfato','Proteínas','SO₄²⁻'],'Seguido por el HCO₃⁻.');
// r5 FG
M('r5',1,'El filtrado glomerular normal es aproximadamente:',['125 mL/min (180 L/día)','1200 mL/min','650 mL/min','25 mL/min'],'1200 es el FSR y 650 el FPR.');
M('r5',1,'El flujo sanguíneo renal representa aproximadamente qué porcentaje del gasto cardíaco:',['22 %','5 %','50 %','2 %'],'≈ 1100-1200 mL/min.');
M('r5',1,'La fracción de filtración normal es:',['≈ 20 %','≈ 2 %','≈ 50 %','≈ 80 %'],'FG/FPR ≈ 125/650.');
M('r5',2,'La presión neta de filtración glomerular normal (Guyton) es aproximadamente:',['10 mmHg','60 mmHg','32 mmHg','−5 mmHg'],'60 − 18 − 32 = 10 mmHg.');
M('r5',2,'¿Qué fuerza favorece la filtración glomerular?',['La presión hidrostática glomerular','La presión oncótica glomerular','La presión hidrostática en la cápsula de Bowman','La presión oncótica plasmática sistémica'],'P<sub>G</sub> ≈ 60 mmHg.');
M('r5',2,'La albúmina casi no se filtra principalmente por:',['Su carga negativa y su tamaño','Su carga positiva','Su escaso peso molecular','Que se secreta en el proximal'],'La barrera repele aniones.');
M('r5',2,'La constricción de la arteriola aferente produce:',['↓ presión glomerular, ↓ FSR y ↓ FG','↑ presión glomerular y ↑ FG','↓ FSR con ↑ FG','Sin cambios en el FG'],'');
M('r5',3,'La constricción moderada de la arteriola eferente produce:',['↑ presión glomerular y ↑ leve del FG, con ↓ FSR','↓ FG y ↑ FSR','↓ presión glomerular','↑ FSR y ↑ FG'],'Si la constricción es intensa, el FG cae (efecto bifásico) por el gran aumento de la presión oncótica.');
M('r5',2,'Una obstrucción ureteral bilateral reduce el FG porque:',['Aumenta la presión hidrostática en la cápsula de Bowman','Disminuye la presión oncótica','Aumenta el Kf','Dilata la arteriola aferente'],'');
M('r5',2,'La autorregulación del FG mantiene valores estables con PA media entre:',['≈ 75 y 160 mmHg','≈ 20 y 50 mmHg','≈ 180 y 250 mmHg','Cualquier valor de PA'],'');
M('r5',3,'En la retroalimentación tubuloglomerular, si cae el FG:',['Llega menos NaCl a la mácula densa → dilatación aferente y ↑ renina (constricción eferente)','Llega más NaCl a la mácula densa → constricción aferente','Se libera PNA','Se inhibe la renina'],'Ambas respuestas restituyen la presión glomerular.');
M('r5',3,'Un paciente deshidratado con estenosis bilateral de arterias renales comienza un IECA y cae su FG. ¿Por qué?',['Se pierde la constricción eferente mediada por angiotensina II que sostenía la presión glomerular','El IECA contrae la aferente','El IECA aumenta la presión en Bowman','El IECA aumenta la presión oncótica'],'');
M('r5',3,'Los AINE pueden precipitar insuficiencia renal en pacientes hipovolémicos porque:',['Bloquean las prostaglandinas vasodilatadoras de la arteriola aferente','Contraen la eferente','Aumentan el Kf','Estimulan la renina'],'En la hipovolemia el FG depende de las prostaglandinas.');
M('r5',2,'¿Cuál de estos AUMENTA el FG?',['Dieta rica en proteínas','Estimulación simpática intensa','Endotelina','Aumento de la presión oncótica plasmática'],'↑ reabsorción proximal de Na⁺ con aminoácidos → menos NaCl a la mácula densa → dilatación aferente.');
M('r5',2,'La presión oncótica a lo largo del capilar glomerular:',['Aumenta desde ≈ 28 a ≈ 36 mmHg','Disminuye','Se mantiene constante','Es cero'],'Al filtrarse agua, las proteínas se concentran.');
M('r5',3,'El consumo de O₂ renal es proporcional sobre todo a:',['La reabsorción activa de Na⁺','El flujo sanguíneo de la médula','La producción de renina','La secreción de creatinina'],'Si cae el FG, se filtra y reabsorbe menos Na⁺ y baja el consumo.');
// r6 clearance
M('r6',1,'El clearance de inulina mide:',['El filtrado glomerular','El flujo plasmático renal','La secreción tubular','La reabsorción de agua'],'Se filtra y no se reabsorbe ni se secreta.');
M('r6',1,'El clearance de PAH se usa para estimar:',['El flujo plasmático renal efectivo','El FG','La capacidad de concentración','El anión gap'],'Se filtra y se secreta casi completamente.');
M('r6',1,'La fórmula del aclaramiento es:',['(U × V) / P','(P × V) / U','U / (P × V)','U × P × V'],'');
M('r6',2,'Si el clearance de una sustancia es menor que el FG, hay:',['Reabsorción neta','Secreción neta','Solo filtración','Error de laboratorio necesariamente'],'');
M('r6',2,'Si el clearance de una sustancia es mayor que el de la inulina, la sustancia:',['Se secreta','Se reabsorbe','No se filtra','Se metaboliza en el riñón'],'');
M('r6',2,'El clearance de creatinina sobreestima levemente el FG porque:',['Una pequeña cantidad de creatinina se secreta en el túbulo','La creatinina se reabsorbe','La creatinina no se filtra libremente','Se produce en el riñón'],'');
M('r6',2,'Si el FG cae a la mitad (en estado estable), la creatinina plasmática:',['Se duplica','Se reduce a la mitad','No cambia','Aumenta 4 veces'],'La relación es inversa (hiperbólica).');
M('r6',2,'U<sub>x</sub> = 50 mg/mL, V = 2 mL/min, P<sub>x</sub> = 1 mg/mL. El clearance de X es:',['100 mL/min','25 mL/min','50 mL/min','200 mL/min'],'(50 × 2)/1 = 100 mL/min.');
M('r6',3,'El clearance de glucosa en una persona sana es:',['≈ 0','≈ 125 mL/min','≈ 650 mL/min','Mayor que el de inulina'],'Se reabsorbe totalmente mientras no se supere el Tm.');
M('r6',3,'Una FENa &lt; 1 % en un paciente con insuficiencia renal aguda sugiere:',['Causa prerrenal','Necrosis tubular aguda','Obstrucción crónica','Nefritis intersticial'],'Los túbulos sanos retienen Na⁺ con avidez.');
M('r6',3,'La carga filtrada de una sustancia se calcula como:',['FG × concentración plasmática','U × V','FG / P','FPR × hematocrito'],'Si es libremente filtrable.');
M('r6',3,'FPR 600 mL/min y hematocrito 40 %. El flujo sanguíneo renal es:',['1000 mL/min','360 mL/min','840 mL/min','1500 mL/min'],'FSR = FPR / (1 − 0,4) = 600 / 0,6 = 1000.');
// r7 transporte tubular
M('r7',1,'¿Qué porcentaje del Na⁺ y del agua filtrados se reabsorbe en el túbulo proximal?',['≈ 65 %','≈ 25 %','≈ 5 %','≈ 99 %'],'Reabsorción isoosmótica.');
M('r7',1,'La glucosa filtrada se reabsorbe casi totalmente en:',['El túbulo proximal','El asa de Henle','El túbulo distal','El conducto colector'],'Por SGLT2 y SGLT1.');
M('r7',1,'El motor del transporte tubular de Na⁺ es:',['La Na⁺/K⁺-ATPasa basolateral','El canal ENaC luminal','La anhidrasa carbónica','La acuaporina 2'],'Mantiene el Na⁺ intracelular bajo, generando el gradiente.');
M('r7',2,'La furosemida actúa bloqueando:',['El cotransportador Na⁺-K⁺-2Cl⁻ de la rama ascendente gruesa','El cotransportador Na⁺-Cl⁻ del distal','El ENaC del colector','La anhidrasa carbónica proximal'],'Diurético de asa: el más potente.');
M('r7',2,'Las tiazidas actúan en:',['El túbulo contorneado distal (cotransportador Na⁺-Cl⁻)','El túbulo proximal','La rama descendente delgada','El colector medular'],'Disminuyen la excreción de Ca²⁺.');
M('r7',2,'La rama ascendente gruesa del asa de Henle es:',['Impermeable al agua: diluye el líquido tubular','Muy permeable al agua','Permeable a la urea','El sitio de acción de la ADH'],'"Segmento diluyente".');
M('r7',2,'La aldosterona actúa sobre las células principales para:',['Reabsorber Na⁺ y secretar K⁺','Reabsorber K⁺ y secretar Na⁺','Reabsorber glucosa','Secretar HCO₃⁻'],'Aumenta ENaC, ROMK y la Na⁺/K⁺-ATPasa.');
M('r7',2,'El estímulo más directo para la secreción de aldosterona, junto con la angiotensina II, es:',['El aumento del K⁺ plasmático','El aumento del Na⁺ plasmático','La hipoglucemia','El PNA'],'El PNA la inhibe.');
M('r7',2,'La PTH a nivel renal:',['Disminuye la reabsorción de fosfato en el proximal y aumenta la de Ca²⁺ en el distal','Aumenta la reabsorción de fosfato','Aumenta la excreción de Ca²⁺','Inhibe la 1α-hidroxilasa'],'');
M('r7',2,'La espironolactona es un diurético:',['Ahorrador de K⁺ (antagonista de la aldosterona)','De asa','Que produce hipopotasemia','Inhibidor de la anhidrasa carbónica'],'Riesgo de hiperpotasemia.');
M('r7',3,'El umbral renal de glucosa es aproximadamente:',['180-200 mg/dL de glucemia','90 mg/dL','375 mg/dL','500 mg/dL'],'375 mg/min es el Tm (carga reabsorbida máxima), no la glucemia.');
M('r7',3,'La secreción de K⁺ en el colector cortical aumenta con:',['↑ K⁺ plasmático, aldosterona y ↑ flujo tubular','Acidosis aguda','Déficit de aldosterona','Disminución del flujo tubular'],'Por eso los diuréticos de asa y tiazidas producen hipopotasemia.');
M('r7',3,'En los capilares peritubulares la reabsorción está favorecida porque:',['La presión hidrostática es baja y la oncótica es alta','La presión hidrostática es muy alta','No hay proteínas','La presión oncótica es cero'],'La sangre eferente perdió ≈ 20 % del plasma por filtración.');
M('r7',3,'¿Qué sustancias se SECRETAN en el túbulo proximal?',['PAH, ácidos y bases orgánicos, fármacos como penicilina','Glucosa y aminoácidos','Albúmina','Na⁺ y Cl⁻'],'');
M('r7',2,'El balance glomerulotubular significa que:',['La reabsorción proximal aumenta proporcionalmente al aumento de la carga filtrada','El FG se ajusta a la reabsorción distal','La secreción iguala a la filtración','El túbulo no responde a cambios del FG'],'');
// r8 concentración
M('r8',1,'El riñón puede concentrar la orina hasta aproximadamente:',['1200-1400 mOsm/L','300 mOsm/L','600 mOsm/L','3000 mOsm/L'],'Y diluirla hasta ≈ 50 mOsm/L.');
M('r8',1,'La ADH se sintetiza en:',['Los núcleos supraóptico y paraventricular del hipotálamo','La adenohipófisis','La corteza suprarrenal','El riñón'],'Se almacena y libera en la neurohipófisis.');
M('r8',1,'La ADH aumenta la permeabilidad al agua del colector insertando:',['Acuaporina 2 en la membrana luminal','Acuaporina 1 en la rama descendente','Canales ENaC','SGLT2'],'Vía receptor V2 → AMPc.');
M('r8',2,'El "multiplicador" de contracorriente es:',['El asa de Henle','Los vasos rectos','El túbulo proximal','La cápsula de Bowman'],'Los vasos rectos son el intercambiador.');
M('r8',2,'El segmento que siempre entrega un líquido hipotónico (≈ 100 mOsm/L), con o sin ADH, es:',['La rama ascendente gruesa','El túbulo proximal','La rama descendente delgada','El colector medular'],'Bombea NaCl sin agua.');
M('r8',2,'La función de los vasos rectos es:',['Mantener el gradiente medular sin "lavarlo" (intercambio pasivo)','Crear el gradiente por transporte activo','Filtrar plasma','Secretar urea'],'Flujo lento en horquilla.');
M('r8',2,'La urea contribuye a la hiperosmolaridad medular en aproximadamente:',['40-50 %','5 %','90 %','No contribuye'],'Se recicla desde el colector medular interno (permeable a la urea con ADH).');
M('r8',2,'El volumen urinario obligatorio diario es aproximadamente:',['0,5 L','2 L','0,1 L','5 L'],'≈ 600 mOsm / 1200 mOsm/L.');
M('r8',2,'¿Cuál es el estímulo más sensible para la secreción de ADH?',['Un aumento de ≈ 1 % de la osmolaridad plasmática','Una caída de 1 % de la volemia','La hipopotasemia','El frío'],'La hipovolemia es menos sensible (≥ 10 %) pero muy potente.');
M('r8',2,'¿Cuál inhibe la secreción de ADH?',['El alcohol','La nicotina','Las náuseas','La angiotensina II'],'Por eso el alcohol aumenta la diuresis.');
M('r8',3,'Los diuréticos de asa disminuyen la capacidad de concentrar la orina porque:',['Bloquean el NKCC2 y disipan el gradiente medular','Bloquean la ADH','Aumentan la urea medular','Disminuyen el flujo de los vasos rectos'],'');
M('r8',3,'El aclaramiento de agua libre es negativo cuando:',['La orina está concentrada (se retiene agua)','La orina está diluida','No hay ADH','Hay diabetes insípida'],'C<sub>H₂O</sub> = V − C<sub>osm</sub>.');
M('r8',3,'Poliuria con orina diluida que corrige con desmopresina sugiere:',['Diabetes insípida central','Diabetes insípida nefrogénica','SIADH','Diabetes mellitus'],'La nefrogénica no responde.');
M('r8',3,'El SIADH produce:',['Hiponatremia euvolémica con orina inapropiadamente concentrada','Hipernatremia','Poliuria de orina diluida','Hiperpotasemia'],'');
M('r8',3,'Sin ADH, la osmolaridad del líquido en el colector cortical es:',['Menor de 100 mOsm/L (sigue diluyéndose)','≈ 300 mOsm/L','≈ 1200 mOsm/L','≈ 600 mOsm/L'],'Con ADH se equilibra con el intersticio cortical (≈ 300).');
// r9 electrolitos
M('r9',1,'El valor normal de potasio plasmático es:',['3,5-5 mEq/L','135-145 mEq/L','8,5-10,5 mEq/L','1,7-2,4 mEq/L'],'');
M('r9',1,'El primer signo electrocardiográfico de hiperpotasemia es:',['Ondas T altas y picudas','Onda U prominente','QRS estrecho','Supradesnivel del ST'],'Luego PR largo, P aplanada, QRS ancho, sinusoidal, FV.');
M('r9',1,'La onda U prominente y las T aplanadas sugieren:',['Hipopotasemia','Hiperpotasemia','Hipercalcemia','Hipernatremia'],'');
M('r9',2,'En una hiperpotasemia con cambios en el ECG, el primer fármaco a administrar es:',['Gluconato de calcio, para estabilizar la membrana','Bicarbonato oral','Espironolactona','Furosemida en comprimidos'],'No baja el K⁺, pero protege el corazón; luego insulina + glucosa, salbutamol, etc.');
M('r9',2,'La insulina reduce el K⁺ plasmático porque:',['Estimula la Na⁺/K⁺-ATPasa e introduce K⁺ en las células','Aumenta la excreción renal de K⁺','Lo elimina por heces','Inhibe la aldosterona'],'');
M('r9',2,'¿Qué fármaco puede producir hiperpotasemia?',['IECA (enalapril)','Furosemida','Hidroclorotiazida','Salbutamol'],'↓ aldosterona. Los otros bajan el K⁺.');
M('r9',2,'La acidosis metabólica tiende a producir:',['Hiperpotasemia (salida de K⁺ de las células)','Hipopotasemia','Hipernatremia','Hipercalcemia'],'');
M('r9',2,'La hiponatremia en la insuficiencia cardíaca es:',['Hipervolémica (dilucional)','Hipovolémica','Euvolémica por SIADH','Por pérdidas digestivas'],'Hay exceso de agua corporal mayor que el exceso de Na⁺.');
M('r9',3,'Corregir demasiado rápido una hiponatremia crónica puede producir:',['Desmielinización osmótica (mielinólisis pontina central)','Edema cerebral','Hipopotasemia','Hipercalcemia'],'Máximo ≈ 8-10 mEq/L en 24 h.');
M('r9',2,'Los signos de Chvostek y Trousseau indican:',['Hipocalcemia','Hipercalcemia','Hiperpotasemia','Hiponatremia'],'Aumento de la excitabilidad neuromuscular.');
M('r9',2,'La hipercalcemia produce en el ECG:',['QT corto','QT largo','Onda U','T picudas'],'La hipocalcemia alarga el QT.');
M('r9',3,'Un paciente hiperventila por ansiedad y presenta parestesias y espasmo carpopedal. El mecanismo es:',['La alcalosis aumenta la unión del Ca²⁺ a la albúmina y baja el Ca²⁺ iónico','Pierde calcio por la orina','La alcalosis aumenta el Ca²⁺ iónico','Hipopotasemia severa'],'');
M('r9',3,'Los vómitos persistentes producen:',['Alcalosis metabólica con hipopotasemia','Acidosis metabólica con hiperpotasemia','Acidosis respiratoria','Hipernatremia con hiperpotasemia'],'Pérdida de HCl; la hipovolemia activa la aldosterona (pierde K⁺ y H⁺ por orina).');
M('r9',3,'En la ERC, la hiperfosfatemia contribuye al hiperparatiroidismo secundario porque:',['Reduce el Ca²⁺ iónico y el calcitriol, estimulando la PTH','Inhibe directamente la PTH','Aumenta el calcitriol','Produce hipercalcemia'],'');
// r10 ácido-base
M('r10',1,'El pH arterial normal está entre:',['7,35 y 7,45','7,0 y 7,2','7,5 y 7,7','6,8 y 7,0'],'');
M('r10',1,'El principal amortiguador del líquido extracelular es:',['El sistema bicarbonato/ácido carbónico','El fosfato','La hemoglobina','El amoníaco'],'Es abierto: el pulmón regula el CO₂ y el riñón el HCO₃⁻.');
M('r10',1,'El sistema más potente (aunque más lento) de regulación ácido-base es:',['El renal','El respiratorio','Los amortiguadores químicos','El hepático'],'Horas a días; puede corregir del todo.');
M('r10',2,'Según Henderson-Hasselbalch, el pH depende de:',['La relación HCO₃⁻ / (0,03 × PCO₂), normalmente 20:1','La suma de HCO₃⁻ y PCO₂','La PO₂','La concentración de Na⁺'],'pH = 6,1 + log (HCO₃⁻ / 0,03 PCO₂).');
M('r10',2,'La mayor parte del HCO₃⁻ filtrado se reabsorbe en:',['El túbulo proximal (≈ 80-85 %)','El asa de Henle','El colector','El túbulo distal'],'Gracias a la anhidrasa carbónica y el intercambiador Na⁺/H⁺.');
M('r10',2,'El mecanismo renal de excreción de ácido más adaptable en la acidosis crónica es:',['La excreción de amonio (NH₄⁺) a partir de glutamina','La acidez titulable por fosfato','La excreción de H⁺ libre','La reabsorción de cloro'],'Puede aumentar hasta ≈ 500 mEq/día.');
M('r10',2,'El pH urinario mínimo que se puede alcanzar es aproximadamente:',['4,5','6,5','2','7,4'],'Por eso se necesitan amortiguadores urinarios.');
M('r10',2,'pH 7,29, PCO₂ 28 mmHg, HCO₃⁻ 13 mEq/L. Se trata de:',['Acidosis metabólica con compensación respiratoria','Acidosis respiratoria','Alcalosis metabólica','Alcalosis respiratoria'],'Winter: 1,5 × 13 + 8 = 27,5 ± 2 → PCO₂ 28 es la esperada: compensación adecuada.');
M('r10',2,'pH 7,50, PCO₂ 48 mmHg, HCO₃⁻ 36 mEq/L. Se trata de:',['Alcalosis metabólica compensada','Acidosis respiratoria','Alcalosis respiratoria','Acidosis metabólica'],'Típico de vómitos o diuréticos.');
M('r10',2,'pH 7,26, PCO₂ 60 mmHg, HCO₃⁻ 26 mEq/L en un paciente con sobredosis de opioides. Se trata de:',['Acidosis respiratoria aguda','Acidosis respiratoria crónica','Acidosis metabólica','Alcalosis metabólica'],'HCO₃⁻ ↑ solo ≈ 1 por cada 10 de PCO₂: aguda.');
M('r10',2,'La respiración de Kussmaul es una compensación de:',['La acidosis metabólica','La alcalosis metabólica','La acidosis respiratoria','La alcalosis respiratoria'],'Hiperventilación profunda para eliminar CO₂.');
M('r10',2,'El anión gap normal es:',['8-12 mEq/L','20-30 mEq/L','0-2 mEq/L','40 mEq/L'],'AG = Na⁺ − (Cl⁻ + HCO₃⁻).');

/* ===================== RENAL · DESARROLLO ===================== */
D('r1',1,'Describí la situación, relaciones y envolturas del riñón.',`Órganos <b>retroperitoneales</b> en la pared abdominal posterior, entre <b>T12 y L3</b>; el derecho más bajo por el hígado; hilio en L1. <b>Posteriores</b>: diafragma, psoas mayor, cuadrado lumbar, transverso del abdomen, costilla 12 (y 11 a la izquierda), nervios subcostal, iliohipogástrico e ilioinguinal. <b>Anteriores derechas</b>: suprarrenal, hígado, 2.ª porción del duodeno, flexura hepática del colon. <b>Anteriores izquierdas</b>: suprarrenal, estómago, bazo, cola del páncreas, flexura esplénica y colon descendente, yeyuno. <b>Envolturas</b> (de adentro afuera): cápsula fibrosa, grasa perirrenal, fascia renal (Gerota), grasa pararrenal. Hilio: vena, arteria, pelvis (de anterior a posterior).`);
D('r1',2,'Describí la vascularización arterial y venosa del riñón y su importancia clínica.',`<b>Arterias renales</b> (ramas de la aorta a nivel L1-L2; la derecha más larga, por detrás de la VCI) → <b>segmentarias</b> (5: superior, anterosuperior, anteroinferior, inferior, posterior; <b>terminales</b> → infarto segmentario) → <b>interlobulares</b> (entre pirámides) → <b>arcuatas</b> (unión corticomedular) → <b>interlobulillares</b> (radiales corticales) → <b>aferentes</b> → glomérulo → <b>eferentes</b> → capilares peritubulares (corticales) o <b>vasos rectos</b> (yuxtamedulares). Es un sistema <b>portal arterial</b> (dos lechos capilares en serie). <b>Venas</b> siguen un trayecto inverso hasta las renales → VCI. La <b>izquierda</b> es más larga, cruza por delante de la aorta bajo la AMS (cascanueces) y recibe la gonadal y la suprarrenal izquierdas (varicocele más frecuente a la izquierda). Recibe ≈ 22 % del GC.`);
D('r2',2,'Describí el trayecto del uréter, sus estrechamientos y su relevancia clínica.',`25-30 cm, retroperitoneal. <b>Abdominal</b>: desciende sobre el psoas, cruzado por delante por los vasos gonadales. Entra en la pelvis <b>cruzando la bifurcación de la ilíaca común</b>. <b>Pélvico</b>: en el varón lo cruza el conducto deferente; en la mujer pasa <b>bajo la arteria uterina</b> cerca del cuello uterino (riesgo en la histerectomía). <b>Intramural</b>: atraviesa oblicuamente la vejiga (válvula antirreflujo). <b>Estrechamientos</b>: unión pieloureteral, cruce de los vasos ilíacos, unión ureterovesical: sitios de impactación de cálculos → <b>cólico renal</b> (dolor lumbar paroxístico irradiado a flanco, ingle y genitales, inquietud, náuseas, hematuria). Histología: urotelio, muscular longitudinal interna y circular externa (+ longitudinal externa en el tercio inferior), adventicia. Transporta la orina por peristaltismo.`);
D('r2',3,'Explicá la inervación de la vejiga y el reflejo miccional.',`<b>Parasimpático</b> (S2-S4, nervios esplácnicos pélvicos): contrae el detrusor y relaja el cuello → <b>vaciamiento</b>. <b>Simpático</b> (T11-L2, nervios hipogástricos): relaja el detrusor (β3) y contrae el esfínter interno (α1) → <b>llenado/continencia</b>. <b>Somático</b> (nervio pudendo, S2-S4): contrae el esfínter uretral externo estriado (control voluntario). <b>Reflejo miccional</b>: al llenarse (≈ 150-300 mL) los receptores de estiramiento envían señales por los nervios pélvicos a la médula sacra → contracciones del detrusor que se autoamplifican; el <b>centro pontino de la micción</b> coordina la contracción del detrusor con la relajación del esfínter externo, y la corteza permite inhibirlo o facilitarlo. Lesión medular suprasacra → vejiga refleja/espástica; lesión sacra o de nervios pélvicos → vejiga atónica con retención y rebosamiento.`);
D('r3',1,'Describí la barrera de filtración glomerular y explicá por qué la albúmina no se filtra.',`Tres capas: (1) <b>endotelio fenestrado</b> (poros de 70-100 nm sin diafragma, con glucocáliz negativo): detiene células; (2) <b>membrana basal glomerular</b>: colágeno IV, laminina y <b>proteoglucanos de heparán sulfato</b> con <b>carga negativa</b>; (3) <b>podocitos</b>: pedicelos interdigitados con hendiduras de filtración cerradas por el <b>diafragma de hendidura</b> (nefrina, podocina). Selectividad por <b>tamaño</b> (&lt; 7000 Da filtran libremente; la albúmina tiene ≈ 69 000 Da) y por <b>carga</b> (la albúmina es aniónica y es repelida). Por eso la filtrabilidad de la albúmina es ≈ 0,005. Si se pierde la carga negativa (cambios mínimos) o se daña el diafragma, aparece proteinuria/síndrome nefrótico.`);
D('r3',2,'Describí la histología de los distintos segmentos del túbulo renal y del aparato yuxtaglomerular, relacionándola con su función.',`<b>TCP</b>: cúbico, acidófilo, <b>ribete en cepillo</b> (superficie), estriación basal con mitocondrias (energía para la Na⁺/K⁺-ATPasa) → reabsorbe ≈ 65 %. <b>Asa delgada</b>: plano simple; descendente permeable al agua. <b>Rama ascendente gruesa</b>: cúbico bajo, muchas mitocondrias, NKCC2, impermeable al agua. <b>TCD</b>: cúbico sin ribete, luz amplia; contiene la <b>mácula densa</b>. <b>Colector</b>: cúbico-cilíndrico con límites nítidos; <b>principales</b> (Na⁺, K⁺, agua; aldosterona y ADH) e <b>intercaladas</b> (H⁺/HCO₃⁻). <b>Aparato yuxtaglomerular</b>: <b>células yuxtaglomerulares</b> (músculo liso modificado de la aferente con gránulos de renina: barorreceptor), <b>mácula densa</b> (sensor de NaCl: retroalimentación tubuloglomerular y renina) y <b>células mesangiales extraglomerulares</b>. Regula el FG y la PA vía SRAA.`);
D('r4',1,'Describí los compartimientos de los líquidos corporales, su composición y cómo se miden.',`Agua total ≈ <b>60 %</b> del peso (42 L): <b>LIC 40 %</b> (28 L) y <b>LEC 20 %</b> (14 L) = intersticial (≈ 11 L) + plasma (≈ 3 L) + transcelular. LEC rico en <b>Na⁺, Cl⁻, HCO₃⁻</b>; LIC rico en <b>K⁺, Mg²⁺, fosfatos y proteínas</b> (por la Na⁺/K⁺-ATPasa). Plasma e intersticio difieren en las proteínas. Osmolaridad igual en todos (≈ 285). Medición por <b>dilución de indicadores</b> (V = cantidad/concentración): agua total con agua tritiada, D₂O o antipirina; LEC con inulina o ²²Na; plasma con azul de Evans o ¹²⁵I-albúmina; LIC = agua total − LEC; intersticial = LEC − plasma. El % de agua es mayor en el recién nacido y menor en mujeres, ancianos y obesos.`);
D('r4',3,'Explicá qué ocurre con los volúmenes del LIC y LEC y con la osmolaridad al infundir soluciones isotónicas, hipertónicas e hipotónicas, y al perder agua pura.',`Principios: el agua se mueve libremente hasta igualar osmolaridades; el NaCl queda en el LEC. <b>Isotónica (NaCl 0,9 %)</b>: ↑ LEC, LIC sin cambios, osmolaridad igual (útil para expandir volumen). <b>Hipertónica (NaCl 3 %)</b>: ↑ osmolaridad del LEC → sale agua de las células → ↑↑ LEC, ↓ LIC, ↑ osmolaridad (se usa en hiponatremia grave/edema cerebral). <b>Hipotónica o dextrosa 5 % (agua libre tras metabolizar la glucosa)</b>: ↓ osmolaridad → entra agua a las células → ↑ LEC y ↑ LIC (riesgo de hiponatremia/edema cerebral). <b>Pérdida de agua pura o sudor hipotónico</b>: ↑ osmolaridad, ↓ LEC y ↓ LIC (hipernatremia). <b>Pérdida isotónica</b> (diarrea, hemorragia): ↓ LEC, LIC y osmolaridad sin cambios.`);
D('r5',1,'Explicá las fuerzas que determinan el filtrado glomerular y cómo se modifican.',`FG = <b>Kf × PNF</b>. PNF = P<sub>G</sub> (≈ 60, favorece) − P<sub>B</sub> (≈ 18, se opone) − π<sub>G</sub> (≈ 32, se opone) + π<sub>B</sub> (≈ 0) = <b>10 mmHg</b>. FG ≈ 125 mL/min. Modificaciones: <b>↑ P<sub>G</sub></b> por ↑ PA (amortiguado por autorregulación), dilatación aferente o constricción eferente moderada → ↑ FG; <b>↓ P<sub>G</sub></b> por constricción aferente (simpático, endotelina) → ↓ FG. <b>↑ P<sub>B</sub></b> por obstrucción urinaria → ↓ FG. <b>↑ π<sub>G</sub></b> por deshidratación, ↓ FSR o ↑ FF → ↓ FG. <b>↓ Kf</b> por diabetes, HTA crónica, pérdida de nefronas → ↓ FG.`);
D('r5',2,'Explicá la autorregulación del flujo sanguíneo renal y del FG.',`Mantiene FG y FSR casi constantes con PA media entre ≈ 75 y 160 mmHg, para que la excreción de agua y solutos no dependa de cada cambio de PA. <b>(1) Mecanismo miogénico</b>: el estiramiento de la pared de la arteriola aferente abre canales catiónicos, entra Ca²⁺ y la arteriola se contrae (si sube la PA) o se relaja (si baja). <b>(2) Retroalimentación tubuloglomerular</b>: la <b>mácula densa</b> detecta el NaCl que llega al final de la rama ascendente gruesa. Si cae el FG → llega menos NaCl → (a) <b>dilatación de la aferente</b> (↑ P<sub>G</sub>) y (b) <b>liberación de renina</b> → angiotensina II → <b>constricción de la eferente</b> (↑ P<sub>G</sub>) → el FG se normaliza. Si sube el FG ocurre lo contrario (adenosina/ATP contraen la aferente). Por fuera del rango, o con simpático intenso, la autorregulación falla.`);
D('r5',3,'Analizá el efecto de las arteriolas aferente y eferente sobre el FG y el FSR, y su aplicación farmacológica (IECA, AINE, iSGLT2).',`<b>Aferente</b>: su constricción ↓ P<sub>G</sub>, FSR y FG; su dilatación los ↑. <b>Eferente</b>: su constricción moderada ↑ P<sub>G</sub> y el FG aunque ↓ el FSR; si es intensa, el FG cae (efecto bifásico) porque al ↓ el flujo ↑ mucho la π<sub>G</sub>. <b>AII</b> contrae preferentemente la eferente → sostiene el FG en la hipovolemia y la estenosis de arteria renal; los <b>IECA/ARA II</b> dilatan la eferente → ↓ P<sub>G</sub> y la proteinuria (nefroprotección en la diabetes), pero pueden hacer caer el FG en la estenosis bilateral o la deshidratación. Las <b>prostaglandinas</b> dilatan la aferente; los <b>AINE</b> las bloquean → ↓ FG en pacientes con hipovolemia, IC o cirrosis. Los <b>iSGLT2</b> ↑ el NaCl en la mácula densa → constricción aferente → ↓ hiperfiltración.`);
D('r6',2,'Definí aclaramiento renal, escribí su fórmula y explicá los usos de la inulina, creatinina y PAH.',`Volumen de plasma depurado completamente de una sustancia por unidad de tiempo: <b>C = (U × V)/P</b>. <b>Inulina</b>: se filtra libremente, no se reabsorbe, no se secreta ni se metaboliza → <b>C<sub>inulina</sub> = FG</b> (≈ 125 mL/min; patrón oro, poco práctico). <b>Creatinina</b>: endógena, producción constante; se filtra y se secreta un poco → sobreestima levemente el FG; uso clínico (orina de 24 h o fórmulas CKD-EPI, Cockcroft-Gault). La creatinina plasmática es inversamente proporcional al FG. <b>PAH</b>: se filtra y se secreta casi totalmente (≈ 90 %) → <b>C<sub>PAH</sub> = FPR efectivo</b> (≈ 650); FSR = FPR/(1 − Hto). Comparando C<sub>x</sub> con el FG: menor → reabsorción neta; mayor → secreción neta. FF = FG/FPR ≈ 20 %.`);
D('r7',1,'Describí la reabsorción tubular de sodio y agua a lo largo de la nefrona.',`<b>Proximal (≈ 65 %)</b>: Na⁺/K⁺-ATPasa basolateral crea el gradiente; el Na⁺ entra por cotransporte (glucosa SGLT, aminoácidos, fosfato) y contratransporte Na⁺/H⁺; el agua sigue por ósmosis (AQP1) → reabsorción isoosmótica; también 100 % de glucosa y aminoácidos y 80-90 % del HCO₃⁻. <b>Rama descendente</b>: reabsorbe agua (≈ 20 %), no solutos. <b>Rama ascendente gruesa (≈ 25 % del Na⁺)</b>: NKCC2 (furosemida), impermeable al agua → diluye; reabsorbe Ca²⁺ y Mg²⁺ paracelular. <b>Distal inicial (≈ 5 %)</b>: NCC (tiazidas), impermeable al agua. <b>Distal final y colector</b>: células principales con ENaC regulado por <b>aldosterona</b> (reabsorbe Na⁺, secreta K⁺) y agua regulada por <b>ADH</b> (AQP2). Ajuste fino: AII, aldosterona, ADH, PNA, simpático, natriuresis por presión.`);
D('r7',3,'Explicá cómo regula el riñón la excreción de potasio y qué factores la modifican.',`El K⁺ se filtra libremente; ≈ 65 % se reabsorbe en el proximal y ≈ 25-30 % en la rama ascendente gruesa (NKCC2), de modo que la carga que llega al distal es pequeña y casi constante. La <b>excreción se regula por la secreción</b> en las <b>células principales</b> del distal final y colector cortical: la Na⁺/K⁺-ATPasa basolateral introduce K⁺ en la célula y este sale a la luz por canales ROMK, favorecido por la electronegatividad luminal que genera la reabsorción de Na⁺ por ENaC. Aumentan la secreción: <b>↑ K⁺ plasmático</b> (directo y vía aldosterona), <b>aldosterona</b>, <b>↑ flujo tubular distal</b> y ↑ Na⁺ distal (diuréticos de asa y tiazidas → hipopotasemia), alcalosis. La disminuyen: déficit de aldosterona, ahorradores de K⁺, IECA/ARA II, <b>acidosis aguda</b>, ↓ flujo distal (IRA, hipovolemia). En la depleción, las intercaladas reabsorben K⁺ (H⁺/K⁺-ATPasa).`);
D('r8',2,'Explicá el mecanismo de contracorriente para la concentración de la orina.',`<b>Requisitos</b>: ADH alta e intersticio medular hiperosmótico. <b>Multiplicador (asa de Henle)</b>: la <b>rama ascendente gruesa</b> bombea NaCl (NKCC2) al intersticio sin agua (impermeable) → gradiente de ≈ 200 mOsm/L ("efecto único"); la <b>rama descendente</b>, permeable al agua, pierde agua y su líquido se equilibra con el intersticio; el flujo desplaza el líquido concentrado hacia la punta; la repetición multiplica el gradiente hasta <b>1200-1400 mOsm/L</b> en la papila (asas largas yuxtamedulares). <b>Urea</b>: con ADH se concentra en el colector cortical y difunde desde el colector medular interno (UT-A1) al intersticio (≈ 40-50 % de la osmolaridad medular); recircula. <b>Intercambiador (vasos rectos)</b>: flujo lento en horquilla que intercambia pasivamente solutos y agua sin lavar el gradiente. <b>ADH</b> (V2 → AQP2) hace permeables al agua el distal final y los colectores, que pierden agua hacia el intersticio → orina de hasta 1200 mOsm/L. Sin ADH: orina diluida (≈ 50 mOsm/L).`);
D('r8',3,'Explicá el control de la osmolaridad del LEC por el sistema osmorreceptor-ADH y la sed, y sus alteraciones (diabetes insípida y SIADH).',`↑ osmolaridad (≈ 1 %) → los <b>osmorreceptores</b> del hipotálamo anterior se encogen → ↑ síntesis de ADH en núcleos <b>supraóptico y paraventricular</b> → liberación por la <b>neurohipófisis</b> → receptor V2 → AMPc → <b>AQP2</b> → reabsorción de agua → la osmolaridad baja. A la vez se activa la <b>sed</b> (órgano subfornical, OVLT). Estímulos no osmóticos de la ADH: ↓ volumen/PA ≥ 10 %, náuseas, nicotina, morfina, AII; inhiben: alcohol, PNA. <b>Diabetes insípida</b>: central (falta de ADH; responde a desmopresina) o nefrogénica (sin respuesta renal: litio, hipercalcemia, hipopotasemia) → poliuria hipotónica, polidipsia, riesgo de hipernatremia. <b>SIADH</b>: ADH inapropiada (carcinoma pulmonar de células pequeñas, SNC, fármacos) → retención de agua, hiponatremia euvolémica, orina inapropiadamente concentrada, Na⁺ urinario alto.`);
D('r9',2,'Describí causas, clínica, ECG y tratamiento de la hiperpotasemia.',`K⁺ &gt; 5 mEq/L. <b>Causas</b>: ↓ excreción (insuficiencia renal, hipoaldosteronismo, IECA/ARA II, espironolactona, amilorida), redistribución (acidosis, déficit de insulina, β-bloqueantes, ↑ osmolaridad), liberación celular (rabdomiólisis, hemólisis, lisis tumoral), exceso de aporte; descartar pseudohiperpotasemia (muestra hemolizada). <b>Clínica</b>: debilidad, parálisis flácida, parestesias, arritmias. <b>ECG</b>: T altas y picudas → PR largo y P aplanada → QRS ancho → onda sinusoidal → FV/asistolia. <b>Tratamiento</b>: (1) <b>gluconato de calcio</b> EV (estabiliza la membrana); (2) redistribución: <b>insulina + glucosa</b>, β2-agonistas (salbutamol), bicarbonato si hay acidosis; (3) eliminación: resinas de intercambio, diuréticos de asa, <b>diálisis</b>; suspender fármacos causales.`);
D('r10',1,'Explicá los sistemas de regulación del equilibrio ácido-base.',`(1) <b>Amortiguadores químicos</b> (segundos): <b>bicarbonato</b> (principal del LEC: alta concentración y sistema abierto), <b>fosfato</b> (intracelular y tubular, pK 6,8), <b>proteínas</b> (intracelulares; hemoglobina). No eliminan ácido, lo neutralizan. (2) <b>Respiratorio</b> (minutos): ↑ H⁺/↑ PCO₂ estimulan el centro respiratorio → ↑ ventilación → ↓ PCO₂ → ↑ pH; eficacia parcial (50-75 %). (3) <b>Renal</b> (horas-días, el más potente): reabsorbe el HCO₃⁻ filtrado (80-85 % en el proximal con anhidrasa carbónica y Na⁺/H⁺), secreta H⁺ (intercaladas A, pH urinario hasta 4,5) y genera HCO₃⁻ nuevo al excretar H⁺ como <b>acidez titulable</b> (fosfato) y como <b>NH₄⁺</b> (desde glutamina; el mecanismo más adaptable). Excreta los ≈ 80 mEq/día de ácidos no volátiles. Henderson-Hasselbalch: pH = 6,1 + log HCO₃⁻/(0,03 PCO₂).`);
D('r10',2,'¿Cómo interpretás una gasometría arterial? Explicá los cuatro trastornos primarios con sus compensaciones y causas.',`<b>Pasos</b>: (1) pH: acidemia (&lt; 7,35) o alcalemia (&gt; 7,45); (2) ¿qué explica el pH: HCO₃⁻ (metabólico) o PCO₂ (respiratorio)?; (3) ¿la compensación es la esperada?; (4) si es acidosis metabólica, anión gap; (5) clínica. <b>Acidosis metabólica</b>: ↓ HCO₃⁻; compensación ↓ PCO₂ = 1,5 × HCO₃⁻ + 8 ± 2 (Kussmaul); AG ↑ (cetoacidosis, láctica, IR, tóxicos) o normal (diarrea, ATR). <b>Alcalosis metabólica</b>: ↑ HCO₃⁻; PCO₂ ↑ 0,7 por mEq; vómitos, diuréticos, hiperaldosteronismo, hipopotasemia. <b>Acidosis respiratoria</b>: ↑ PCO₂; HCO₃⁻ ↑ 1 (aguda) o 3,5 (crónica) por 10 mmHg; hipoventilación (EPOC, depresión del SNC, neuromusculares). <b>Alcalosis respiratoria</b>: ↓ PCO₂; HCO₃⁻ ↓ 2 (aguda) o 5 (crónica) por 10 mmHg; hiperventilación (ansiedad, altura, hipoxemia, sepsis, embarazo). La compensación va en el mismo sentido y no sobrecorrige; si no coincide → trastorno mixto.`);
D('r11',1,'Describí el examen semiológico del aparato urinario (síntomas y examen físico).',`<b>Anamnesis</b>: cambios en el volumen (poliuria &gt; 3 L, oliguria &lt; 400-500 mL, anuria &lt; 100 mL, nicturia), síntomas miccionales (disuria, polaquiuria, tenesmo, urgencia, incontinencia, retención), características de la orina (hematuria —prueba de los tres vasos—, espumosa, turbia, coluria), dolor (lumbar sordo, cólico renal irradiado a ingle y genitales), edemas (palpebrales matutinos), HTA, síntomas urémicos. <b>Examen físico</b>: inspección (edemas, palidez, abombamiento lumbar), <b>palpación bimanual</b> (maniobras de Guyon, Israel, Montenegro; peloteo renal), <b>puñopercusión lumbar</b> (Giordano), puntos ureterales (superior, medio, inferior), palpación y percusión suprapúbica (globo vesical), auscultación de soplo renal, toma de PA, tacto rectal (próstata).`);
D('r11',2,'Describí la orina completa normal y el significado de los principales hallazgos del sedimento.',`<b>Físico</b>: amarilla, límpida, densidad 1,003-1,030. <b>Químico</b>: pH 4,5-8; proteínas, glucosa, cetonas, sangre, nitritos, esterasa leucocitaria y bilirrubina negativos; urobilinógeno en trazas. <b>Sedimento</b>: hematíes 0-2 (≤ 3-5)/campo, leucocitos 0-5/campo, escasas células escamosas, cilindros hialinos ocasionales. Hallazgos: <b>hematíes dismórficos</b> y <b>cilindros hemáticos</b> → glomerulonefritis; <b>leucocitos + nitritos/bacterias</b> → infección; <b>cilindros leucocitarios</b> → pielonefritis/nefritis intersticial; <b>granulosos/epiteliales</b> → NTA; <b>grasos y cuerpos ovales grasos</b> → nefrótico; <b>céreos/anchos</b> → ERC; cristales (oxalato: sobre; úrico: rombos; estruvita: tapa de ataúd con Proteus; cistina: hexágonos). Muestra: primera de la mañana, chorro medio, procesar en 1-2 h.`);
D('r12',2,'Compará el síndrome nefrítico y el nefrótico (definición, fisiopatología, clínica, sedimento y ejemplos).',`<b>Nefrítico</b>: inflamación glomerular (proliferación, inmunocomplejos) → paso de hematíes y <b>↓ FG</b>. Clínica: <b>hematuria</b> (dismórfica, cilindros hemáticos, orina color coca-cola), <b>HTA</b>, <b>edema</b> por retención primaria de Na⁺ y agua, <b>oliguria</b>, azoemia, proteinuria &lt; 3,5 g/día. Sedimento activo. Ejemplo: <b>GN postestreptocócica</b> (niños, 1-3 semanas post faringitis, C3 bajo, ASTO ↑), nefropatía IgA, lupus. <b>Nefrótico</b>: lesión de la barrera (podocitos/MBG, pérdida de carga) → <b>proteinuria &gt; 3,5 g/24 h</b>, <b>hipoalbuminemia</b>, <b>edema</b> (↓ presión oncótica + retención de Na⁺), <b>hiperlipidemia</b> (↑ síntesis hepática de lipoproteínas), <b>lipiduria</b>. Sedimento con cilindros grasos y cuerpos ovales grasos. Complicaciones: trombosis (↓ antitrombina III), infecciones (↓ Ig). Ejemplos: cambios mínimos (niños), membranosa y GEFS (adultos), nefropatía diabética.`);
D('r13',2,'Clasificá la insuficiencia renal aguda y explicá cómo diferenciar la prerrenal de la necrosis tubular aguda.',`IRA: caída abrupta del FG (KDIGO: ↑ Cr ≥ 0,3 mg/dL en 48 h, ≥ 1,5× en 7 días o diuresis &lt; 0,5 mL/kg/h por 6 h). <b>Prerrenal</b> (hipoperfusión con riñón sano: hipovolemia, IC, shock, AINE, IECA), <b>renal</b> (NTA isquémica o tóxica, GN, nefritis intersticial, vascular), <b>posrenal</b> (obstrucción: HPB, litiasis, tumores; ecografía con hidronefrosis). <b>Diferenciación</b>: en la prerrenal los túbulos están sanos y, estimulados por AII, aldosterona y ADH, retienen Na⁺ y agua → <b>Na⁺ urinario &lt; 20</b>, <b>FENa &lt; 1 %</b>, <b>osmolaridad urinaria &gt; 500</b>, BUN/Cr &gt; 20, sedimento normal (hialinos); mejora con volumen. En la <b>NTA</b> los túbulos dañados no reabsorben ni concentran → <b>Na⁺ u &gt; 40</b>, <b>FENa &gt; 2 %</b>, <b>Osm u &lt; 350</b> (isostenuria), BUN/Cr &lt; 15, <b>cilindros granulosos marrones</b> y epiteliales; no mejora con volumen. Una prerrenal prolongada puede evolucionar a NTA isquémica.`);
D('r13',3,'Describí la fisiopatología de las manifestaciones de la enfermedad renal crónica.',`Pérdida progresiva de nefronas con <b>hiperfiltración</b> de las remanentes que acelera su esclerosis. <b>Anemia</b> normocítica por ↓ <b>eritropoyetina</b>. <b>Enfermedad mineral ósea</b>: ↓ excreción de fosfato (hiperfosfatemia) y ↓ <b>calcitriol</b> (1α-hidroxilasa) → hipocalcemia → <b>hiperparatiroidismo secundario</b> → osteodistrofia, calcificaciones vasculares. <b>Acidosis metabólica</b> por ↓ excreción de NH₄⁺ y retención de ácidos. <b>Hiperpotasemia</b> (avanzada o por fármacos). <b>HTA y sobrecarga de volumen</b> por retención de Na⁺ y ↑ renina → HVI, IC. <b>Isostenuria</b> y nicturia por pérdida de la capacidad de concentrar y diluir. <b>Uremia</b> (toxinas): anorexia, náuseas, prurito, aliento urémico, encefalopatía, neuropatía, pericarditis, disfunción plaquetaria. Riñones pequeños en la ecografía (salvo diabetes, poliquistosis, amiloidosis). Estadios G1-G5 por FG; G5 &lt; 15 requiere diálisis o trasplante.`);
D('r14',2,'Explicá el manejo renal de la glucosa y la fisiopatología de la poliuria, la cetoacidosis y la nefropatía en la diabetes.',`La glucosa se filtra y se reabsorbe ≈ 100 % en el proximal (<b>SGLT2</b> en S1, SGLT1 en S3; salida por GLUT2). Transporte saturable: <b>Tm ≈ 375 mg/min</b>, <b>umbral ≈ 180-200 mg/dL</b>. Con hiperglucemia mayor aparece <b>glucosuria</b> → <b>diuresis osmótica</b> → poliuria, deshidratación, polidipsia, pérdida de peso. <b>Cetoacidosis</b>: déficit de insulina → lipólisis y cetogénesis → acidosis metabólica con <b>AG elevado</b>, compensada con <b>respiración de Kussmaul</b>; K⁺ corporal total ↓ aunque el plasmático sea normal/alto (reponer al dar insulina). <b>Nefropatía diabética</b> (1.ª causa de ERC): hiperfiltración (↑ reabsorción proximal de Na⁺-glucosa → menos NaCl en la mácula densa → dilatación aferente; AII contrae la eferente) → engrosamiento de la MBG, expansión mesangial, nódulos de Kimmelstiel-Wilson → <b>albuminuria moderada</b> (marcador precoz) → proteinuria, HTA → caída del FG. Prevención: control glucémico y de PA, IECA/ARA II, iSGLT2; rastreo anual con índice albúmina/creatinina y FG.`);

 {q:'La densidad fija en 1,010 indica:',o:['Isostenuria: pérdida de la capacidad de concentrar y diluir','Deshidratación','Glucosuria','Proteinuria'],e:''}
]);
C('r8','Poliuria después de un traumatismo de cráneo','Hombre de 30 años, 2 días después de un traumatismo encefalocraneano grave, orina 7 L/día. Osmolaridad urinaria 90 mOsm/L, Na⁺ plasmático 152 mEq/L. Tras administrar desmopresina, la orina se concentra a 600 mOsm/L.',[
 {q:'¿Diagnóstico?',o:['Diabetes insípida central','Diabetes insípida nefrogénica','SIADH','Diabetes mellitus'],e:'Responde a la desmopresina.'},
 {q:'¿Por qué está hipernatrémico?',o:['Pierde agua libre por orina diluida','Retiene sodio por aldosterona','Recibe solución hipertónica','Por SIADH'],e:''},
 {q:'La desmopresina actúa sobre:',o:['Receptores V2 del colector, insertando acuaporina 2','Receptores V1 vasculares','El asa de Henle (NKCC2)','La mácula densa'],e:''},
 {q:'Si la orina no se hubiera concentrado con desmopresina, pensarías en:',o:['Diabetes insípida nefrogénica (litio, hipercalcemia, hipopotasemia)','Polidipsia primaria','SIADH','Hiperaldosteronismo'],e:''}
]);
C('r11','Mujer con fiebre y dolor lumbar','Mujer de 26 años con 2 días de disuria y polaquiuria, y desde ayer fiebre de 39 °C, escalofríos y dolor lumbar derecho. Puñopercusión derecha positiva. Orina: nitritos +, esterasa leucocitaria +, leucocitos incontables, cilindros leucocitarios.',[
 {q:'¿Diagnóstico más probable?',o:['Pielonefritis aguda','Cistitis simple','Cólico renal sin infección','Glomerulonefritis'],e:'Fiebre, dolor lumbar, puñopercusión + y cilindros leucocitarios (inflamación en el parénquima).'},
 {q:'Los cilindros leucocitarios indican:',o:['Que los leucocitos provienen del riñón (se moldean en el túbulo)','Infección de la uretra','Contaminación vaginal','Glomerulonefritis'],e:''},
 {q:'¿Por qué las mujeres tienen más infecciones urinarias ascendentes?',o:['Uretra corta (≈ 4 cm) y cercana al periné','Mayor diuresis','Ausencia de esfínter externo','Orina más ácida'],e:''},
 {q:'Nitritos positivos sugieren:',o:['Gramnegativos como E. coli','Enterococo exclusivamente','Hongos','Tuberculosis renal'],e:'Reducen nitratos a nitritos.'}

</script>
<script>
/* ================== APP ================== */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, html='') => { const e=document.createElement(tag); for(const k in attrs){ if(k==='on') for(const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else e.setAttribute(k, attrs[k]); } if(html!==undefined) e.innerHTML=html; return e; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const TOPIC = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const NUC = {cardio:'Cardiovascular', renal:'Renal'};
const LVL = {1:'Básico',2:'Intermedio',3:'Avanzado'};

/* ---------- storage (per browser, best effort) ---------- */
const KEY='repaso-arti3-cardiorenal-v1';
let store = {mcq:{}, wrong:[], fc:{}, dev:{}};
try{ const s=localStorage.getItem(KEY); if(s) store=Object.assign(store, JSON.parse(s)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} };

/* ---------- theme ---------- */
(function(){ let t=null; try{t=localStorage.getItem(KEY+'-theme');}catch(e){} if(t) document.documentElement.dataset.theme=t; })();
$('#themeBtn').onclick=()=>{ const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const n=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; try{localStorage.setItem(KEY+'-theme',n);}catch(e){} };

/* ---------- ids ---------- */
MCQ.forEach((q,i)=>q.id='m'+i); DEV.forEach((q,i)=>q.id='d'+i); FC.forEach((q,i)=>q.id='f'+i);

/* ---------- filters ---------- */
const FLT = {nuc:'all', topic:'all', lvl:'all'};
function inFilter(item){
  const t=TOPIC[item.t]; if(!t) return false;
  if(FLT.nuc!=='all' && t.n!==FLT.nuc) return false;
  if(FLT.topic!=='all' && item.t!==FLT.topic) return false;
  if(FLT.lvl!=='all' && item.l!==undefined && String(item.l)!==FLT.lvl) return false;
  return true;
}
function filterBar(onChange, opts={lvl:true}){
  const w=el('div',{class:'filters'});
  const sN=el('select',{'aria-label':'Núcleo'}); sN.innerHTML='<option value="all">Ambos núcleos</option><option value="cardio">Cardiovascular</option><option value="renal">Renal</option>'; sN.value=FLT.nuc;
  const sT=el('select',{'aria-label':'Tema'});
  const fillT=()=>{ sT.innerHTML='<option value="all">Todos los temas</option>'+TOPICS.filter(t=>FLT.nuc==='all'||t.n===FLT.nuc).map(t=>`<option value="${t.id}">${t.title}</option>`).join(''); if(![...sT.options].some(o=>o.value===FLT.topic)) FLT.topic='all'; sT.value=FLT.topic; };
  fillT();
  sN.onchange=()=>{FLT.nuc=sN.value; fillT(); onChange();};
  sT.onchange=()=>{FLT.topic=sT.value; onChange();};
  w.append(sN,sT);
  if(opts.lvl){ const sL=el('select',{'aria-label':'Nivel'}); sL.innerHTML='<option value="all">Todos los niveles</option><option value="1">Básico</option><option value="2">Intermedio</option><option value="3">Avanzado</option>'; sL.value=FLT.lvl; sL.onchange=()=>{FLT.lvl=sL.value; onChange();}; w.append(sL); }
  return w;
}
const tagHTML = item => { const t=TOPIC[item.t]; return `<span class="pill ${t.n}">${NUC[t.n]}</span><span class="muted" style="font-size:.85rem">${t.title}</span>${item.l?`<span class="pill l${item.l}">${LVL[item.l]}</span>`:''}`; };

/* ---------- tabs ---------- */
const TABS = [
  ['inicio','Inicio'],['resumen','Resúmenes'],['mcq','Múltiple opción'],['dev','Desarrollo'],['fc','Flashcards'],
  ['vf','V / F'],['seq','Secuencias'],['casos','Casos clínicos'],['ej','Ejercicios'],['valores','Valores normales'],['sim','Simulacro']
];
let cur='inicio';
function renderTabs(){ const n=$('#tabs'); n.innerHTML=''; TABS.forEach(([id,l])=>{ const b=el('button',{class:id===cur?'on':''},l); b.onclick=()=>go(id); n.append(b); }); }
function go(id){ cur=id; renderTabs(); stopTimer(); window.scrollTo(0,0); VIEWS[id](); const b=$('#tabs .on'); if(b) b.scrollIntoView({inline:'center',block:'nearest'}); }

/* ---------- INICIO ---------- */
function vInicio(){
  const app=$('#app');
  const answered=Object.values(store.mcq); const tot=answered.reduce((s,x)=>s+x.n,0); const ok=answered.reduce((s,x)=>s+x.ok,0);
  const known=Object.values(store.fc).filter(v=>v===1).length;
  app.innerHTML=`
  <h1>Repaso final para el recuperatorio</h1>
  <p class="muted">Todo el contenido de los núcleos <b>Cardiovascular</b> y <b>Renal</b> del PTD de ARTI III, ordenado de lo básico a lo complejo. Basado en Guyton y Hall, Moore, Ross y Argente.</p>
  <div class="grid g3" style="margin:16px 0">
    <div class="card"><div class="muted">Preguntas de opción múltiple</div><div class="bignum">${MCQ.length}</div></div>
    <div class="card"><div class="muted">Flashcards</div><div class="bignum">${FC.length}</div></div>
    <div class="card"><div class="muted">Preguntas a desarrollar</div><div class="bignum">${DEV.length}</div></div>
    <div class="card"><div class="muted">Tu rendimiento en múltiple opción</div><div class="bignum">${tot?Math.round(ok/tot*100)+'%':'—'}</div><div class="muted" style="font-size:.85rem">${ok}/${tot} respondidas bien · ${store.wrong.length} para repasar</div></div>
  </div>
  <h2>Cómo usarla</h2>
  <div class="hero">
    <div class="card" data-go="resumen"><span class="pill l1">Paso 1</span><h3>Leé los resúmenes</h3><p class="muted">Un tema por vez, con tablas y valores clave.</p></div>
    <div class="card" data-go="fc"><span class="pill l1">Paso 2</span><h3>Flashcards</h3><p class="muted">Conceptos y números para fijar. Marcá las que no sabés y repetí.</p></div>
    <div class="card" data-go="mcq"><span class="pill l2">Paso 3</span><h3>Múltiple opción</h3><p class="muted">Ordenadas de básico a avanzado, con explicación en cada una.</p></div>
    <div class="card" data-go="dev"><span class="pill l2">Paso 4</span><h3>Desarrollo</h3><p class="muted">Escribí tu respuesta y comparala con la respuesta modelo.</p></div>
    <div class="card" data-go="casos"><span class="pill l3">Paso 5</span><h3>Casos y ejercicios</h3><p class="muted">Integración clínica, ácido-base, eje del ECG, clearance.</p></div>
    <div class="card" data-go="sim"><span class="pill l3">Paso 6</span><h3>Simulacro</h3><p class="muted">50 preguntas, 2 h 30 min, se aprueba con 60 %, como el examen real.</p></div>
  </div>
  <h2>Temas incluidos</h2>
  <div class="grid g2">
    <div class="card"><span class="pill cardio">Núcleo Cardiovascular</span><ul>${TOPICS.filter(t=>t.n==='cardio').map(t=>`<li>${t.title}</li>`).join('')}</ul></div>
    <div class="card"><span class="pill renal">Núcleo Renal</span><ul>${TOPICS.filter(t=>t.n==='renal').map(t=>`<li>${t.title}</li>`).join('')}</ul></div>
  </div>
  <p style="margin-top:20px"><button class="btn" id="resetBtn">Borrar mi progreso</button></p>`;
  app.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>go(c.dataset.go));
  $('#resetBtn').onclick=()=>{ if(confirm('¿Borrar todo el progreso guardado?')){ store={mcq:{},wrong:[],fc:{},dev:{}}; save(); vInicio(); } };
}

/* ---------- RESUMENES ---------- */
function vResumen(){
  const app=$('#app'); app.innerHTML='<h1>Resúmenes por tema</h1><p class="muted">Abrí cada tema. Están en el orden del programa.</p>';
  app.append(filterBar(vResumen,{lvl:false}));
  ['cardio','renal'].forEach(n=>{
    const ts=TOPICS.filter(t=>t.n===n && (FLT.nuc==='all'||FLT.nuc===n) && (FLT.topic==='all'||FLT.topic===t.id));
    if(!ts.length) return;
    app.append(el('h2',{},'Núcleo '+NUC[n]));
    ts.forEach((t,i)=>{ const d=el('details',{class:'sum'}); if(FLT.topic===t.id) d.open=true; d.innerHTML=`<summary><span class="pill ${n}">${i+1}</span>${t.title}</summary><div class="sumbody">${t.sum}</div>`; app.append(d); });
  });
}

/* ---------- MCQ ---------- */
let mq={queue:[],i:0,ok:0,done:0,order:'lvl',review:false};
function buildMcqQueue(){
  let pool = mq.review ? MCQ.filter(q=>store.wrong.includes(q.id)) : MCQ.filter(inFilter);
  if(mq.order==='lvl'){ pool = [1,2,3].flatMap(l=>shuffle(pool.filter(q=>q.l===l))); } else pool=shuffle(pool);
  mq.queue=pool; mq.i=0; mq.ok=0; mq.done=0;
}
function vMcq(){
  buildMcqQueue();
  const app=$('#app'); app.innerHTML='<h1>Múltiple opción</h1>';
  const fb=filterBar(()=>{mq.review=false; vMcq();});
  const sO=el('select'); sO.innerHTML='<option value="lvl">De básico a avanzado</option><option value="rnd">Orden aleatorio</option>'; sO.value=mq.order; sO.onchange=()=>{mq.order=sO.value; vMcq();};
  const rv=el('button',{class:'chip'+(mq.review?' on':'')},`Repasar mis errores (${store.wrong.length})`); rv.onclick=()=>{ mq.review=!mq.review; vMcq(); };
  fb.append(sO,rv); app.append(fb);
  app.append(el('div',{id:'mcqbox'})); mcqShow();
}
function mcqShow(){
  const box=$('#mcqbox'); const q=mq.queue[mq.i];
  if(!mq.queue.length){ box.innerHTML='<div class="card">No hay preguntas con este filtro.</div>'; return; }
  if(!q){ box.innerHTML=`<div class="card"><h2 style="margin-top:0">Terminaste la tanda</h2><p class="bignum">${mq.ok}/${mq.done}</p><p class="muted">${mq.done?Math.round(mq.ok/mq.done*100):0}% correctas ${mq.done&&mq.ok/mq.done>=.6?'· ¡Aprobado!':'· Por debajo del 60 %'}</p><button class="btn primary" id="again">Otra vez</button></div>`; $('#again').onclick=vMcq; return; }
  const opts = shuffle(q.o.map((t,k)=>({t,ok:k===0})));
  box.innerHTML=`<div class="row muted stat"><span>Pregunta ${mq.i+1} de ${mq.queue.length}</span><span class="spacer"></span><span>✓ ${mq.ok} / ${mq.done}</span></div>
  <div class="progress"><i style="width:${mq.i/mq.queue.length*100}%"></i></div>
  <div class="card"><div class="meta">${tagHTML(q)}</div><div class="q">${q.q}</div><div id="opts"></div><div id="after"></div></div>`;
  const oc=$('#opts');
  opts.forEach((o,k)=>{ const b=el('button',{class:'opt'},`<b>${'abcde'[k]})</b> ${o.t}`); b.onclick=()=>{
      oc.querySelectorAll('.opt').forEach((x,j)=>{ x.disabled=true; if(opts[j].ok) x.classList.add('ok'); });
      if(!o.ok) b.classList.add('bad');
      mq.done++; if(o.ok) mq.ok++;
      const st=store.mcq[q.t]||(store.mcq[q.t]={n:0,ok:0}); st.n++; if(o.ok) st.ok++;
      if(o.ok) store.wrong=store.wrong.filter(x=>x!==q.id); else if(!store.wrong.includes(q.id)) store.wrong.push(q.id);
      save();
      $('#after').innerHTML=`<div class="expl"><b>${o.ok?'✔ Correcto.':'✘ Incorrecto.'}</b> ${q.e}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="nx">Siguiente →</button></div>`;
      $('#nx').onclick=()=>{mq.i++; mcqShow(); window.scrollTo({top:0});}; $('#nx').focus();
    }; oc.append(b); });
}

/* ---------- DESARROLLO ---------- */
let dv={list:[],i:0};
function vDev(){
  const app=$('#app'); app.innerHTML='<h1>Preguntas a desarrollar</h1><p class="muted">Escribí (o pensá en voz alta) tu respuesta, después mirá la respuesta modelo y autoevaluate.</p>';
  app.append(filterBar(vDev));
  dv.list=[1,2,3].flatMap(l=>DEV.filter(inFilter).filter(q=>q.l===l)); dv.i=0;
  app.append(el('div',{id:'devbox'})); devShow();
}
function devShow(){
  const box=$('#devbox'); const q=dv.list[dv.i];
  if(!dv.list.length){ box.innerHTML='<div class="card">No hay preguntas con este filtro.</div>'; return; }
  const st=store.dev[q.id];
  box.innerHTML=`<div class="row muted stat"><span>${dv.i+1} de ${dv.list.length}</span><span class="spacer"></span>${st?`<span>Última vez: ${['','No la sabía','Más o menos','La sabía'][st]}</span>`:''}</div>
  <div class="progress"><i style="width:${(dv.i+1)/dv.list.length*100}%"></i></div>
  <div class="card"><div class="meta">${tagHTML(q)}</div><div class="q">${q.q}</div>
  <textarea placeholder="Escribí tu respuesta acá…" style="margin-top:12px"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="see">Ver respuesta modelo</button></div>
  <div id="ans"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="pv" ${dv.i===0?'disabled':''}>← Anterior</button><span class="spacer"></span><button class="btn" id="nv" ${dv.i>=dv.list.length-1?'disabled':''}>Siguiente →</button></div>`;
  $('#see').onclick=()=>{ $('#ans').innerHTML=`<div class="expl">${q.a}</div><div class="row" style="margin-top:12px"><span class="muted">¿Cómo te fue?</span><button class="btn" data-s="1">No la sabía</button><button class="btn" data-s="2">Más o menos</button><button class="btn" data-s="3">La sabía</button></div>`;
    $('#ans').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ store.dev[q.id]=+b.dataset.s; save(); if(dv.i<dv.list.length-1){dv.i++; devShow(); window.scrollTo({top:0});} else b.parentElement.innerHTML='<b>¡Terminaste todas!</b>'; }); };
  $('#pv').onclick=()=>{dv.i--; devShow();}; $('#nv').onclick=()=>{dv.i++; devShow();};
}

/* ---------- FLASHCARDS ---------- */
let fc={deck:[],i:0,onlyUnknown:false};
function vFc(){
  const app=$('#app'); app.innerHTML='<h1>Flashcards</h1><p class="muted">Tocá la tarjeta para darla vuelta. Atajos: <kbd>espacio</kbd> girar · <kbd>←</kbd> no la sé · <kbd>→</kbd> la sé.</p>';
  const fb=filterBar(vFc,{lvl:false});
  const ch=el('button',{class:'chip'+(fc.onlyUnknown?' on':'')},'Solo las que no sé'); ch.onclick=()=>{fc.onlyUnknown=!fc.onlyUnknown; vFc();};
  const sh=el('button',{class:'chip'},'Mezclar'); sh.onclick=()=>{fc.deck=shuffle(fc.deck); fc.i=0; fcShow();};
  fb.append(ch,sh); app.append(fb);
  fc.deck=FC.filter(inFilter).filter(c=>!fc.onlyUnknown||store.fc[c.id]!==1); fc.i=0;
  app.append(el('div',{id:'fcbox'})); fcShow();
}
function fcShow(){
  const box=$('#fcbox'); const c=fc.deck[fc.i];
  const known=fc.deck.filter(x=>store.fc[x.id]===1).length;
  if(!fc.deck.length){ box.innerHTML='<div class="card">No hay tarjetas acá. ¡Puede que ya las sepas todas!</div>'; return; }
  if(!c){ box.innerHTML=`<div class="card"><h2 style="margin-top:0">Mazo terminado</h2><p>Sabés ${known} de ${fc.deck.length}.</p><button class="btn primary" id="rs">Repetir</button></div>`; $('#rs').onclick=()=>{fc.i=0; fcShow();}; return; }
  const t=TOPIC[c.t];
  box.innerHTML=`<div class="row muted stat"><span>${fc.i+1} / ${fc.deck.length}</span><span class="spacer"></span><span>Sabidas: ${known}</span></div>
  <div class="progress"><i style="width:${(fc.i)/fc.deck.length*100}%"></i></div>
  <div class="flip" id="flip"><div class="flipin"><div class="face"><span class="lbl">${t.title}</span>${c.f}</div><div class="face back"><span class="lbl">Respuesta</span>${c.b}</div></div></div>
  <div class="row" style="margin-top:14px;justify-content:center"><button class="btn" id="no">✘ No la sé</button><button class="btn" id="fl">Girar</button><button class="btn primary" id="si">✔ La sé</button></div>`;
  const f=$('#flip'); f.onclick=()=>f.classList.toggle('on'); $('#fl').onclick=()=>f.classList.toggle('on');
  const mark=v=>{ store.fc[c.id]=v; save(); fc.i++; fcShow(); };
  $('#no').onclick=()=>mark(0); $('#si').onclick=()=>mark(1);
}
document.addEventListener('keydown',e=>{
  if(cur!=='fc' || /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); const f=$('#flip'); if(f) f.classList.toggle('on'); }
  if(e.code==='ArrowRight'){ const b=$('#si'); if(b) b.click(); }
  if(e.code==='ArrowLeft'){ const b=$('#no'); if(b) b.click(); }
});

/* ---------- V/F ---------- */
function vVf(){
  const app=$('#app'); app.innerHTML='<h1>Verdadero o Falso</h1><p class="muted">Ojo con las trampas típicas de examen. Cada respuesta trae su justificación.</p>';
  app.append(filterBar(vVf,{lvl:false}));
  const list=shuffle(VF.filter(inFilter)); let ok=0,done=0;
  const score=el('div',{class:'row muted stat'},`✓ 0 / 0 de ${list.length}`); app.append(score);
  const c=el('div',{class:'card'}); app.append(c);
  list.forEach(it=>{
    const r=el('div',{class:'vf'}); r.innerHTML=`<div class="s"><div class="meta">${tagHTML(it)}</div>${it.s}<div class="ex"></div></div><div class="b"><button class="btn">V</button><button class="btn">F</button></div>`;
    const [bv,bf]=r.querySelectorAll('.b button');
    const ans=val=>{ bv.disabled=bf.disabled=true; const good=val===it.v; done++; if(good) ok++; if(good) (val?bv:bf).classList.add('primary'); (val?bv:bf).style.borderColor=good?'var(--ok)':'var(--bad)'; r.querySelector('.ex').innerHTML=`<div class="expl"><b>${good?'✔':'✘'} Es ${it.v?'VERDADERO':'FALSO'}.</b> ${it.e}</div>`; score.textContent=`✓ ${ok} / ${done} de ${list.length}`; };
    bv.onclick=()=>ans(true); bf.onclick=()=>ans(false); c.append(r);
  });
  if(!list.length) c.innerHTML='No hay afirmaciones con este filtro.';
}

/* ---------- SECUENCIAS ---------- */
function vSeq(){
  const app=$('#app'); app.innerHTML='<h1>Ordená la secuencia</h1><p class="muted">Tocá los pasos en el orden correcto. Ideal para recorridos, fases y mecanismos.</p>';
  app.append(filterBar(vSeq,{lvl:false}));
  SEQ.filter(inFilter).forEach(s=>{
    const c=el('div',{class:'card',style:'margin:12px 0'});
    c.innerHTML=`<div class="meta">${tagHTML(s)}</div><div class="q">${s.title}</div><div class="items" style="margin-top:8px"></div><div class="res"></div><div class="row" style="margin-top:8px"><button class="btn rs">Reiniciar</button></div>`;
    const wrap=c.querySelector('.items'); let picked=[];
    const draw=()=>{ wrap.innerHTML=''; picked=[]; c.querySelector('.res').innerHTML='';
      shuffle(s.items.map((t,k)=>({t,k}))).forEach(it=>{ const b=el('button',{class:'seqitem'},`<span class="n"></span><span>${it.t}</span>`);
        b.onclick=()=>{ if(b.classList.contains('picked')) return; picked.push(it.k); b.classList.add('picked'); b.querySelector('.n').textContent=picked.length;
          if(picked.length===s.items.length){ const good=picked.every((k,j)=>k===j); c.querySelector('.res').innerHTML=`<div class="expl"><b>${good?'✔ ¡Perfecto!':'✘ No es el orden correcto.'}</b> Orden correcto:<ol>${s.items.map(x=>`<li>${x}</li>`).join('')}</ol>${s.e||''}</div>`; wrap.querySelectorAll('.seqitem').forEach(x=>x.classList.remove('picked')); }
        }; wrap.append(b); }); };
    c.querySelector('.rs').onclick=draw; draw(); app.append(c);
  });
}

/* ---------- EJERCICIOS (generadores) ---------- */
const r1 = x => Math.round(x*10)/10;
const r2 = x => Math.round(x*100)/100;
const GEN = {
  acidobase(){
    const kind=pick(['acmet','alcmet','acresp_a','acresp_c','alcresp_a','alcresp_c']);
    let hco3,pco2,lbl,why;
    if(kind==='acmet'){ hco3=rnd(8,18); pco2=r1(1.5*hco3+8+(Math.random()*2-1)); lbl='Acidosis metabólica compensada'; why=`HCO₃⁻ bajo (${hco3}) es el trastorno primario. Compensación respiratoria esperada (fórmula de Winter): PCO₂ = 1,5 × ${hco3} + 8 ± 2 = ${r1(1.5*hco3+8)} ± 2 mmHg. La PCO₂ medida (${pco2}) está en rango → compensación adecuada.`; }
    if(kind==='alcmet'){ hco3=rnd(30,42); pco2=r1(40+0.7*(hco3-24)+(Math.random()*2-1)); lbl='Alcalosis metabólica compensada'; why=`HCO₃⁻ alto (${hco3}) es el trastorno primario. Compensación: la PCO₂ sube ≈0,7 mmHg por cada mEq/L que sube el HCO₃⁻ → esperada ≈ ${r1(40+0.7*(hco3-24))} mmHg (hipoventilación compensadora).`; }
    if(kind==='acresp_a'){ pco2=rnd(55,75); hco3=r1(24+(pco2-40)/10*1); lbl='Acidosis respiratoria aguda'; why=`PCO₂ alta (${pco2}) es el trastorno primario. En la forma aguda el HCO₃⁻ sube solo ≈1 mEq/L por cada 10 mmHg de PCO₂ (amortiguadores no bicarbonato) → ${hco3}. Si fuera crónica el riñón lo subiría ≈3,5 por cada 10.`; }
    if(kind==='acresp_c'){ pco2=rnd(55,75); hco3=r1(24+(pco2-40)/10*3.5); lbl='Acidosis respiratoria crónica (compensada por el riñón)'; why=`PCO₂ alta (${pco2}) es el trastorno primario. El HCO₃⁻ subió ≈3,5 mEq/L por cada 10 mmHg → ${hco3}: compensación renal (días), típica del EPOC.`; }
    if(kind==='alcresp_a'){ pco2=rnd(22,32); hco3=r1(24-(40-pco2)/10*2); lbl='Alcalosis respiratoria aguda'; why=`PCO₂ baja (${pco2}) es el trastorno primario (hiperventilación). En la forma aguda el HCO₃⁻ baja ≈2 mEq/L por cada 10 mmHg → ${hco3}.`; }
    if(kind==='alcresp_c'){ pco2=rnd(22,32); hco3=r1(24-(40-pco2)/10*5); lbl='Alcalosis respiratoria crónica (compensada por el riñón)'; why=`PCO₂ baja (${pco2}) es el trastorno primario. El HCO₃⁻ bajó ≈5 mEq/L por cada 10 mmHg → ${hco3}: compensación renal (p. ej., altura).`; }
    const ph=r2(6.1+Math.log10(hco3/(0.03*pco2)));
    const all=['Acidosis metabólica compensada','Alcalosis metabólica compensada','Acidosis respiratoria aguda','Acidosis respiratoria crónica (compensada por el riñón)','Alcalosis respiratoria aguda','Alcalosis respiratoria crónica (compensada por el riñón)'];
    return {q:`Gasometría arterial: <b>pH ${ph.toFixed(2)}</b> · <b>PaCO₂ ${pco2} mmHg</b> · <b>HCO₃⁻ ${hco3} mEq/L</b>. ¿Cuál es el trastorno?`, o:[lbl,...shuffle(all.filter(x=>x!==lbl)).slice(0,3)],
      e:`<b>Paso 1:</b> pH ${ph.toFixed(2)} → ${ph<7.35?'acidemia':ph>7.45?'alcalemia':'en rango (mirá igual PCO₂ y HCO₃⁻)'}.<br><b>Paso 2:</b> ¿Qué variable explica el pH? ${why}<br><b>Recordá:</b> pH = 6,1 + log (HCO₃⁻ / 0,03 × PCO₂). Normales: pH 7,35-7,45; PaCO₂ 35-45; HCO₃⁻ 22-26.`};
  },
  anion(){
    const ag=rnd(6,28), h=rnd(8,26), na=rnd(134,144), cl=na-h-ag; const hi=ag>12;
    return {q:`Na⁺ ${na}, Cl⁻ ${cl}, HCO₃⁻ ${h} mEq/L. ¿Cuál es el anión gap y cómo se interpreta?`,
      o:[`${ag} mEq/L → ${hi?'elevado':'normal'}`,`${ag+6} mEq/L → ${!hi?'elevado':'normal'}`,`${na-cl} mEq/L → ${hi?'normal':'elevado'}`,`${Math.max(2,ag-5)} mEq/L → normal`],
      e:`AG = Na⁺ − (Cl⁻ + HCO₃⁻) = ${na} − (${cl} + ${h}) = <b>${ag}</b>. Normal ≈ 8-12 mEq/L. ${hi?'Elevado: hay un anión no medido (lactato, cetoácidos, tóxicos, retención por insuficiencia renal).':'Normal: si hay acidosis metabólica es hiperclorémica (diarrea, acidosis tubular renal).'}`};
  },
  eje(){
    const ang=rnd(-17,18)*10; const rad=ang*Math.PI/180;
    const sgn=v=>Math.abs(v)<0.08?'isodifásico (≈0)':v>0?'positivo':'negativo';
    const di=Math.cos(rad), avf=Math.sin(rad), dii=Math.cos(rad-Math.PI/3);
    let lbl; if(ang>=-30&&ang<=90) lbl='Eje normal (−30° a +90°)'; else if(ang<-30&&ang>=-90) lbl='Desviación del eje a la izquierda (−30° a −90°)'; else if(ang>90&&ang<=180) lbl='Desviación del eje a la derecha (+90° a +180°)'; else lbl='Eje extremo / "tierra de nadie" (−90° a −180°)';
    const all=['Eje normal (−30° a +90°)','Desviación del eje a la izquierda (−30° a −90°)','Desviación del eje a la derecha (+90° a +180°)','Eje extremo / "tierra de nadie" (−90° a −180°)'];
    return {q:`QRS neto en <b>DI: ${sgn(di)}</b> · <b>aVF: ${sgn(avf)}</b> · <b>DII: ${sgn(dii)}</b>. ¿Cómo está el eje eléctrico?`, o:[lbl,...all.filter(x=>x!==lbl)],
      e:`El eje real de este ejemplo es <b>${ang>0?'+':''}${ang}°</b>. Método de los cuadrantes: DI (0°) positivo → el eje apunta a la izquierda del paciente; aVF (+90°) positivo → apunta hacia abajo. DI+ y aVF+ = normal. DI+ y aVF− → mirá DII (+60°): si DII es positivo el eje está entre 0° y −30° (normal); si es negativo hay desviación izquierda. DI− y aVF+ → desviación derecha. DI− y aVF− → eje extremo. Una derivación isodifásica indica que el eje es perpendicular a ella.`};
  },
  fc(){
    const sq=pick([3,4,5,6,7,8,10,12,15,20,25,30]); const n=sq*5; const f=Math.round(1500/n);
    return {q:`Ritmo regular. Entre dos ondas R hay <b>${n} cuadraditos</b> (${sq} cuadrados grandes) a 25 mm/s. ¿Cuál es la frecuencia cardíaca?`,
      o:[`${f} lpm`,`${Math.round(f*1.5)} lpm`,`${Math.round(f/1.5)} lpm`,`${Math.round(300/n*10)} lpm`],
      e:`FC = 1500 / cuadraditos = 1500 / ${n} = <b>${f} lpm</b> (o 300 / cuadrados grandes = 300 / ${sq}). Cada cuadradito = 0,04 s; cada cuadrado grande = 0,20 s. RR = ${r2(n*0.04)} s → 60/${r2(n*0.04)} = ${f}. ${f<60?'Bradicardia (<60).':f>100?'Taquicardia (>100).':'Frecuencia normal (60-100).'}`};
  },
  clearance(){
    const subst=pick([{n:'Sustancia X',u:rnd(20,400),p:r1(rnd(5,40)/10)}]);
    const v=r1(rnd(8,25)/10); const c=Math.round(subst.u*v/subst.p); const cin=125;
    const cls=c>cin+10?'secreción neta':c<cin-10?'reabsorción neta':'ni reabsorción ni secreción neta (se comporta como la inulina)';
    return {q:`Concentración urinaria de X = <b>${subst.u} mg/mL</b>, plasmática = <b>${subst.p} mg/mL</b>, flujo urinario = <b>${v} mL/min</b>. FG (clearance de inulina) = 125 mL/min. ¿Clearance de X y qué hace el túbulo con ella?`,
      o:[`${c} mL/min → ${cls}`,`${Math.round(subst.p*v/subst.u*100)/100} mL/min → reabsorción neta`,`${Math.round(subst.u/subst.p)} mL/min → ${c>cin?'reabsorción neta':'secreción neta'}`,`${Math.round(c*1.6)} mL/min → secreción neta`],
      e:`C = (U × V) / P = (${subst.u} × ${v}) / ${subst.p} = <b>${c} mL/min</b>. Comparando con el FG (125): si C &gt; FG hay secreción neta; si C &lt; FG hay reabsorción neta; si C = FG la sustancia solo se filtra.`};
  },
  pam(){
    const s=rnd(95,180), d=rnd(55,Math.min(115,s-25)); const m=Math.round(d+(s-d)/3);
    return {q:`PA ${s}/${d} mmHg. ¿Cuál es la presión arterial media y la presión de pulso?`,
      o:[`PAM ${m} · PP ${s-d}`,`PAM ${Math.round((s+d)/2)} · PP ${s-d}`,`PAM ${m} · PP ${Math.round((s+d)/2)}`,`PAM ${Math.round(s-(s-d)/3)} · PP ${d}`],
      e:`PAM ≈ PAD + (PAS − PAD)/3 = ${d} + ${s-d}/3 = <b>${m}</b> mmHg (no es el promedio simple porque el corazón pasa más tiempo en diástole). Presión de pulso = PAS − PAD = <b>${s-d}</b>; depende sobre todo del volumen sistólico y de la compliance arterial.`};
  },
  gc(){
    const fcv=rnd(55,110), vtd=rnd(100,160), vts=rnd(35,90); const vs=vtd-vts; const gc=r1(fcv*vs/1000); const fe=Math.round(vs/vtd*100);
    return {q:`FC ${fcv} lpm · VFD ${vtd} mL · VFS ${vts} mL. ¿Volumen sistólico, gasto cardíaco y fracción de eyección?`,
      o:[`VS ${vs} mL · GC ${gc} L/min · FE ${fe}%`,`VS ${vs} mL · GC ${r1(gc*1.2)} L/min · FE ${Math.round(vts/vtd*100)}%`,`VS ${vtd+vts} mL · GC ${gc} L/min · FE ${fe}%`,`VS ${vs} mL · GC ${r1(fcv*vtd/1000)} L/min · FE ${Math.round(vs/vts*100)}%`],
      e:`VS = VFD − VFS = ${vtd} − ${vts} = <b>${vs} mL</b>. GC = FC × VS = ${fcv} × ${vs} = <b>${gc} L/min</b>. FE = VS / VFD = <b>${fe}%</b> (normal ≈ 55-70 %; &lt;40 % = IC con FE reducida).`};
  },
  ff(){
    const fg=rnd(90,140), fpr=rnd(500,750), hto=rnd(36,48);
    const ff=Math.round(fg/fpr*100), fsr=Math.round(fpr/(1-hto/100));
    return {q:`FG ${fg} mL/min · FPR ${fpr} mL/min · Hto ${hto}%. ¿Fracción de filtración y flujo sanguíneo renal?`,
      o:[`FF ${ff}% · FSR ${fsr} mL/min`,`FF ${Math.round(fpr/fg*10)}% · FSR ${fsr} mL/min`,`FF ${ff}% · FSR ${Math.round(fpr*(1-hto/100))} mL/min`,`FF ${ff+15}% · FSR ${fpr} mL/min`],
      e:`FF = FG / FPR = ${fg}/${fpr} = <b>${ff}%</b> (normal ≈ 20 %). FSR = FPR / (1 − Hto) = ${fpr} / ${1-hto/100} = <b>${fsr} mL/min</b> (normal ≈ 1100-1200, ~22 % del gasto cardíaco).`};
  },
  starling(){
    const pg=rnd(45,70), pb=rnd(10,25), pig=rnd(25,36);
    const net=pg-pb-pig;
    return {q:`Presión hidrostática glomerular ${pg}, presión en la cápsula de Bowman ${pb}, presión oncótica glomerular ${pig} mmHg (oncótica de Bowman ≈ 0). ¿Presión neta de filtración?`,
      o:[`${net} mmHg`,`${pg-pb+pig} mmHg`,`${pg+pb-pig} mmHg`,`${pg-pig} mmHg`],
      e:`PNF = P<sub>G</sub> − P<sub>B</sub> − π<sub>G</sub> + π<sub>B</sub> = ${pg} − ${pb} − ${pig} + 0 = <b>${net} mmHg</b>. Valores de Guyton: 60 − 18 − 32 = 10 mmHg. FG = Kf × PNF. ${net<=0?'Con PNF ≤ 0 no hay filtración.':''}`};
  }
};
const GENS=[['acidobase','Ácido-base: gasometría'],['anion','Anión gap'],['eje','Eje eléctrico del ECG'],['fc','Frecuencia cardíaca en el ECG'],['pam','PAM y presión de pulso'],['gc','Gasto cardíaco y FE'],['clearance','Clearance renal'],['ff','Fracción de filtración y FSR'],['starling','Fuerzas de Starling glomerulares']];
let ejSel='acidobase', ejScore={ok:0,n:0};
function vEj(){
  const app=$('#app'); app.innerHTML='<h1>Ejercicios infinitos</h1><p class="muted">Se generan al azar: practicá cuantas veces quieras hasta que salga automático.</p>';
  const w=el('div',{class:'filters'}); GENS.forEach(([k,l])=>{ const b=el('button',{class:'chip'+(k===ejSel?' on':'')},l); b.onclick=()=>{ejSel=k; ejScore={ok:0,n:0}; vEj();}; w.append(b); }); app.append(w);
  app.append(el('div',{id:'ejbox'})); ejShow();
}
function ejShow(){
  const g=GEN[ejSel](); g.o=[...new Set(g.o)]; const box=$('#ejbox'); const opts=shuffle(g.o.map((t,k)=>({t,ok:k===0})));
  box.innerHTML=`<div class="row muted stat"><span>✓ ${ejScore.ok} / ${ejScore.n}</span></div><div class="card"><div class="q">${g.q}</div><div id="o"></div><div id="x"></div></div>`;
  opts.forEach(o=>{ const b=el('button',{class:'opt'},o.t); b.onclick=()=>{ $('#o').querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true; if(opts[j].ok) x.classList.add('ok');}); if(!o.ok) b.classList.add('bad'); ejScore.n++; if(o.ok) ejScore.ok++; $('#x').innerHTML=`<div class="expl">${g.e}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="nx">Otro →</button></div>`; $('#nx').onclick=ejShow; }; $('#o').append(b); });
}

/* ---------- SIMULACRO ---------- */
let timerId=null;
function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }
function vSim(){
  const app=$('#app');
  app.innerHTML=`<h1>Simulacro de examen</h1><p class="muted">Formato del recuperatorio: preguntas de opción múltiple, 2 h 30 min, se aprueba con el 60 % de respuestas correctas (nota 6).</p>
  <div class="card"><div class="row"><label>Núcleo <select id="sn"><option value="all">Cardio + Renal</option><option value="cardio">Solo Cardiovascular</option><option value="renal">Solo Renal</option></select></label>
  <label>Preguntas <select id="sq"><option>25</option><option selected>50</option><option>60</option></select></label>
  <label><input type="checkbox" id="st" checked> Con cronómetro</label></div>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="go">Empezar</button></div></div>`;
  $('#go').onclick=()=>{
    const n=$('#sn').value, k=+$('#sq').value, useT=$('#st').checked;
    let pool=MCQ.filter(q=>n==='all'||TOPIC[q.t].n===n);
    let sel=[];
    if(n==='all'){ const c=shuffle(pool.filter(q=>TOPIC[q.t].n==='cardio')), r=shuffle(pool.filter(q=>TOPIC[q.t].n==='renal')); sel=shuffle([...c.slice(0,Math.ceil(k/2)),...r.slice(0,Math.floor(k/2))]); }
    else sel=shuffle(pool).slice(0,k);
    simRun(sel,useT);
  };
}
function simRun(sel,useT){
  const app=$('#app'); const ans={};
  app.innerHTML=`<div class="row" style="position:sticky;top:${$('header.top').offsetHeight}px;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)"><b>Simulacro</b><span class="muted" id="cnt">0/${sel.length} respondidas</span><span class="spacer"></span>${useT?'<span class="timer" id="tm">2:30:00</span>':''}<button class="btn primary" id="fin">Entregar</button></div><div id="qs"></div>`;
  const qs=$('#qs'); const shuffled=sel.map(q=>shuffle(q.o.map((t,k)=>({t,ok:k===0}))));
  sel.forEach((q,i)=>{ const c=el('div',{class:'card',style:'margin:12px 0'}); c.innerHTML=`<div class="q">${i+1}. ${q.q}</div>`;
    shuffled[i].forEach((o,j)=>{ const b=el('button',{class:'opt'},`<b>${'abcde'[j]})</b> ${o.t}`); b.onclick=()=>{ c.querySelectorAll('.opt').forEach(x=>x.style.borderColor=''); b.style.borderColor='var(--accent)'; ans[i]=j; $('#cnt').textContent=`${Object.keys(ans).length}/${sel.length} respondidas`; }; c.append(b); });
    c.append(el('div',{class:'x'})); qs.append(c); });
  if(useT){ let s=150*60; timerId=setInterval(()=>{ s--; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; const t=$('#tm'); if(t) t.textContent=`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; if(s<=0){ stopTimer(); finish(); } },1000); }
  const finish=()=>{
    stopTimer(); let ok=0;
    [...qs.children].forEach((c,i)=>{ const btns=c.querySelectorAll('.opt'); btns.forEach((b,j)=>{ b.disabled=true; b.style.borderColor=''; if(shuffled[i][j].ok) b.classList.add('ok'); }); if(ans[i]!==undefined){ if(shuffled[i][ans[i]].ok) ok++; else btns[ans[i]].classList.add('bad'); } c.querySelector('.x').innerHTML=`<div class="expl">${sel[i].e}</div>`;
      const q=sel[i]; const good=ans[i]!==undefined&&shuffled[i][ans[i]].ok; if(good) store.wrong=store.wrong.filter(x=>x!==q.id); else if(!store.wrong.includes(q.id)) store.wrong.push(q.id); });
    save();
    const pct=ok/sel.length*100;
    const byT={}; sel.forEach((q,i)=>{ const b=byT[q.t]||(byT[q.t]={n:0,ok:0}); b.n++; if(ans[i]!==undefined&&shuffled[i][ans[i]].ok) b.ok++; });
    const weak=Object.entries(byT).filter(([t,v])=>v.ok/v.n<0.6).map(([t])=>TOPIC[t].title);
    const res=el('div',{class:'card',style:'margin:12px 0'}); res.innerHTML=`<h2 style="margin-top:0">${pct>=60?'✔ Aprobado':'✘ Desaprobado'} · ${ok}/${sel.length} (${Math.round(pct)} %)</h2>${weak.length?`<p><b>Temas a reforzar:</b> ${weak.join(' · ')}</p>`:'<p>¡Sin temas flojos en esta tanda!</p>'}<p class="muted">Abajo tenés cada pregunta corregida con su explicación. Las que erraste quedaron en "Repasar mis errores".</p>`;
    qs.prepend(res); $('#fin').disabled=true; window.scrollTo({top:0});
  };
  $('#fin').onclick=()=>{ const left=sel.length-Object.keys(ans).length; if(left && !confirm(`Te quedan ${left} sin responder. ¿Entregar igual?`)) return; finish(); };
}
