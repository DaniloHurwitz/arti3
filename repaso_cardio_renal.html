T('r1','renal','Anatomía del riñón',`
<h3>Ubicación y relaciones</h3>
<ul>
<li>Órganos <b>retroperitoneales</b>, en la pared abdominal posterior, a los lados de la columna, entre <b>T12 y L3</b>. El <b>derecho está más bajo</b> (≈ 1-2 cm) por el hígado.</li>
<li>Miden ≈ <b>10-12 cm</b> de largo, 5-6 cm de ancho, 3 cm de espesor; pesan ≈ 150 g. Se mueven con la respiración (descienden en inspiración).</li>
<li>El <b>hilio renal</b> está a nivel de <b>L1</b> (plano transpilórico); el izquierdo un poco más alto.</li>
<li><b>Relaciones posteriores</b> (ambos): <b>diafragma</b>, músculos <b>psoas mayor</b>, <b>cuadrado lumbar</b> y transverso del abdomen; nervios subcostal, iliohipogástrico e ilioinguinal; <b>costilla 12</b> (el izquierdo también la 11). Por eso el dolor renal es lumbar.</li>
<li><b>Relaciones anteriores del derecho</b>: glándula suprarrenal, <b>hígado</b>, <b>2.ª porción del duodeno</b>, flexura hepática del colon, intestino delgado.</li>
<li><b>Relaciones anteriores del izquierdo</b>: suprarrenal, <b>estómago</b>, <b>bazo</b>, <b>páncreas</b> (cola), flexura esplénica y colon descendente, yeyuno.</li>
</ul>
<h3>Envolturas (de adentro hacia afuera)</h3>
<ol><li><b>Cápsula fibrosa</b> (adherida al parénquima, se despega fácilmente en el riñón sano).</li><li><b>Grasa perirrenal</b> (cápsula adiposa).</li><li><b>Fascia renal (de Gerota)</b>: envuelve riñón, grasa perirrenal y suprarrenal.</li><li><b>Grasa pararrenal</b> (cuerpo adiposo pararrenal), sobre todo posterior.</li></ol>
<h3>Hilio y seno renal</h3>
<ul><li>Estructuras del hilio de <b>anterior a posterior</b>: <b>vena renal → arteria renal → pelvis renal</b> (regla "VAP").</li>
<li>El <b>seno renal</b> contiene: pelvis renal, <b>cálices mayores</b> (2-3) y <b>menores</b> (7-14), vasos, nervios y grasa.</li>
<li>Cada <b>cáliz menor</b> recibe una o dos <b>papilas renales</b> (vértice de las pirámides).</li></ul>
<h3>Parénquima</h3>
<ul><li><b>Corteza</b> (externa): corpúsculos renales, túbulos contorneados; se introduce entre las pirámides formando las <b>columnas renales (de Bertin)</b>. Los <b>rayos medulares</b> son extensiones de la médula hacia la corteza.</li>
<li><b>Médula</b>: <b>8-18 pirámides renales</b> con base hacia la corteza y vértice (papila) hacia el seno; contienen asas de Henle y conductos colectores (aspecto estriado). En la papila desembocan los conductos papilares (de Bellini): área cribosa.</li>
<li><b>Lóbulo renal</b> = una pirámide + la corteza que la cubre. <b>Lobulillo</b> = un rayo medular + la corteza que lo rodea.</li></ul>
<h3>Vasos</h3>
<ul><li><b>Arterias renales</b>: ramas laterales de la aorta a nivel de L1-L2. La <b>derecha es más larga</b> y pasa <b>por detrás de la VCI</b>. Llevan ≈ 20-25 % del GC.</li>
<li>Recorrido intrarrenal: a. renal → <b>arterias segmentarias</b> (5: superior/apical, anterosuperior, anteroinferior, inferior y posterior) → <b>interlobulares</b> (entre las pirámides; algunos autores las llaman interlobares) → <b>arcuatas</b> (en la unión corticomedular) → <b>interlobulillares (radiales corticales)</b> → <b>arteriolas aferentes</b> → <b>capilares glomerulares</b> → <b>arteriolas eferentes</b> → <b>capilares peritubulares</b> (nefronas corticales) o <b>vasos rectos</b> (nefronas yuxtamedulares).</li>
<li>Las arterias segmentarias son <b>terminales</b> (sin anastomosis) → su oclusión produce un <b>infarto segmentario</b>; existe un plano avascular útil en cirugía.</li>
<li><b>Venas renales</b>: drenan a la VCI. La <b>izquierda es más larga</b>, pasa <b>por delante de la aorta</b> justo por debajo de la arteria mesentérica superior (síndrome del cascanueces) y recibe la <b>vena gonadal izquierda</b> y la <b>suprarrenal izquierda</b> (las del lado derecho van directo a la VCI). Por eso el varicocele es más frecuente a la izquierda.</li>
<li>Linfáticos a ganglios lumbares (paraaórticos).</li></ul>
<h3>Inervación</h3>
<ul><li><b>Plexo renal</b>: fibras simpáticas (nervios esplácnicos torácicos y lumbares, ≈ T10-L1; producen vasoconstricción y liberación de renina), parasimpáticas del vago y aferentes viscerales. Dolor renal/ureteral referido a T11-L2: región lumbar, flanco, ingle y genitales.</li></ul>
<h3>Glándula suprarrenal</h3>
<p>Sobre el polo superior, dentro de la fascia renal pero separada por un tabique: la derecha piramidal, la izquierda semilunar. Corteza (glomerular → aldosterona; fascicular → cortisol; reticular → andrógenos) y médula (catecolaminas).</p>
`);

T('r2','renal','Uréteres, vejiga y uretra',`
<h3>Uréteres</h3>
<ul><li>Conductos musculares de ≈ <b>25-30 cm</b>, retroperitoneales, que llevan la orina por <b>peristaltismo</b> de la pelvis renal a la vejiga.</li>
<li>Porción <b>abdominal</b>: descienden sobre el <b>músculo psoas mayor</b>, por delante de las apófisis transversas lumbares; los cruzan por delante los vasos gonadales.</li>
<li>Entran a la pelvis <b>cruzando la bifurcación de la arteria ilíaca común</b> (o el origen de la ilíaca externa).</li>
<li>Porción <b>pélvica</b>: en el varón los cruza por delante el <b>conducto deferente</b>; en la mujer pasan <b>por debajo de la arteria uterina</b> ("el agua pasa por debajo del puente"), a 1-2 cm del cuello uterino → riesgo de lesión en la histerectomía.</li>
<li>Porción <b>intramural</b>: atraviesan oblicuamente la pared vesical → mecanismo valvular que evita el <b>reflujo vesicoureteral</b>.</li>
<li><b>Tres estrechamientos</b> (donde se atascan los cálculos): (1) <b>unión pieloureteral</b>, (2) <b>cruce de los vasos ilíacos / borde de la pelvis</b>, (3) <b>unión ureterovesical</b> (paso por la pared de la vejiga, el más estrecho).</li>
<li>Irrigación por ramas sucesivas de arterias renal, gonadal, aorta abdominal, ilíacas y vesicales, que se anastomosan longitudinalmente.</li>
<li><b>Cólico renal</b>: dolor lumbar intenso, intermitente, irradiado al flanco, la ingle y los genitales, con paciente inquieto ("no encuentra posición"), náuseas, hematuria.</li></ul>
<h3>Vejiga urinaria</h3>
<ul><li>Órgano muscular hueco, <b>subperitoneal</b>, en la pelvis menor por detrás de la <b>sínfisis del pubis</b> (espacio retropúbico); cuando está llena asciende al abdomen y puede palparse/percutirse sobre el pubis (<b>globo vesical</b>).</li>
<li>Capacidad fisiológica ≈ <b>400-500 mL</b>; el primer deseo miccional aparece con ≈ 150-250 mL.</li>
<li>Partes: <b>vértice</b> (hacia la sínfisis; de él sale el ligamento umbilical medio = uraco), <b>cuerpo</b>, <b>fondo o base</b> (posterior) y <b>cuello</b> (se continúa con la uretra).</li>
<li><b>Trígono vesical</b>: área lisa triangular entre los <b>dos orificios ureterales</b> y el <b>orificio uretral interno</b>; mucosa adherida (no forma pliegues); de origen mesodérmico.</li>
<li>Músculo <b>detrusor</b> (3 capas de músculo liso entrelazadas). <b>Esfínter uretral interno</b> (liso, involuntario; bien definido en el varón). <b>Esfínter uretral externo</b> (estriado, voluntario, en el periné/diafragma urogenital).</li>
<li>Relaciones posteriores: en el <b>varón</b>, recto, vesículas seminales y ampollas de los deferentes; la próstata debajo. En la <b>mujer</b>, útero (por arriba) y vagina (por detrás).</li>
<li>Irrigación: arterias <b>vesicales superiores</b> (de la umbilical) e <b>inferiores</b> (en la mujer, vaginales), ramas de la ilíaca interna.</li></ul>
<h3>Inervación y micción</h3>
<table><tr><th>Sistema</th><th>Origen / nervio</th><th>Acción</th></tr>
<tr><td><b>Parasimpático</b></td><td><b>S2-S4</b>, nervios esplácnicos pélvicos</td><td><b>Contrae el detrusor</b> y relaja el esfínter interno → <b>vaciamiento</b></td></tr>
<tr><td><b>Simpático</b></td><td>T11-L2, nervios hipogástricos</td><td>Relaja el detrusor y contrae el esfínter interno → <b>llenado/continencia</b> (y evita la eyaculación retrógrada)</td></tr>
<tr><td><b>Somático</b></td><td><b>Nervio pudendo</b> (S2-S4)</td><td>Contrae el <b>esfínter externo</b> (control voluntario)</td></tr></table>
<p><b>Reflejo miccional</b>: los receptores de estiramiento de la pared envían señales por los nervios pélvicos a la médula sacra → contracción del detrusor (reflejo autorregenerativo). Está facilitado/inhibido por el <b>centro pontino de la micción</b> y la corteza. Lesión medular por encima de S2: vejiga espástica (refleja); lesión sacra: vejiga atónica con retención y rebosamiento.</p>
<h3>Uretra</h3>
<ul><li><b>Femenina</b>: ≈ 4 cm, recta, se abre en el vestíbulo vulvar → mayor frecuencia de infecciones urinarias ascendentes.</li>
<li><b>Masculina</b>: ≈ 18-22 cm. Porciones: <b>preprostática</b> (intramural), <b>prostática</b> (con el veru montanum, desembocan los conductos eyaculadores), <b>membranosa (intermedia)</b> (la más corta y estrecha, rodeada por el esfínter externo) y <b>esponjosa</b> (la más larga, en el cuerpo esponjoso).</li>
<li>La <b>hiperplasia prostática benigna</b> comprime la uretra prostática → uropatía obstructiva (insuficiencia renal posrenal).</li></ul>
`);

T('r3','renal','Histología nefro-urológica',`
<h3>La nefrona (≈ 1 millón por riñón)</h3>
<p>Unidad funcional: <b>corpúsculo renal</b> + túbulo contorneado proximal + asa de Henle + túbulo contorneado distal. Los túbulos colectores no forman parte de la nefrona (distinto origen embriológico: brote ureteral).</p>
<ul><li><b>Nefronas corticales</b> (≈ 85 %): glomérulo en la corteza externa, asa de Henle corta, rodeadas de capilares peritubulares.</li>
<li><b>Nefronas yuxtamedulares</b> (≈ 15 %): glomérulo cerca de la médula, <b>asa de Henle larga</b> que llega a la papila, acompañada por los <b>vasos rectos</b> → <b>concentran la orina</b>.</li></ul>
<h3>Corpúsculo renal</h3>
<ul><li><b>Glomérulo</b> (ovillo capilar entre arteriola aferente y eferente) + <b>cápsula de Bowman</b>: hoja <b>parietal</b> (epitelio plano simple) y hoja <b>visceral</b> (<b>podocitos</b>). Entre ambas, el <b>espacio urinario (de Bowman)</b>.</li>
<li><b>Polo vascular</b> (entran y salen las arteriolas) y <b>polo urinario</b> (comienza el túbulo proximal).</li>
<li><b>Barrera de filtración</b> (3 capas):
<ol><li><b>Endotelio fenestrado</b> (poros de 70-100 nm, sin diafragma): frena células.</li>
<li><b>Membrana basal glomerular</b> (gruesa, fusión de las basales endotelial y podocitaria; <b>colágeno IV</b>, <b>laminina</b>, <b>proteoglucanos de heparán sulfato</b> con <b>carga negativa</b>): barrera de tamaño y de carga.</li>
<li><b>Podocitos</b>: prolongaciones primarias y <b>pedicelos</b> interdigitados; entre ellos las <b>hendiduras de filtración</b> cerradas por el <b>diafragma de hendidura</b> (proteína <b>nefrina</b>, podocina). Recubiertos de glucocáliz negativo (podocalixina).</li></ol></li>
<li><b>Células mesangiales</b> (intraglomerulares): sostén, contráctiles (regulan la superficie de filtración), fagocitan depósitos de la basal, secretan matriz.</li></ul>
<h3>Aparato yuxtaglomerular</h3>
<ul><li><b>Células yuxtaglomerulares (granulares)</b>: células musculares lisas modificadas de la <b>arteriola aferente</b> con gránulos de <b>renina</b>; funcionan como barorreceptores.</li>
<li><b>Mácula densa</b>: células altas y apretadas del <b>túbulo distal</b> (final de la rama ascendente gruesa) en contacto con el polo vascular de su propio glomérulo; detectan la <b>concentración de NaCl</b> (retroalimentación tubuloglomerular).</li>
<li><b>Células mesangiales extraglomerulares (de Lacis o Polkissen)</b>.</li></ul>
<h3>Túbulos</h3>
<table><tr><th>Segmento</th><th>Epitelio y rasgos</th><th>Función</th></tr>
<tr><td><b>Túbulo contorneado proximal</b></td><td>Cúbico simple, citoplasma <b>acidófilo</b>, <b>ribete en cepillo</b> (microvellosidades) que a veces ocluye la luz, interdigitaciones basales con <b>muchas mitocondrias</b> (estriación basal). El segmento más largo; predomina en los cortes de corteza.</td><td>Reabsorbe ≈ 65 % del filtrado</td></tr>
<tr><td><b>Asa de Henle, segmentos delgados</b></td><td>Epitelio <b>plano simple</b> (parecido a un capilar, pero sin sangre)</td><td>Descendente: permeable al agua. Ascendente: impermeable al agua</td></tr>
<tr><td><b>Rama ascendente gruesa</b> (túbulo recto distal)</td><td>Cúbico bajo, sin ribete, muchas mitocondrias</td><td>Bomba de NaCl (NKCC2); segmento diluyente</td></tr>
<tr><td><b>Túbulo contorneado distal</b></td><td>Cúbico, <b>sin ribete en cepillo</b>, luz más amplia y células más pequeñas y pálidas que el proximal (más núcleos por corte)</td><td>Reabsorción de NaCl (NCC), Ca²⁺ (PTH)</td></tr>
<tr><td><b>Túbulo y conducto colector</b></td><td>Cúbico a cilíndrico, <b>límites celulares nítidos</b>, citoplasma claro. <b>Células principales</b> (claras) e <b>intercaladas</b> (oscuras, ricas en mitocondrias)</td><td>Principales: Na⁺/K⁺ (aldosterona), agua (ADH, AQP2). Intercaladas A: secretan H⁺; B: secretan HCO₃⁻</td></tr></table>
<p>Los conductos colectores confluyen en los <b>conductos papilares (de Bellini)</b> que se abren en el área cribosa de la papila.</p>
<h3>Vías urinarias: urotelio</h3>
<ul><li>Pelvis, uréter, vejiga y uretra proximal están revestidos por <b>urotelio (epitelio de transición)</b>: estratificado, con células superficiales grandes, a veces binucleadas, en <b>"cúpula" o "paraguas"</b>, cuya membrana tiene <b>placas uroteliales (uroplaquinas)</b> que la hacen <b>impermeable</b> a la orina hipertónica y le permiten estirarse (en la vejiga llena se aplana a 2-3 capas).</li>
<li><b>Uréter</b>: mucosa con pliegues (<b>luz estrellada</b>), muscular con <b>capa longitudinal interna y circular externa</b> en los 2/3 superiores (al revés que el intestino); en el tercio inferior se agrega una <b>longitudinal externa</b>. Adventicia.</li>
<li><b>Vejiga</b>: urotelio, lámina propia, <b>detrusor</b> (3 capas mal definidas), serosa en la cara superior y adventicia en el resto.</li>
<li>Uretra: urotelio → seudoestratificado/estratificado cilíndrico → <b>plano estratificado</b> cerca del meato.</li></ul>
`);

T('r4','renal','Compartimientos de los líquidos corporales',`
<h3>Distribución (adulto de 70 kg)</h3>
<table><tr><th>Compartimiento</th><th>% del peso</th><th>Volumen</th></tr>
<tr><td><b>Agua corporal total</b></td><td>≈ 60 %</td><td>≈ 42 L</td></tr>
<tr><td>Líquido <b>intracelular (LIC)</b></td><td>≈ 40 % (2/3 del agua)</td><td>≈ 28 L</td></tr>
<tr><td>Líquido <b>extracelular (LEC)</b></td><td>≈ 20 % (1/3 del agua)</td><td>≈ 14 L</td></tr>
<tr><td>→ Intersticial (+ linfa)</td><td>≈ 3/4 del LEC</td><td>≈ 11 L</td></tr>
<tr><td>→ Plasma</td><td>≈ 1/4 del LEC</td><td>≈ 3 L</td></tr>
<tr><td>Transcelular</td><td>pequeño</td><td>LCR, sinovial, pleural, peritoneal, intraocular (1-2 L)</td></tr></table>
<ul><li>El % de agua es <b>mayor en el recién nacido</b> (≈ 75-80 %) y <b>menor en mujeres</b> (≈ 50 %), <b>ancianos</b> y <b>obesos</b> (el tejido adiposo tiene poca agua).</li>
<li><b>Volemia</b> ≈ 7 % del peso (≈ 5 L): 60 % plasma y 40 % glóbulos (hematocrito ≈ 40-45 %).</li></ul>
<h3>Balance diario de agua (≈ 2,3 L)</h3>
<ul><li>Ingresos: bebida ≈ 2,1 L + agua metabólica ≈ 0,2 L.</li><li>Egresos: <b>orina ≈ 1,4 L</b>, pérdidas insensibles (piel y respiración) ≈ 0,7 L, sudor ≈ 0,1 L, heces ≈ 0,1 L. En calor intenso/ejercicio el sudor puede llegar a 1-2 L/h.</li></ul>
<h3>Composición iónica</h3>
<table><tr><th></th><th>LEC (plasma/intersticio)</th><th>LIC</th></tr>
<tr><td>Catión principal</td><td><b>Na⁺</b> ≈ 142 mEq/L</td><td><b>K⁺</b> ≈ 140 mEq/L (y Mg²⁺)</td></tr>
<tr><td>Anión principal</td><td><b>Cl⁻</b> ≈ 108 y <b>HCO₃⁻</b> ≈ 24-28</td><td><b>Fosfatos</b> y <b>proteínas</b></td></tr>
<tr><td>Proteínas</td><td>Altas en plasma, bajas en intersticio</td><td>Muy altas</td></tr></table>
<p>La diferencia la mantiene la <b>Na⁺/K⁺-ATPasa</b>. El plasma y el intersticio son casi iguales salvo por las proteínas (equilibrio de Gibbs-Donnan). La osmolaridad es igual en todos los compartimientos (≈ 280-300 mOsm/L) porque el agua se mueve libremente.</p>
<h3>Medición: principio de dilución del indicador</h3>
<p>Volumen = cantidad inyectada / concentración en el líquido (tras distribuirse). Requisitos: distribuirse solo en ese compartimiento, de manera uniforme, sin metabolizarse.</p>
<table><tr><th>Compartimiento</th><th>Indicador</th></tr>
<tr><td>Agua corporal total</td><td>Agua tritiada (³H₂O), agua pesada (D₂O), antipirina</td></tr>
<tr><td>LEC</td><td>Inulina, ²²Na, ¹²⁵I-iotalamato, tiosulfato, manitol</td></tr>
<tr><td>Plasma</td><td>Albúmina marcada con ¹²⁵I, colorante <b>azul de Evans</b> (T-1824)</td></tr>
<tr><td>Volumen de eritrocitos</td><td>Eritrocitos marcados con ⁵¹Cr</td></tr>
<tr><td>LIC</td><td><b>Calculado</b>: agua total − LEC</td></tr>
<tr><td>Intersticial</td><td><b>Calculado</b>: LEC − plasma</td></tr></table>
<h3>Osmolaridad y movimientos de agua</h3>
<ul><li><b>Osmolaridad plasmática</b> ≈ 280-295 mOsm/L. Estimada: <b>2 × Na⁺ + glucosa/18 + BUN/2,8</b>. El Na⁺ y sus aniones aportan ≈ 90 % de la osmolaridad del LEC → <b>la natremia refleja la osmolaridad</b>.</li>
<li>Una solución <b>isotónica</b> (NaCl 0,9 %, ≈ 308 mOsm/L) no cambia el volumen celular; <b>hipotónica</b> → las células se hinchan; <b>hipertónica</b> → se encogen.</li>
<li>Reglas: (1) el agua se mueve rápido y la osmolaridad se iguala entre LIC y LEC; (2) las membranas celulares son casi impermeables al NaCl, así que el NaCl agregado queda en el LEC.</li></ul>
<table><tr><th>Se agrega al LEC</th><th>Volumen LEC</th><th>Volumen LIC</th><th>Osmolaridad</th></tr>
<tr><td>Solución isotónica (NaCl 0,9 %)</td><td>↑</td><td>=</td><td>=</td></tr>
<tr><td>Solución hipertónica (NaCl 3 %)</td><td>↑↑</td><td>↓ (sale agua de las células)</td><td>↑</td></tr>
<tr><td>Solución hipotónica / agua (dextrosa 5 % luego de metabolizarse)</td><td>↑</td><td>↑</td><td>↓</td></tr>
<tr><td>Pérdida isotónica (diarrea, hemorragia)</td><td>↓</td><td>=</td><td>=</td></tr>
<tr><td>Pérdida de agua pura / sudor hipotónico (deshidratación)</td><td>↓</td><td>↓</td><td>↑</td></tr></table>
<p>La <b>dextrosa al 5 %</b> es isoosmótica al infundirla, pero la glucosa se metaboliza y en la práctica equivale a dar agua libre.</p>
<h3>Hiponatremia e hipernatremia</h3>
<ul><li><b>Hiponatremia</b> (&lt; 135): por pérdida de Na⁺ (diarrea, vómitos, diuréticos, Addison) o exceso de agua (<b>SIADH</b>, IC, cirrosis, polidipsia). Las células se hinchan → <b>edema cerebral</b>: cefalea, náuseas, letargo, convulsiones, coma. La corrección rápida de una hiponatremia crónica causa <b>mielinólisis pontina central</b> (desmielinización osmótica).</li>
<li><b>Hipernatremia</b> (&gt; 145): pérdida de agua (deshidratación, <b>diabetes insípida</b>) o exceso de Na⁺. Las células se deshidratan: sed, irritabilidad, confusión, convulsiones.</li></ul>
`);

T('r5','renal','Filtración glomerular, flujo sanguíneo renal y su regulación',`
<h3>Valores clave</h3>
<ul><li><b>Flujo sanguíneo renal (FSR)</b> ≈ 1100-1200 mL/min (≈ 22 % del GC, para un órgano de 0,4 % del peso: el flujo es mucho mayor que lo que su metabolismo requiere, porque sirve para filtrar).</li>
<li><b>Flujo plasmático renal (FPR)</b> ≈ 650 mL/min. FSR = FPR / (1 − Hto).</li>
<li><b>Filtrado glomerular (FG)</b> ≈ <b>125 mL/min = 180 L/día</b>. Todo el plasma se filtra ≈ 60 veces por día.</li>
<li><b>Fracción de filtración (FF) = FG / FPR</b> ≈ 0,2 (20 %).</li>
<li>Excreción = Filtración − Reabsorción + Secreción.</li>
<li>El consumo de O₂ renal depende sobre todo de la <b>reabsorción activa de Na⁺</b>: si cae el FG, cae el consumo de O₂.</li></ul>
<h3>Barrera de filtración: qué pasa y qué no</h3>
<ul><li>Determinantes de la filtrabilidad: <b>tamaño</b> (peso molecular), <b>carga eléctrica</b> y forma/deformabilidad.</li>
<li>Sustancias &lt; ≈ 7000 Da (agua, glucosa, urea, Na⁺, inulina) filtran libremente (filtrabilidad = 1). La <b>albúmina</b> (≈ 69 000 Da, ≈ 6 nm) prácticamente no filtra (filtrabilidad ≈ 0,005) por su tamaño y sobre todo por su <b>carga negativa</b>, repelida por los proteoglucanos de la MBG y los podocitos.</li>
<li>A igual tamaño, las moléculas <b>catiónicas</b> filtran más que las <b>aniónicas</b>. En la <b>nefropatía por cambios mínimos</b> se pierde la carga negativa → albuminuria sin cambios visibles al microscopio óptico.</li></ul>
<h3>Fuerzas de Starling glomerulares</h3>
<p><b>FG = Kf × PNF</b> &nbsp;&nbsp; <b>PNF = P<sub>G</sub> − P<sub>B</sub> − π<sub>G</sub> + π<sub>B</sub></b></p>
<table><tr><th>Fuerza</th><th>Valor (Guyton)</th><th>Efecto</th></tr>
<tr><td>Presión hidrostática glomerular (P<sub>G</sub>)</td><td>≈ <b>60 mmHg</b> (alta y casi constante a lo largo del capilar)</td><td>Favorece la filtración</td></tr>
<tr><td>Presión hidrostática en la cápsula de Bowman (P<sub>B</sub>)</td><td>≈ 18 mmHg</td><td>Se opone</td></tr>
<tr><td>Presión oncótica glomerular (π<sub>G</sub>)</td><td>≈ 32 mmHg promedio (28 → 36 a lo largo del capilar, porque se concentra la proteína al filtrarse el agua)</td><td>Se opone</td></tr>
<tr><td>Presión oncótica en Bowman (π<sub>B</sub>)</td><td>≈ 0</td><td>Favorecería</td></tr>
<tr><td><b>Presión neta de filtración</b></td><td><b>≈ 10 mmHg</b></td><td></td></tr></table>
<ul><li><b>Kf</b> (coeficiente de filtración = permeabilidad × superficie) ≈ 12,5 mL/min/mmHg, ≈ 400 veces el de otros capilares. Disminuye en la diabetes y la HTA crónicas (engrosamiento de la MBG, pérdida de glomérulos).</li>
<li>↑ <b>P<sub>B</sub></b>: obstrucción urinaria (cálculos, HPB) → ↓ FG.</li>
<li>↑ <b>π<sub>G</sub></b>: ↑ proteínas plasmáticas (deshidratación) o ↑ fracción de filtración, o ↓ FSR → ↓ FG.</li>
<li>↑ <b>P<sub>G</sub></b>: ↑ PA (amortiguado por la autorregulación), dilatación aferente, constricción eferente moderada.</li></ul>
<h3>Efecto de las arteriolas</h3>
<table><tr><th>Cambio</th><th>P<sub>G</sub></th><th>FSR</th><th>FG</th></tr>
<tr><td>Constricción de la <b>aferente</b></td><td>↓</td><td>↓</td><td>↓</td></tr>
<tr><td>Dilatación de la aferente</td><td>↑</td><td>↑</td><td>↑</td></tr>
<tr><td>Constricción <b>eferente moderada</b></td><td>↑</td><td>↓</td><td>↑ (leve)</td></tr>
<tr><td>Constricción <b>eferente intensa</b></td><td>↑</td><td>↓↓</td><td>↓ (efecto bifásico: sube mucho π<sub>G</sub>)</td></tr></table>
<h3>Regulación del FG y del FSR</h3>
<ul>
<li><b>Autorregulación</b>: el FG y el FSR se mantienen relativamente constantes con PA media entre ≈ <b>75 y 160 mmHg</b>. Evita que cambios de PA produzcan grandes cambios en la excreción. Dos mecanismos:
<ol><li><b>Mecanismo miogénico</b>: el estiramiento de la arteriola aferente → entrada de Ca²⁺ → contracción.</li>
<li><b>Retroalimentación tubuloglomerular</b> (mácula densa): si cae el FG → llega menos NaCl a la mácula densa → (a) <b>dilatación de la arteriola aferente</b> y (b) <b>liberación de renina</b> → angiotensina II → <b>constricción de la eferente</b> → ↑ P<sub>G</sub> → el FG vuelve a la normalidad. Si sube el FG, ocurre lo inverso (vía adenosina/ATP que contrae la aferente).</li></ol></li>
<li><b>Simpático</b> (intenso: hemorragia, isquemia cerebral): contrae las arteriolas → ↓ FSR y FG; ↑ renina; ↑ reabsorción de Na⁺.</li>
<li><b>Hormonas vasoconstrictoras</b>: noradrenalina, adrenalina, <b>endotelina</b> → ↓ FG. <b>Angiotensina II</b>: contrae preferentemente la <b>eferente</b> → mantiene el FG cuando cae la PA (por eso los IECA/ARA II pueden bajar el FG en la estenosis bilateral de arteria renal o en la deshidratación).</li>
<li><b>Vasodilatadores</b>: <b>óxido nítrico</b> (endotelial; mantiene el tono basal), <b>prostaglandinas</b> (PGE₂, PGI₂) y <b>bradicinina</b> → ↑ FG. Los <b>AINE</b> bloquean las prostaglandinas y pueden precipitar insuficiencia renal en pacientes con hipovolemia o IC.</li>
<li>Otros: dieta rica en proteínas y la hiperglucemia ↑ el FG (↑ reabsorción proximal de Na⁺ con aminoácidos/glucosa → menos NaCl a la mácula densa); glucocorticoides ↑ FG.</li></ul>
`);

T('r6','renal','Aclaramiento (clearance) renal',`
<h3>Concepto</h3>
<p>Aclaramiento de una sustancia X = <b>volumen de plasma que el riñón depura completamente de X por unidad de tiempo</b>.</p>
<p style="font-size:1.1em"><b>C<sub>x</sub> = (U<sub>x</sub> × V) / P<sub>x</sub></b> &nbsp; (U: concentración urinaria; V: flujo urinario en mL/min; P: concentración plasmática)</p>
<h3>Usos</h3>
<table><tr><th>Sustancia</th><th>Qué mide</th><th>Por qué</th></tr>
<tr><td><b>Inulina</b></td><td><b>FG</b> (patrón oro)</td><td>Se filtra libremente, no se reabsorbe, no se secreta, no se metaboliza</td></tr>
<tr><td><b>Creatinina</b></td><td>FG aproximado (clínica)</td><td>Endógena, producción constante (masa muscular); se filtra y se <b>secreta un poco</b> → sobreestima el FG ≈ 10-20 % (y el método de laboratorio sobreestima la creatinina plasmática: los errores se compensan)</td></tr>
<tr><td><b>PAH (paraaminohipurato)</b></td><td><b>FPR efectivo</b></td><td>Se filtra y se secreta casi totalmente (≈ 90 % de extracción en un solo paso)</td></tr>
<tr><td>Glucosa (normal)</td><td>—</td><td>Aclaramiento ≈ 0: se reabsorbe totalmente</td></tr></table>
<h3>Interpretación (comparar con el FG)</h3>
<ul><li>C<sub>x</sub> = FG → la sustancia solo se filtra (o reabsorción = secreción).</li><li>C<sub>x</sub> &lt; FG → <b>reabsorción neta</b> (Na⁺, urea, glucosa, aminoácidos).</li><li>C<sub>x</sub> &gt; FG → <b>secreción neta</b> (PAH, creatinina en algo, H⁺, K⁺ cuando hay mucho, fármacos).</li></ul>
<h3>Cálculos derivados</h3>
<ul><li><b>Carga filtrada</b> = FG × P<sub>x</sub> (× filtrabilidad).</li>
<li><b>Tasa de excreción</b> = U<sub>x</sub> × V.</li>
<li><b>Reabsorción</b> = carga filtrada − excreción. <b>Secreción</b> = excreción − carga filtrada.</li>
<li><b>Fracción de filtración</b> = FG / FPR ≈ 125/650 ≈ 0,19.</li>
<li><b>FSR</b> = FPR / (1 − Hto).</li>
<li><b>Fracción excretada de Na⁺ (FENa)</b> = (U<sub>Na</sub> × P<sub>Cr</sub>) / (P<sub>Na</sub> × U<sub>Cr</sub>) × 100. Normal &lt; 1 %. Útil en la insuficiencia renal aguda (prerrenal &lt; 1 %, NTA &gt; 2 %).</li></ul>
<h3>Creatinina plasmática y FG</h3>
<ul><li>En estado estable, la producción = la excreción ≈ FG × P<sub>Cr</sub> → <b>P<sub>Cr</sub> es inversamente proporcional al FG</b>: si el FG cae a la mitad, la creatinina plasmática se duplica (relación hiperbólica). En las primeras etapas de la ERC se pierde mucho FG con poco aumento de la creatinina.</li>
<li>Normal: 0,6-1,2 mg/dL (depende de la masa muscular). <b>Urea/BUN</b> también aumenta cuando cae el FG, pero se reabsorbe y depende de la dieta y el catabolismo; la relación BUN/creatinina &gt; 20 sugiere causa prerrenal.</li>
<li>Estimaciones del FG: <b>Cockcroft-Gault</b> (clearance de creatinina = [(140 − edad) × peso] / (72 × Cr) × 0,85 en mujeres), <b>MDRD</b>, <b>CKD-EPI</b> (la recomendada).</li>
<li>Clearance de creatinina con orina de 24 h: requiere recolección completa (descartar la primera orina, recolectar todas las siguientes incluida la del día siguiente a la misma hora).</li></ul>
`);

T('r7','renal','Reabsorción y secreción tubular (manejo de sustancias)',`
<h3>Mecanismos de transporte</h3>
<ul><li><b>Vías</b>: <b>transcelular</b> (atravesando la membrana luminal y la basolateral) y <b>paracelular</b> (por las uniones estrechas).</li>
<li><b>Transporte activo primario</b>: <b>Na⁺/K⁺-ATPasa basolateral</b> (motor de casi todo), H⁺-ATPasa, H⁺/K⁺-ATPasa, Ca²⁺-ATPasa.</li>
<li><b>Activo secundario</b>: cotransporte con Na⁺ (glucosa: <b>SGLT2</b> en el S1 y SGLT1 en el S3 del proximal; aminoácidos; fosfato) y contratransporte (<b>Na⁺/H⁺, NHE3</b>).</li>
<li>Pinocitosis (proteínas de bajo peso filtradas, en el proximal). Ósmosis del agua (por acuaporinas) y arrastre por solvente.</li>
<li><b>Transporte máximo (Tm)</b>: los transportadores se saturan. <b>Glucosa</b>: Tm ≈ 375 mg/min; <b>umbral renal</b> ≈ 180-200 mg/dL de glucemia (por encima aparece glucosuria; antes del Tm por la heterogeneidad de las nefronas: "desviación" de la curva).</li></ul>
<h3>Segmento por segmento</h3>
<table><tr><th>Segmento</th><th>Qué reabsorbe/secreta</th><th>Transportadores y regulación</th></tr>
<tr><td><b>Túbulo proximal</b></td><td>≈ <b>65 %</b> del Na⁺, agua, Cl⁻ y K⁺ filtrados; ≈ <b>100 % de glucosa y aminoácidos</b>; <b>80-90 % del HCO₃⁻</b>; fosfato, urea (≈ 50 %), Ca²⁺, Mg²⁺ en parte. Reabsorción <b>isoosmótica</b>. <b>Secreta</b> ácidos y bases orgánicos (sales biliares, oxalato, urato, catecolaminas, PAH, fármacos: penicilina, salicilatos) y NH₄⁺</td><td>SGLT2, NHE3 (Na⁺/H⁺), anhidrasa carbónica, AQP1. Angiotensina II ↑ reabsorción; <b>PTH ↓ reabsorción de fosfato</b>. Inhibidores de la anhidrasa carbónica (acetazolamida), iSGLT2</td></tr>
<tr><td><b>Rama descendente delgada</b></td><td>≈ 20 % del agua; poco soluto</td><td>Muy permeable al agua (AQP1)</td></tr>
<tr><td><b>Rama ascendente delgada y gruesa</b></td><td>≈ <b>25 % del Na⁺, Cl⁻, K⁺</b>; Ca²⁺, Mg²⁺ (paracelular, por la luz positiva); HCO₃⁻. <b>Impermeable al agua</b> → "segmento diluyente" (sale el túbulo hipotónico)</td><td><b>Cotransportador Na⁺-K⁺-2Cl⁻ (NKCC2)</b> → lo bloquean los <b>diuréticos de asa (furosemida)</b>; canal ROMK recicla K⁺ (luz positiva)</td></tr>
<tr><td><b>Túbulo distal inicial</b></td><td>≈ 5 % del NaCl; Ca²⁺ (regulado por PTH). Impermeable al agua</td><td><b>Cotransportador Na⁺-Cl⁻ (NCC)</b> → lo bloquean las <b>tiazidas</b> (que además ↓ la excreción de Ca²⁺)</td></tr>
<tr><td><b>Túbulo distal final y colector cortical — células principales</b></td><td>Reabsorben Na⁺ y agua; <b>secretan K⁺</b></td><td><b>ENaC</b> (canal de Na⁺) y <b>ROMK</b>; <b>aldosterona</b> ↑ ambos y la Na⁺/K⁺-ATPasa. Bloqueo: amilorida (ENaC), espironolactona (receptor de aldosterona) → <b>ahorradores de K⁺</b></td></tr>
<tr><td>— <b>células intercaladas</b></td><td>Tipo A: <b>secretan H⁺</b> (H⁺-ATPasa, H⁺/K⁺-ATPasa), reabsorben HCO₃⁻ y K⁺. Tipo B: secretan HCO₃⁻ (en alcalosis)</td><td>Aldosterona ↑ secreción de H⁺</td></tr>
<tr><td><b>Conducto colector medular</b></td><td>Agua (variable), <b>urea</b>; secreta H⁺</td><td><b>ADH</b> → receptores V2 → inserta <b>AQP2</b> luminales; ↑ transportadores de urea UT-A1</td></tr></table>
<h3>Reabsorción en los capilares peritubulares</h3>
<p>Fuerzas de Starling: presión hidrostática peritubular baja (≈ 13 mmHg) y oncótica alta (≈ 32 mmHg, porque la sangre perdió el 20 % del plasma filtrado) → <b>reabsorción neta ≈ 10 mmHg</b>. Si ↑ la PA → ↑ presión peritubular → ↓ reabsorción (natriuresis por presión).</p>
<h3>Hormonas</h3>
<table><tr><th>Hormona</th><th>Sitio</th><th>Efecto</th></tr>
<tr><td><b>Aldosterona</b></td><td>Túbulo/conducto colector (principales e intercaladas)</td><td>↑ reabsorción de Na⁺ y agua; ↑ secreción de <b>K⁺</b> y H⁺. Estímulos: <b>↑ K⁺ plasmático</b> y <b>angiotensina II</b></td></tr>
<tr><td><b>Angiotensina II</b></td><td>Proximal, asa gruesa, distal, colector</td><td>↑ reabsorción de Na⁺ y agua; ↑ aldosterona; constricción eferente</td></tr>
<tr><td><b>ADH</b></td><td>Distal final y colector</td><td>↑ reabsorción de agua (AQP2) y urea</td></tr>
<tr><td><b>PNA</b></td><td>Colector</td><td>↓ reabsorción de Na⁺ y agua (natriuresis); ↓ renina</td></tr>
<tr><td><b>PTH</b></td><td>Proximal / asa gruesa y distal</td><td>↓ reabsorción de fosfato / ↑ reabsorción de Ca²⁺; activa la 1α-hidroxilasa (calcitriol)</td></tr></table>
<h3>Otros conceptos</h3>
<ul><li><b>Balance glomerulotubular</b>: si ↑ la carga filtrada, ↑ la reabsorción proximal en proporción (amortigua cambios del FG).</li>
<li><b>Manejo del K⁺</b>: se filtra, se reabsorbe ≈ 65 % en el proximal y ≈ 25 % en el asa; la <b>excreción se regula por la secreción</b> en las células principales: la estimulan ↑ K⁺ plasmático, aldosterona, ↑ flujo tubular (diuréticos) y la alcalosis; la acidosis aguda la disminuye.</li>
<li><b>Manejo del Ca²⁺</b>: ≈ 99 % se reabsorbe (65 % proximal, 25-30 % asa gruesa, 4-9 % distal regulado por PTH).</li>
<li><b>Urea</b>: ≈ 50 % se reabsorbe en el proximal; se recicla en la médula (contribuye a la concentración de la orina).</li></ul>
`);

T('r8','renal','Concentración y dilución de la orina (contracorriente)',`
<h3>Rango y requisitos</h3>
<ul><li>El riñón puede producir orina de <b>50 mOsm/L</b> (máxima dilución) a <b>1200-1400 mOsm/L</b> (máxima concentración), con una osmolaridad plasmática de ≈ 300.</li>
<li>Requisitos para concentrar: (1) <b>ADH elevada</b> (↑ permeabilidad al agua del distal final y colectores) y (2) <b>intersticio medular hiperosmótico</b> (hasta 1200-1400 mOsm/L en la papila).</li>
<li><b>Volumen urinario obligatorio</b>: con ≈ 600 mOsm de solutos a excretar por día y una capacidad máxima de concentración de 1200 mOsm/L → <b>0,5 L/día</b> mínimo. Por eso beber agua de mar (≈ 1000-1200 mOsm/L de NaCl) deshidrata: para excretar esa sal más los demás solutos (urea) se necesita más agua que la ingerida.</li></ul>
<h3>Mecanismo multiplicador de contracorriente (asa de Henle)</h3>
<ol><li>La <b>rama ascendente gruesa</b> bombea NaCl al intersticio (NKCC2) pero es <b>impermeable al agua</b> → crea un gradiente de ≈ 200 mOsm/L entre la luz y el intersticio ("efecto único").</li>
<li>La <b>rama descendente</b> es <b>permeable al agua</b> e impermeable a solutos → sale agua hacia el intersticio hiperosmótico y el líquido tubular se concentra hasta igualarlo.</li>
<li>El flujo empuja el líquido concentrado hacia la curva del asa y el diluido hacia la corteza.</li>
<li>La repetición de bombeo + flujo <b>multiplica</b> el gradiente hasta 1200-1400 mOsm/L en la punta de la papila (las <b>asas largas yuxtamedulares</b> son las que lo logran).</li></ol>
<h3>Papel de la urea</h3>
<ul><li>Aporta ≈ <b>40-50 %</b> de la osmolaridad del intersticio medular cuando la orina está concentrada.</li>
<li>Con ADH, se reabsorbe agua en el colector cortical (impermeable a la urea) → la urea se concentra → en el <b>colector medular interno</b> (permeable a la urea por UT-A1, ↑ por ADH) difunde al intersticio → parte vuelve a entrar al asa: <b>recirculación de la urea</b>.</li>
<li>Por eso una dieta pobre en proteínas reduce la capacidad de concentrar.</li></ul>
<h3>Intercambiador de contracorriente: vasos rectos</h3>
<ul><li>Capilares en horquilla que acompañan a las asas yuxtamedulares. Reciben solo ≈ 1-2 % del FSR (flujo lento).</li>
<li>En la rama descendente ganan solutos y pierden agua; en la ascendente los devuelven y recuperan agua → <b>no "lavan" el gradiente</b> y aportan nutrientes. Son <b>intercambiadores pasivos</b>, no crean el gradiente.</li>
<li>Si aumenta el flujo de los vasos rectos (vasodilatadores), se "lava" la médula y cae la capacidad de concentrar.</li></ul>
<h3>Recorrido de la osmolaridad del líquido tubular</h3>
<table><tr><th>Segmento</th><th>Osmolaridad del líquido (mOsm/L)</th></tr>
<tr><td>Túbulo proximal</td><td>≈ 300 (isoosmótico)</td></tr>
<tr><td>Punta del asa</td><td>≈ 1200 (con ADH) / ≈ 600 (sin ADH)</td></tr>
<tr><td>Final de la rama ascendente gruesa</td><td><b>≈ 100 (siempre hipotónico, con o sin ADH)</b></td></tr>
<tr><td>Distal final / colector cortical</td><td>Sin ADH sigue bajando (≈ 50) · Con ADH se equilibra con la corteza (≈ 300)</td></tr>
<tr><td>Colector medular / orina final</td><td>Sin ADH ≈ 50 · Con ADH ≈ 1200</td></tr></table>
<h3>Dilución de la orina</h3>
<p>Sin ADH, el distal final y el colector siguen reabsorbiendo solutos pero no agua → orina muy diluida (hasta 50 mOsm/L) con gran volumen (hasta ≈ 20 L/día).</p>
<h3>Aclaramiento osmolar y de agua libre</h3>
<ul><li><b>C<sub>osm</sub></b> = (U<sub>osm</sub> × V) / P<sub>osm</sub>.</li>
<li><b>C<sub>H₂O</sub> (agua libre)</b> = V − C<sub>osm</sub>. Positivo → orina diluida (se excreta agua libre). Negativo → orina concentrada (se retiene agua).</li></ul>
<h3>Control de la osmolaridad y del Na⁺: sistema osmorreceptor-ADH y sed</h3>
<ul><li><b>Osmorreceptores</b> en el hipotálamo anterior (cerca de los núcleos supraóptico y paraventricular): con ↑ osmolaridad se encogen → ↑ secreción de <b>ADH</b> (sintetizada en los núcleos <b>supraóptico y paraventricular</b>, liberada por la <b>neurohipófisis</b>).</li>
<li>Un cambio de ≈ 1 % de la osmolaridad modifica la ADH. Estímulos no osmóticos: <b>↓ volumen/PA ≥ 10 %</b> (barorreceptores; muy potente), náuseas, nicotina, morfina, angiotensina II. Inhiben: alcohol, PNA, ↑ volumen.</li>
<li>Mecanismo de la ADH: receptor <b>V2</b> → AMPc → PKA → inserción de vesículas con <b>acuaporina 2</b> en la membrana luminal. (Receptor V1: vasoconstricción.)</li>
<li><b>Sed</b>: centro en la pared anteroventral del III ventrículo (órgano subfornical, OVLT). Estímulos: ↑ osmolaridad, ↓ volumen/PA, angiotensina II, sequedad de boca.</li>
<li>Juntos, ADH y sed mantienen la natremia aun con grandes cambios de la ingesta de sal. La aldosterona y la AII regulan más el <b>volumen</b> (cantidad de Na⁺) que la concentración.</li></ul>
<h3>Alteraciones</h3>
<ul><li><b>Diabetes insípida central</b> (falta de ADH) o <b>nefrogénica</b> (el riñón no responde: litio, hipercalcemia, hipopotasemia, genética) → poliuria de orina diluida, polidipsia, riesgo de hipernatremia. La central responde a la desmopresina.</li>
<li><b>SIADH</b> (secreción inapropiada de ADH: tumores como el carcinoma pulmonar de células pequeñas, patología del SNC o pulmonar, fármacos) → retención de agua, <b>hiponatremia</b> euvolémica, orina inapropiadamente concentrada.</li>
<li><b>Diuréticos de asa</b>: al bloquear NKCC2 destruyen el gradiente medular → no se puede concentrar ni diluir al máximo.</li>
<li>En la <b>ERC</b> se pierde la capacidad de concentrar y diluir → <b>isostenuria</b> (orina fija ≈ 300 mOsm/L, densidad ≈ 1,010) y nicturia.</li></ul>
`);

T('r9','renal','Trastornos electrolíticos (Na⁺, K⁺, Ca²⁺)',`
<h3>Potasio (3,5-5 mEq/L)</h3>
<p>98 % es intracelular. Pequeños cambios del K⁺ extracelular alteran mucho el potencial de reposo (excitabilidad cardíaca y muscular).</p>
<ul><li><b>Distribución interna</b> (entrada a las células): <b>insulina</b>, <b>aldosterona</b>, <b>estímulo β2-adrenérgico</b>, <b>alcalosis</b>. Salida de las células: déficit de insulina, β-bloqueantes, <b>acidosis</b>, <b>lisis celular</b> (rabdomiólisis, hemólisis, síndrome de lisis tumoral), ejercicio intenso, ↑ osmolaridad.</li>
<li><b>Excreción renal</b>: se regula por la secreción en las células principales (aldosterona, K⁺ plasmático, flujo tubular distal, Na⁺ distal).</li></ul>
<table><tr><th></th><th>Hipopotasemia (&lt; 3,5)</th><th>Hiperpotasemia (&gt; 5)</th></tr>
<tr><td>Causas</td><td>Diuréticos de asa y tiazidas, <b>vómitos</b>, <b>diarrea</b>, hiperaldosteronismo, insulina, β2-agonistas, alcalosis, baja ingesta</td><td><b>Insuficiencia renal</b>, acidosis, <b>IECA/ARA II</b>, espironolactona, amilorida, hipoaldosteronismo (Addison), lisis celular, déficit de insulina, pseudohiperpotasemia (hemólisis de la muestra)</td></tr>
<tr><td>Clínica</td><td>Debilidad muscular, calambres, íleo, poliuria (DI nefrogénica), arritmias; potencia la toxicidad digitálica</td><td>Debilidad/parálisis, parestesias, <b>arritmias graves</b> (bradicardia, bloqueos, FV, asistolia)</td></tr>
<tr><td>ECG</td><td><b>T aplanadas</b>, <b>onda U prominente</b>, descenso del ST, QT(U) largo</td><td><b>T altas y picudas</b> (primer signo) → PR largo, P aplanada/ausente → <b>QRS ancho</b> → patrón sinusoidal → FV/asistolia</td></tr>
<tr><td>Tratamiento (generalidades)</td><td>Reponer K⁺ (oral o EV lento)</td><td><b>Gluconato de calcio</b> (estabiliza la membrana, no baja el K⁺) → <b>insulina + glucosa</b>, salbutamol, bicarbonato (redistribución) → resinas, diuréticos de asa o <b>diálisis</b> (eliminación)</td></tr></table>
<h3>Sodio (135-145 mEq/L)</h3>
<ul><li>La natremia refleja la relación agua/Na⁺, no el Na⁺ corporal total. El <b>volumen</b> del LEC refleja el <b>Na⁺ total</b>.</li>
<li><b>Hiponatremia</b> según volemia: <b>hipovolémica</b> (vómitos, diarrea, diuréticos, Addison), <b>euvolémica</b> (<b>SIADH</b>, hipotiroidismo, polidipsia primaria), <b>hipervolémica</b> (<b>IC</b>, <b>cirrosis</b>, <b>síndrome nefrótico</b>, ERC). Clínica neurológica por edema cerebral. Corrección máxima ≈ 8-10 mEq/L en 24 h (riesgo de desmielinización osmótica).</li>
<li><b>Hipernatremia</b>: casi siempre por <b>déficit de agua</b> (ancianos sin acceso al agua, fiebre, diabetes insípida, diuresis osmótica). Clínica: sed, irritabilidad, confusión, convulsiones. Corregir lentamente (edema cerebral).</li></ul>
<h3>Calcio (8,5-10,5 mg/dL)</h3>
<ul><li>≈ 50 % ionizado (activo), 40 % unido a proteínas (albúmina), 10 % unido a aniones. La <b>alcalosis</b> aumenta la unión a la albúmina → ↓ Ca²⁺ iónico (tetania en la hiperventilación). Corregir por albúmina: Ca corregido = Ca medido + 0,8 × (4 − albúmina).</li>
<li>Regulación: <b>PTH</b> (↑ Ca²⁺: resorción ósea, ↑ reabsorción renal distal, ↑ calcitriol; ↓ reabsorción de fosfato), <b>calcitriol</b> (1,25-(OH)₂ vit. D: ↑ absorción intestinal; se activa en el túbulo proximal por la 1α-hidroxilasa), <b>calcitonina</b>.</li>
<li><b>Hipocalcemia</b>: ↑ excitabilidad neuromuscular → parestesias peribucales, <b>tetania</b>, <b>signo de Chvostek</b> (contracción facial al percutir el nervio facial) y <b>de Trousseau</b> (espasmo carpopedal con el manguito), convulsiones, <b>QT largo</b>. Causas: hipoparatiroidismo, déficit de vitamina D, <b>ERC</b>, pancreatitis, hipomagnesemia.</li>
<li><b>Hipercalcemia</b>: "huesos, piedras, quejidos abdominales y gemidos psíquicos" — dolor óseo, <b>litiasis</b>, poliuria (DI nefrogénica), constipación, náuseas, confusión; <b>QT corto</b>. Causas: hiperparatiroidismo primario, cáncer (metástasis, PTHrP).</li></ul>
<h3>Fósforo y magnesio</h3>
<ul><li><b>Hiperfosfatemia</b> en la ERC (↓ excreción) → precipita con el Ca²⁺ y estimula la PTH (hiperparatiroidismo secundario).</li><li><b>Hipomagnesemia</b>: diuréticos, alcoholismo, diarrea; produce hipocalcemia e hipopotasemia refractarias.</li></ul>
`);

T('r10','renal','Equilibrio ácido-base',`
<h3>Conceptos básicos</h3>
<ul><li>[H⁺] normal ≈ 40 nEq/L (≈ 0,00004 mEq/L): pH = −log[H⁺] = <b>7,40</b> (arterial 7,35-7,45; venoso ≈ 7,35). Compatibles con la vida: 6,8-8,0.</li>
<li><b>Acidosis</b>: proceso que tiende a bajar el pH; <b>acidemia</b>: pH &lt; 7,35. Alcalosis/alcalemia: pH &gt; 7,45.</li>
<li>Producción diaria: ≈ 15 000-20 000 mmol de <b>CO₂ (ácido volátil)</b>, eliminado por el pulmón; y ≈ <b>80 mEq de ácidos no volátiles</b> (≈ 1 mEq/kg/día: sulfúrico, fosfórico, del metabolismo proteico), que solo puede eliminar el <b>riñón</b>.</li></ul>
<h3>Ecuación de Henderson-Hasselbalch</h3>
<p style="font-size:1.1em"><b>pH = 6,1 + log [HCO₃⁻] / (0,03 × PCO₂)</b> = 6,1 + log (24 / 1,2) = 6,1 + log 20 = 7,4</p>
<p>Lo que importa es la <b>relación HCO₃⁻/CO₂ = 20/1</b>. El riñón regula el HCO₃⁻ (componente metabólico) y el pulmón la PCO₂ (componente respiratorio).</p>
<h3>Tres líneas de defensa</h3>
<table><tr><th>Sistema</th><th>Velocidad</th><th>Detalles</th></tr>
<tr><td><b>Amortiguadores químicos</b></td><td>Segundos</td><td><b>Bicarbonato</b> (el más importante del LEC por su concentración y porque es un sistema abierto: el pulmón regula el CO₂ y el riñón el HCO₃⁻; pK 6,1). <b>Fosfato</b> (pK 6,8; importante en el líquido tubular e intracelular). <b>Proteínas</b> (el más abundante del cuerpo; intracelular; hemoglobina en el eritrocito). No eliminan ácido, solo lo "atrapan". Principio isohídrico: todos se mueven juntos.</td></tr>
<tr><td><b>Respiratorio</b></td><td>Minutos</td><td>↑ H⁺ estimula el centro respiratorio → ↑ ventilación → ↓ PCO₂. Eficacia 50-75 % (ganancia 1-3); no corrige del todo porque al bajar el H⁺ cae el estímulo.</td></tr>
<tr><td><b>Renal</b></td><td>Horas a días (el más potente)</td><td>Reabsorbe el HCO₃⁻ filtrado, genera HCO₃⁻ nuevo y excreta H⁺. Puede corregir completamente.</td></tr></table>
<h3>Mecanismos renales</h3>
<ol><li><b>Reabsorción del HCO₃⁻ filtrado</b> (≈ 4320 mEq/día): ≈ 80-85 % en el proximal. En la célula: CO₂ + H₂O → (<b>anhidrasa carbónica</b>) H₂CO₃ → H⁺ + HCO₃⁻; el H⁺ sale a la luz por el <b>intercambiador Na⁺/H⁺</b> (y H⁺-ATPasa), se une al HCO₃⁻ filtrado formando H₂CO₃ → CO₂ + H₂O (anhidrasa carbónica luminal) que reingresa; el HCO₃⁻ intracelular pasa a la sangre (cotransporte Na⁺-HCO₃⁻ basolateral). Por cada H⁺ secretado se "recupera" un HCO₃⁻.</li>
<li><b>Secreción de H⁺ en las células intercaladas tipo A</b> (H⁺-ATPasa, H⁺/K⁺-ATPasa): puede generar un pH urinario de hasta <b>4,5</b>. El H⁺ libre que se puede excretar es mínimo → necesita amortiguadores urinarios.</li>
<li><b>Generación de HCO₃⁻ nuevo</b> (excreción de ácido):
<ul><li><b>Fosfato</b> (HPO₄²⁻ + H⁺ → H₂PO₄⁻) = <b>acidez titulable</b> (≈ 30-40 mEq/día; poco adaptable).</li>
<li><b>Amoníaco/amonio</b>: la <b>glutamina</b> se metaboliza en el proximal → 2 NH₄⁺ + 2 HCO₃⁻ nuevos. En el colector, NH₃ + H⁺ → NH₄⁺ (atrapado en la luz). Es el mecanismo <b>más importante y el más adaptable</b>: en la acidosis crónica puede aumentar hasta ≈ 500 mEq/día.</li></ul></li></ol>
<p><b>Excreción neta de ácido</b> = acidez titulable + NH₄⁺ − HCO₃⁻ urinario.</p>
<p>Factores que ↑ la secreción de H⁺ y la reabsorción de HCO₃⁻: ↑ PCO₂, ↓ HCO₃⁻, ↓ volumen del LEC, angiotensina II, <b>aldosterona</b>, <b>hipopotasemia</b>.</p>
<h3>Los cuatro trastornos primarios</h3>
<table><tr><th>Trastorno</th><th>Primario</th><th>Compensación esperada</th><th>Causas</th></tr>
<tr><td><b>Acidosis metabólica</b></td><td>↓ HCO₃⁻</td><td>Respiratoria (hiperventilación, <b>respiración de Kussmaul</b>): <b>PCO₂ = 1,5 × HCO₃⁻ + 8 ± 2</b> (Winter)</td><td>Con AG ↑: <b>cetoacidosis</b> (diabética, alcohólica, ayuno), <b>acidosis láctica</b> (shock, hipoxia), <b>insuficiencia renal</b>, tóxicos (metanol, etilenglicol, salicilatos). Con AG normal (hiperclorémica): <b>diarrea</b>, <b>acidosis tubular renal</b>, inhibidores de anhidrasa carbónica</td></tr>
<tr><td><b>Alcalosis metabólica</b></td><td>↑ HCO₃⁻</td><td>Hipoventilación: PCO₂ ↑ ≈ 0,7 por cada mEq/L de HCO₃⁻</td><td><b>Vómitos</b>/sonda nasogástrica (pérdida de HCl), <b>diuréticos</b>, hiperaldosteronismo, hipopotasemia, contracción de volumen, exceso de álcalis</td></tr>
<tr><td><b>Acidosis respiratoria</b></td><td>↑ PCO₂</td><td>Renal: HCO₃⁻ ↑ 1 por cada 10 mmHg (aguda) / 3,5 por cada 10 (crónica)</td><td><b>Hipoventilación</b>: EPOC, depresión del SNC (opioides, sedantes), enfermedades neuromusculares, obstrucción de vía aérea, neumotórax</td></tr>
<tr><td><b>Alcalosis respiratoria</b></td><td>↓ PCO₂</td><td>Renal: HCO₃⁻ ↓ 2 por cada 10 mmHg (aguda) / 5 por cada 10 (crónica)</td><td><b>Hiperventilación</b>: ansiedad, dolor, fiebre, hipoxemia, <b>altura</b>, embarazo, sepsis, TEP, intoxicación salicílica inicial, ventilación mecánica</td></tr></table>
<p><b>Regla de oro</b>: la compensación va en el <b>mismo sentido</b> que el trastorno primario (si baja el HCO₃⁻, baja la PCO₂) y <b>nunca sobrecorrige</b> el pH. Si los valores no coinciden con lo esperado → <b>trastorno mixto</b>.</p>
<h3>Anión gap (brecha aniónica)</h3>
<ul><li><b>AG = Na⁺ − (Cl⁻ + HCO₃⁻)</b> ≈ 8-12 mEq/L (aniones no medidos: albúmina, fosfato, sulfato, ácidos orgánicos). Se reduce ≈ 2,5 por cada g/dL que baja la albúmina.</li>
<li>AG elevado: se acumula un ácido con un anión no medido (lactato, β-hidroxibutirato, sulfatos/fosfatos de la uremia, formiato, glicolato).</li>
<li>AG normal: se pierde HCO₃⁻ y se retiene Cl⁻ (hiperclorémica).</li></ul>
<h3>Interpretación paso a paso de una gasometría</h3>
<ol><li>pH: ¿acidemia o alcalemia?</li><li>¿Qué variable lo explica? HCO₃⁻ (metabólico) o PCO₂ (respiratorio).</li><li>¿La compensación es la esperada? (si no, trastorno mixto).</li><li>Si es acidosis metabólica: calcular el <b>anión gap</b>.</li><li>Correlacionar con la clínica.</li></ol>
<h3>Ácido-base y potasio</h3>
<p>Acidosis → el H⁺ entra a las células y sale K⁺ → <b>hiperpotasemia</b> (≈ 0,6 mEq/L por cada 0,1 de pH). Alcalosis → <b>hipopotasemia</b>. Además la hipopotasemia favorece la alcalosis (↑ secreción de H⁺ y producción de NH₄⁺).</p>
`);

<ul><li><b>Palpación bimanual</b> (normalmente los riñones no se palpan, salvo a veces el polo inferior del derecho en personas delgadas):
<ul><li><b>Maniobra de Guyon</b>: paciente en decúbito dorsal, una mano en la fosa lumbar (ángulo costovertebral) empuja hacia adelante y la otra palpa en el flanco; <b>peloteo renal</b> (contacto lumbar).</li>

<li><b>Puñopercusión lumbar</b> (signo de Giordano/"Murphy renal"): golpe suave con el borde cubital del puño en el ángulo costovertebral; positiva si despierta dolor → pielonefritis, litiasis, distensión de la cápsula.</li>

<h3>Fisiopatología de las manifestaciones del nefrótico</h3>
<ul><li><b>Hipoalbuminemia</b>: la pérdida urinaria supera la síntesis hepática (que está aumentada) + catabolismo tubular de la albúmina filtrada.</li>
<li><b>Hiperlipidemia</b>: el hígado ↑ la síntesis de lipoproteínas en respuesta a la ↓ de la presión oncótica, y ↓ el catabolismo (pérdida de lipoproteinlipasa/factores). ↑ colesterol y LDL.</li>
<li><b>Hipercoagulabilidad</b> (trombosis de la vena renal, TVP, TEP): pérdida urinaria de <b>antitrombina III</b>, proteínas C y S, ↑ fibrinógeno y factores hepáticos, hemoconcentración.</li>
<li><b>Infecciones</b> (peritonitis por neumococo): pérdida de <b>inmunoglobulinas</b> y complemento.</li>
<li>Pérdida de proteínas transportadoras: de vitamina D (hipocalcemia), de tiroxina, de transferrina.</li></ul>
<div class="tip">Truco: <b>nefrítico = "sangre"</b> (hematuria + HTA + oliguria, inflamación); <b>nefrótico = "proteína"</b> (proteinuria masiva + hipoalbuminemia + edema + lípidos). Algunos cuadros mezclan ambos (lupus, GN membranoproliferativa).</div>
<h3>Evaluación</h3>
<ul><li>Orina completa con sedimento, proteinuria de 24 h o índice proteína/creatinina en muestra aislada, función renal (urea, creatinina, FG), albúmina, lípidos, complemento (C3, C4), ASTO, serologías (hepatitis B/C, HIV), ANA. Ecografía. <b>Biopsia renal</b> en adultos con nefrótico o nefrítico sin causa clara.</li></ul>
`);

<h3>Lesión/insuficiencia renal aguda (IRA)</h3>
<p>Disminución <b>abrupta</b> (horas a días) de la función renal con retención de productos nitrogenados (azoemia), alteración del medio interno y a menudo oliguria. Criterios <b>KDIGO</b>: ↑ creatinina ≥ 0,3 mg/dL en 48 h, o ≥ 1,5 veces la basal en 7 días, o diuresis &lt; 0,5 mL/kg/h durante 6 h.</p>
<table><tr><th></th><th><b>Prerrenal</b> (≈ 55-60 %)</th><th><b>Renal / intrínseca</b> (≈ 35-40 %)</th><th><b>Posrenal</b> (≈ 5 %)</th></tr>
<tr><td>Mecanismo</td><td><b>Hipoperfusión renal</b> con riñón estructuralmente sano</td><td>Daño del parénquima</td><td><b>Obstrucción</b> del flujo urinario (bilateral, o unilateral en riñón único) → ↑ presión en Bowman → ↓ FG</td></tr>
<tr><td>Causas</td><td>Hipovolemia (hemorragia, vómitos, diarrea, quemaduras, diuréticos), <b>IC</b> (bajo gasto), shock, cirrosis (síndrome hepatorrenal), fármacos (<b>AINE</b>, IECA/ARA II), estenosis de arteria renal</td><td><b>Necrosis tubular aguda</b> (la más frecuente: isquémica —prerrenal prolongada— o tóxica: aminoglucósidos, contrastes yodados, mioglobina en la rabdomiólisis, hemoglobina), glomerulonefritis, nefritis intersticial aguda (fármacos), vasculares</td><td><b>Hiperplasia prostática</b>, litiasis bilateral, tumores pelvianos (cuello uterino, próstata, vejiga), coágulos, vejiga neurogénica, sonda obstruida</td></tr>
<tr><td>Na⁺ urinario</td><td><b>&lt; 20 mEq/L</b></td><td><b>&gt; 40 mEq/L</b></td><td>Variable</td></tr>
<tr><td>FENa</td><td><b>&lt; 1 %</b></td><td><b>&gt; 2 %</b></td><td>Variable</td></tr>
<tr><td>Osmolaridad urinaria</td><td><b>&gt; 500 mOsm/L</b> (densidad &gt; 1,020)</td><td><b>&lt; 350</b> (≈ isostenuria)</td><td>&lt; 400</td></tr>
<tr><td>BUN/creatinina</td><td>&gt; 20</td><td>&lt; 15</td><td>Variable</td></tr>
<tr><td>Sedimento</td><td>Normal o cilindros hialinos</td><td>NTA: <b>cilindros granulosos "marrones barrosos"</b> y epiteliales. GN: cilindros hemáticos. NIA: leucocitarios, eosinófilos</td><td>Normal o hematuria/cristales</td></tr>
<tr><td>Clave diagnóstica</td><td>Mejora con la reposición de volumen</td><td>No mejora con volumen</td><td><b>Ecografía: hidronefrosis</b>; globo vesical</td></tr></table>
<p>Lógica: en la prerrenal los túbulos funcionan bien y, estimulados por la AII, aldosterona y ADH, <b>retienen Na⁺ y agua con avidez</b> → orina concentrada y pobre en Na⁺. En la NTA los túbulos dañados no pueden reabsorber ni concentrar.</p>
<h3>Fases de la NTA</h3>
<ol><li><b>Inicio</b> (agresión).</li><li><b>Oligúrica/mantenimiento</b> (1-3 semanas): ↓ FG por obstrucción tubular (detritos/cilindros), retrofiltración del filtrado por el epitelio dañado y vasoconstricción. Riesgos: hiperpotasemia, acidosis, sobrecarga de volumen.</li><li><b>Poliúrica</b>: se recupera el FG antes que la función tubular → pérdida de agua y electrolitos (hipopotasemia, deshidratación).</li><li><b>Recuperación</b>.</li></ol>
<h3>Consecuencias de la IRA</h3>
<ul><li>Sobrecarga de volumen (edema, HTA, edema pulmonar), <b>hiperpotasemia</b>, <b>acidosis metabólica</b> con AG ↑, hiponatremia, hiperfosfatemia, hipocalcemia, uremia (encefalopatía, pericarditis, sangrado).</li>
<li>Indicaciones de diálisis urgente ("AEIOU"): <b>A</b>cidosis grave, <b>E</b>lectrolitos (hiperpotasemia refractaria), <b>I</b>ntoxicaciones dializables, sobrecarga de volumen (<b>O</b>verload) refractaria, <b>U</b>remia sintomática (pericarditis, encefalopatía).</li></ul>
<h3>Enfermedad renal crónica (ERC / IRC)</h3>
<p>Alteración de la <b>estructura o función renal durante &gt; 3 meses</b>: <b>FG &lt; 60 mL/min/1,73 m²</b> y/o marcadores de daño (albuminuria ≥ 30 mg/24 h, alteraciones del sedimento, de imágenes o histológicas, trasplante).</p>
<table><tr><th>Estadio</th><th>FG (mL/min/1,73 m²)</th><th></th></tr>
<tr><td>G1</td><td>≥ 90</td><td>Normal o alto (con daño)</td></tr><tr><td>G2</td><td>60-89</td><td>Leve</td></tr><tr><td>G3a</td><td>45-59</td><td>Leve a moderado</td></tr><tr><td>G3b</td><td>30-44</td><td>Moderado a severo</td></tr><tr><td>G4</td><td>15-29</td><td>Severo</td></tr><tr><td>G5</td><td>&lt; 15</td><td>Falla renal (diálisis/trasplante)</td></tr></table>
<p>Se agrega la categoría de albuminuria: A1 &lt; 30, A2 30-300, A3 &gt; 300 mg/g.</p>
<ul><li><b>Causas</b>: <b>diabetes</b> (1.ª), <b>HTA</b> (2.ª), glomerulonefritis crónicas, <b>poliquistosis renal</b>, uropatía obstructiva, nefropatía intersticial (AINE crónicos), pielonefritis crónica.</li>
<li><b>Progresión</b>: al perder nefronas, las remanentes se <b>hiperfiltran</b> (dilatación aferente, ↑ presión glomerular por AII) → esclerosis glomerular → más pérdida (círculo vicioso). Los IECA/ARA II e iSGLT2 enlentecen la progresión al bajar la presión intraglomerular y la proteinuria. Los síntomas aparecen recién con FG &lt; 25-30 % (gran reserva funcional).</li></ul>
<h3>Manifestaciones de la ERC (síndrome urémico)</h3>
<table><tr><th>Alteración</th><th>Mecanismo</th></tr>
<tr><td><b>Anemia</b> normocítica normocrómica</td><td>↓ <b>eritropoyetina</b> (células intersticiales peritubulares); ↓ vida del eritrocito, déficit de hierro, sangrado</td></tr>
<tr><td><b>Enfermedad mineral ósea / osteodistrofia renal</b></td><td>↓ excreción de fosfato (hiperfosfatemia) + ↓ <b>calcitriol</b> (1α-hidroxilasa) → <b>hipocalcemia</b> → <b>hiperparatiroidismo secundario</b> → osteítis fibrosa, osteomalacia, calcificaciones vasculares</td></tr>
<tr><td><b>Acidosis metabólica</b></td><td>↓ excreción de NH₄⁺ y retención de ácidos (AG ↑ en etapas avanzadas)</td></tr>
<tr><td><b>Hiperpotasemia</b></td><td>↓ excreción (tardía, o con fármacos)</td></tr>
<tr><td><b>HTA y sobrecarga de volumen</b></td><td>Retención de Na⁺ y agua, ↑ renina</td></tr>
<tr><td><b>Isostenuria</b> y nicturia</td><td>Pérdida de la capacidad de concentrar/diluir; diuresis osmótica en nefronas remanentes</td></tr>
<tr><td><b>Uremia</b></td><td>Retención de toxinas: náuseas, vómitos, anorexia, aliento urémico, <b>prurito</b>, encefalopatía, neuropatía periférica, <b>pericarditis</b>, <b>disfunción plaquetaria</b> (sangrados), "escarcha urémica"</td></tr>
<tr><td>Cardiovascular</td><td>Principal causa de muerte: aterosclerosis acelerada, HVI, IC</td></tr></table>
<p><b>Ecografía</b>: riñones <b>pequeños</b> y ecogénicos con pérdida de la diferenciación corticomedular (excepto diabetes, poliquistosis, amiloidosis, HIV, que pueden tener riñones de tamaño normal o grande). La anemia, la hipocalcemia/hiperfosfatemia y los riñones chicos orientan a cronicidad frente a la IRA.</p>
<p><b>Tratamiento sustitutivo</b> (G5): hemodiálisis, diálisis peritoneal, trasplante renal.</p>

T('r14','renal','Riñón y diabetes',`
<h3>Glucosa y riñón</h3>
<ul><li>La glucosa se filtra libremente y se reabsorbe ≈ 100 % en el <b>túbulo proximal</b>: <b>SGLT2</b> (segmento S1, ≈ 90 %, 1 Na⁺ : 1 glucosa) y <b>SGLT1</b> (S3, ≈ 10 %, 2 Na⁺ : 1 glucosa); sale a la sangre por <b>GLUT2</b> (difusión facilitada).</li>
<li>Es un transporte <b>saturable</b>: <b>Tm ≈ 375 mg/min</b>; <b>umbral renal</b> ≈ <b>180-200 mg/dL</b> de glucemia. Por encima → <b>glucosuria</b>.</li>
<li>La curva de excreción presenta un "<b>splay</b>" (aparece glucosuria antes de alcanzar el Tm de todo el riñón) porque las nefronas tienen Tm distintos.</li>
<li><b>Glucosuria con glucemia normal</b>: glucosuria renal (defecto de SGLT2), síndrome de Fanconi (disfunción proximal global), embarazo, <b>fármacos iSGLT2</b> (dapagliflozina, empagliflozina: usados en diabetes, IC y ERC).</li></ul>
<h3>Diuresis osmótica</h3>
<ul><li>La glucosa no reabsorbida retiene agua en la luz tubular → <b>poliuria</b> → pérdida de agua y electrolitos → deshidratación → <b>polidipsia</b>. Con la glucosa se pierden calorías → <b>pérdida de peso</b> y <b>polifagia</b>. (Las "4 P" de la diabetes.)</li>
<li>Densidad urinaria alta pese a la poliuria (la glucosa aumenta la densidad).</li></ul>
<h3>Cetoacidosis diabética</h3>
<ul><li>Déficit de insulina + ↑ glucagón → lipólisis → cetogénesis hepática (β-hidroxibutirato, acetoacetato) → <b>acidosis metabólica con anión gap elevado</b>.</li>
<li>Compensación respiratoria: <b>respiración de Kussmaul</b> (profunda y rápida), aliento cetónico ("a manzana").</li>
<li>Deshidratación por diuresis osmótica, náuseas, vómitos, dolor abdominal, alteración de la conciencia.</li>
<li><b>Potasio</b>: aunque el K⁺ corporal total está <b>disminuido</b> (pérdidas urinarias), el K⁺ plasmático puede ser normal o alto (la acidosis y la falta de insulina sacan K⁺ de las células). Al tratar con insulina el K⁺ entra a las células → riesgo de <b>hipopotasemia</b>: hay que reponerlo.</li>
<li>Cetonuria en la orina completa.</li></ul>
<h3>Nefropatía diabética (enfermedad renal diabética)</h3>
<ul><li><b>Primera causa de ERC y de diálisis</b>; aparece tras años de diabetes mal controlada, a menudo junto con retinopatía.</li>
<li>Etapas: (1) <b>hiperfiltración</b> (FG ↑, riñones grandes: la hiperglucemia ↑ la reabsorción proximal de Na⁺-glucosa → llega menos NaCl a la mácula densa → la retroalimentación tubuloglomerular dilata la aferente; la AII contrae la eferente → ↑ presión glomerular); (2) <b>albuminuria moderada</b> (30-300 mg/24 h, antes "microalbuminuria": el marcador más precoz y factor de riesgo cardiovascular); (3) <b>albuminuria severa/proteinuria</b> (&gt; 300 mg; puede llegar a rango nefrótico) con HTA; (4) caída progresiva del FG → ERC terminal.</li>
<li>Histología: <b>engrosamiento de la membrana basal glomerular</b>, expansión mesangial, <b>glomeruloesclerosis nodular (nódulos de Kimmelstiel-Wilson)</b> y difusa, <b>hialinosis de ambas arteriolas</b> (aferente y eferente).</li>
<li>Los riñones pueden mantener un tamaño normal o grande aun con ERC avanzada.</li>
<li>Prevención/tratamiento: control glucémico y de la PA, <b>IECA/ARA II</b> (bajan la presión intraglomerular y la proteinuria), <b>iSGLT2</b> (restauran la retroalimentación tubuloglomerular: ↑ NaCl en la mácula densa → constricción aferente), dejar de fumar, control de lípidos.</li>
<li>Otras complicaciones renales en diabéticos: infecciones urinarias, pielonefritis, necrosis papilar, vejiga neurogénica, mayor riesgo de nefrotoxicidad por contrastes; acidosis tubular tipo 4 (hipoaldosteronismo hiporreninémico → hiperpotasemia).</li></ul>
<h3>Rastreo en el paciente diabético</h3>
<p>Anualmente: <b>índice albúmina/creatinina</b> en orina aislada y <b>FG estimado</b> por creatinina (CKD-EPI); control de PA en cada consulta; fondo de ojo.</p>
